<!DOCTYPE html>
<html lang="en">
<head>
<script src="perf-shim.js"></script>
<meta charset="UTF-8">
<title>NR2003 NBC 2016 Ticker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.en { position: relative; }
/* Chase / playoff drivers: thin yellow bar under the whole entry (position, number, name) instead of a yellow name plate */
.en.chase-en::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 4; pointer-events: none;
                      background: linear-gradient(180deg, #ffe96a 0%, #f5c800 100%); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
:root { --f: 'NBC2016', 'Bahnschrift SemiBold Condensed', 'Bahnschrift Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; }
body { background: transparent; width: 1166px; height: 98px; overflow: hidden; font-family: var(--f); font-weight: 700; color: #fff; }
#scale-root { position: relative; width: 1166px; height: 98px; transform-origin: top left; visibility: hidden; }
#bar { position: absolute; left: 4px; top: 4px; width: 1158px; height: 90px; transition: opacity .2s ease; }
#bar > div { position: absolute; overflow: hidden; }

/* dark steel plate behind everything: the gaps between the blocks are this plate, not the video */
#plate-bg { left: 0; top: 0; width: 1050px; height: 90px; border-radius: 6px 0 0 6px;
            background: linear-gradient(180deg, #343a41 0%, #1a1e23 40%, #0d0f12 100%);
            box-shadow: 0 0 0 1px rgba(150,158,168,.75), 0 2px 6px rgba(0,0,0,.55); overflow: visible !important; }

/* steel cap on the left (rows 1-2) */
#cap-l { left: 0; top: 0; width: 17px; height: 65px; border-radius: 6px 0 0 6px;
         background: linear-gradient(90deg, #a3aab3 0%, #727982 45%, #4b5159 100%);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 3px rgba(0,0,0,.5); }

/* ── row 1: series logo · TOP 3 · three leaders · track | lap · steel block ── */
#t-series { left: 15px; top: 0; width: 239px; height: 34px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #2c2c2e 0%, #060607 22%, #000 100%); }
#series-logo { display: none; max-width: 226px; max-height: 32px; object-fit: contain; }
#t-title { left: 256px; top: 0; width: 166px; height: 34px;
           background: linear-gradient(180deg, #8d9195 0%, #3d4043 24%, #131415 66%, #000 100%); }
#t-title .sl { position: absolute; left: 17px; top: 0; bottom: 0; width: 38px; opacity: .85;
               background: repeating-linear-gradient(110deg, transparent 0 3px, #c2c6cb 3px 7px, transparent 7px 11px); }
#t-title .tt { position: absolute; left: 64px; top: 0; height: 34px; line-height: 34px; font-size: 30px; font-style: italic;
               color: #eef0f2; text-shadow: 0 2px 3px rgba(0,0,0,.8); white-space: nowrap; }
#t-title .tt b { font-size: 42px; }
#t-leaders { left: 424px; top: 0; width: 378px; height: 34px; display: flex; }
.ld { position: relative; flex: 1; height: 34px; overflow: hidden; }
.ld + .ld { box-shadow: inset 1px 0 0 rgba(0,0,0,.45); }
.ld::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
             background: linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,.25) 100%); }
/* the driver picture is an OVAL on the left: it can never cover the number, even with an opaque background */
.ph { position: absolute; left: 4px; top: 1px; width: 48px; height: 32px; z-index: 2; border-radius: 50%;
      object-fit: cover; object-position: center 15%; background: rgba(255,255,255,.15);
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 1px 4px rgba(0,0,0,.55); opacity: 0; transition: opacity .4s ease; }
.ph.cars, .ph.manu { object-fit: contain; object-position: center; padding: 2px; }
.ph.manu { background: rgba(255,255,255,.92); }
.ld .np { position: absolute; inset: 0; width: auto; height: auto; border-radius: 0; background: none; }
.ld .np img { inset: auto; left: 58px; top: 1px; width: calc(100% - 62px); height: calc(100% - 2px); }
.ld .np .np-t { left: 58px; right: 4px; font-size: 28px; }
#t-lap { left: 804px; top: 0; width: 244px; height: 34px; display: flex; align-items: center; justify-content: center; transition: background .25s, color .7s ease;
         color: #e3f8e1; text-shadow: 0 1px 2px rgba(0,0,0,.55);
         background: linear-gradient(180deg, #5db463 0%, #2a8a33 14%, #0f6a1b 55%, #0a4f14 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
#t-lap[data-bg="yellow"]    { background: linear-gradient(180deg, #ffe96a 0%, #f7cf1a 30%, #d9ad00 100%); }
#t-lap[data-bg="red"]       { background: linear-gradient(180deg, #ff6a6a 0%, #e01616 40%, #8f0a0a 100%); }
#t-lap[data-bg="white"]     { background: linear-gradient(180deg, #f6f6f6 0%, #e6e7e8 55%, #cfd1d3 100%); }
#t-lap[data-bg="checkered"] { background: linear-gradient(180deg, #4a4d52 0%, #15171a 40%, #000 100%); }
#t-lap .sw { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#t-lap[data-mode="yellow"]    { color: #1a1405; text-shadow: none; }
#t-lap #lp { position: relative; z-index: 1; }

/* ── finish intro: race name on a dark band over TOP 3 + leaders ── */
#t-race { left: 256px; top: 0; width: 546px; height: 34px; display: none; align-items: center; justify-content: center; z-index: 6; pointer-events: none;
          background: linear-gradient(180deg, #8d9195 0%, #3d4043 24%, #131415 66%, #000 100%); }
#t-race-txt { display: inline-block; font-size: 28px; font-weight: 600; text-transform: uppercase; color: #eef0f2; letter-spacing: .01em;
              text-shadow: 0 2px 3px rgba(0,0,0,.8); white-space: nowrap; }
/* ── winner view (after the leader crosses the line): WINNER | photo + number + full name on the car colour | RESULTS ── */
#t-title.win .sl { display: none; }
#t-title.win .tt { left: 0; right: 0; text-align: center; font-style: normal; font-size: 30px; letter-spacing: .01em; }
.ld.win { flex: 1 1 100%; }
.ld.win .np { inset: auto; left: 58px; top: 0; width: 116px; height: 34px; background: none; }
.ld.win .np-c { display: none; }
.ld.win .np img { inset: auto; left: 0; top: 1px; width: 100%; height: calc(100% - 2px); object-fit: contain; }
.ld.win .np .np-t { left: 0; right: 0; font-size: 28px; }
.ld.win .wn { position: absolute; left: 180px; right: 6px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
              overflow: hidden; white-space: nowrap; font-size: 26px; font-weight: 700; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.45); z-index: 1; }
#t-lap[data-mode="red"]       { color: #fff; }
#t-lap[data-mode="white"]     { color: #4a4d50; text-shadow: none; }
#t-lap[data-mode="checkered"] { color: #fff; }
#lp { display: inline-flex; align-items: center; gap: 11px; font-size: 26px; font-weight: 600; white-space: nowrap; text-transform: uppercase; }
#lp .vsep { width: 1px; height: 26px; background: currentColor; opacity: .55; }
#t-side { left: 1050px; top: 0; width: 108px; height: 65px; border-radius: 0 6px 6px 0;
          background: linear-gradient(180deg, #bcc3cc 0%, #8c939c 12%, #6e747c 55%, #545a61 100%);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.5); }
/* Side TV logo (same spot and sizing as NBC 2017 Shart Edition): --side-logo-scale makes it bigger (1 = original look). The box clips any overflow. */
#t-side { overflow: hidden; --side-logo-scale: 1.5; }
#side-img { display: none; width: 100%; height: 100%; object-fit: contain; padding: 0; transform: scale(var(--side-logo-scale)); transform-origin: center center; }

/* ── rows 2-3: five cars (position · number · name) and the interval strip under them ── */
#bar > #pager { left: 15px; top: 36px; width: 1033px; height: 53px; overflow: visible; transition: opacity .25s ease, transform .25s ease; }
#pager.fade { opacity: 0; transform: translateY(-4px); }
#ents { display: flex; height: 27px; }
.en { flex: 1; min-width: 0; display: flex; background: #000; }
.pb { width: 31px; flex: none; display: flex; align-items: center; padding-left: 5px; overflow: hidden;
      background: linear-gradient(180deg, #2c2d30 0%, #0a0a0b 22%, #000 100%); }
/* plate: white steel strip that clips the sliding unit (badge + name) while the page changes */
.pl { position: relative; flex: 1; min-width: 0; overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #f0f1f2 40%, #d3d5d8 100%);
      box-shadow: inset 0 1px 0 #fff, inset -1px 0 0 rgba(0,0,0,.25); }
.un { position: absolute; inset: 0; display: flex; will-change: transform; }
.bw { width: 38px; flex: none; background: linear-gradient(180deg, #2c2d30 0%, #0a0a0b 22%, #000 100%); }
.pos { width: 21px; margin-right: 5px; text-align: right; font-size: 19px; font-weight: 500; color: #f2f2f2; font-variant-numeric: tabular-nums; }
.np { position: relative; width: 38px; height: 27px; overflow: hidden; background: #3b3f47; flex: none; }
.np-c { position: absolute; inset: 0; }
.np img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.np .np-t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 21px; font-style: italic; font-weight: 800; letter-spacing: -.5px; }
.nm { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 4px; overflow: hidden; white-space: nowrap;
      font-size: 26px; font-weight: 600; text-transform: uppercase; color: #383838; letter-spacing: .01em;
      background: linear-gradient(180deg, #ffffff 0%, #f0f1f2 40%, #d3d5d8 100%);
      box-shadow: inset 0 1px 0 #fff, inset -1px 0 0 rgba(0,0,0,.25); }
#plate-bg { transition: height .3s ease; }
#bar.nogaps #plate-bg { height: 65px; }
#gaps { overflow: hidden; transition: height .3s ease, margin-top .3s ease, opacity .2s ease; }
#bar.nogaps #gaps { height: 0; margin-top: 0; opacity: 0; }
#gaps { display: flex; height: 25px; margin-top: 1px;
        background: linear-gradient(180deg, #6b7375 0%, #4f5759 45%, #394042 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.gc { flex: 1; min-width: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding-left: 69px;
      font-size: 24px; font-weight: 500; color: #f4f6f7; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gc + .gc { box-shadow: inset 1px 0 0 rgba(0,0,0,.35); }
.lb { position: absolute; left: 6px; top: 0; height: 25px; display: flex; align-items: center;
      font-size: 15px; font-weight: 600; color: #eef1f2; letter-spacing: .02em; }

/* ── caution intro: full-width yellow strip that covers the cars row ── */
#cs-wrap { left: 15px; top: 36px; width: 1033px; height: 27px; display: none; z-index: 20; pointer-events: none; }
#cs-strip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; will-change: transform;
            background: linear-gradient(180deg, #ffe96a 0%, #f7cf1a 30%, #d9ad00 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.25); }
#cs-text { display: inline-block; line-height: 27px; font-size: 23px; font-weight: 800; font-style: italic; text-transform: uppercase;
           color: #17120a; white-space: nowrap; letter-spacing: .02em; padding-left: .02em; will-change: transform; }
/* ── Driver Info Banner (hotkey): [number | manufacturer | name | optional text] on the driver's colour, fades in / out ── */
#di-wrap { position: absolute; left: 4px; top: 130px; width: 700px; transform-origin: 0 0; z-index: 40; pointer-events: none; display: none; opacity: 0; transition: opacity .6s ease; }
#di-tab { position: absolute; right: 8px; top: -26px; height: 26px; padding: 0 16px; display: none; align-items: center; border-radius: 5px 5px 0 0;
          background: linear-gradient(180deg, #1c2330 0%, #0b0f16 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px rgba(150,158,168,.6);
          font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
#di-box { position: relative; height: 80px; display: flex; overflow: hidden; border-radius: 5px; background: var(--di-bg, linear-gradient(180deg, #2b4b8f 0%, #16357a 36%, #08194a 70%, #040c2b 100%)); color: var(--di-fg, #fff);
          box-shadow: 0 0 0 2px #8f979f, 0 0 0 3px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.55); }
#di-box::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
                 background: linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,.30) 100%); }
#di-box > div { position: relative; z-index: 1; display: flex; align-items: center; height: 100%; }
#di-box > div + div { box-shadow: inset 1px 0 0 rgba(0,0,0,.4), inset 2px 0 0 rgba(255,255,255,.18); }
#di-num { width: 170px; flex: none; justify-content: center; }
#di-num .np { width: 140px; height: 66px; background: none; }
#di-num .np-c { display: none; }
#di-num .np img { inset: auto; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
#di-num .np .np-t { left: 0; right: 0; font-size: 56px; font-style: italic; }
#di-manu { width: 110px; flex: none; justify-content: center; }
#di-manu img { max-width: 86px; max-height: 60px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
#di-name { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start !important; justify-content: center; padding: 0 22px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
#di-name .f { font-size: 26px; font-weight: 600; opacity: .95; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
#di-name .l { font-size: 38px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.4); margin-top: 2px; }
#di-r { flex: none; width: 232px; overflow: hidden; flex-direction: column; align-items: flex-start !important; justify-content: center; padding: 0 18px; line-height: 1.15; white-space: nowrap; }
#di-r .a { font-size: 28px; font-weight: 600; }
#di-r .b { font-size: 21px; font-weight: 700; color: var(--di-accent, #ffd21f); text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
#di-r .b .ar { flex: none; }
#di-num .np .np-t { color: var(--di-fg, #fff) !important; }
/* di-css-end */
</style>
</head>
<body>
<div id="scale-root">
  <div id="bar">
    <div id="plate-bg"></div>
    <div id="cap-l"></div>
    <div id="t-series"><img id="series-logo" src="" alt=""></div>
    <div id="t-title"><i class="sl"></i><span class="tt">TOP <b>3</b></span></div>
    <div id="t-leaders"></div>
    <div id="t-lap" data-mode=""><span id="lp"><span id="lp-a"></span><i class="vsep" id="lp-s"></i><span id="lp-b"></span></span></div>
    <div id="t-side"><img id="side-img" src="" alt=""></div>
    <div id="t-race"><span id="t-race-txt"></span></div>
    <div id="pager"><div id="ents"></div><div id="gaps"></div></div>
    <div id="cs-wrap"><div id="cs-strip"><span id="cs-text">CAUTION</span></div></div>
  </div>
  <div id="di-wrap">
    <div id="di-tab"></div>
    <div id="di-box">
      <div id="di-num"></div>
      <div id="di-manu"></div>
      <div id="di-name"></div>
      <div id="di-r" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// ── Chase (highlighted cars) ───────────────────────────────────────────────
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
function _chasePass() {
  document.querySelectorAll('[data-chase-num]').forEach(el => {
    const on = _CHASE.size > 0 && _CHASE.has(el.dataset.chaseNum);
    el.classList.toggle('chase', on);
    const en = el.closest ? el.closest('.en') : null;
    if (en) en.classList.toggle('chase-en', on);
  });
}
function _setChase(list) {
  _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey));
  _chasePass();
}
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}

// ── PSF bootstrap ──────────────────────────────────────────────────────────
const psf           = window.__PSF || {};
const params        = new URLSearchParams(location.search);
const INSTALL_DIR   = psf.installDir || params.get('installdir') || '';
const SCALE         = parseFloat(psf.scale   || params.get('scale')   || '1');
const OPACITY       = parseFloat(psf.opacity || params.get('opacity') || '1');
const WS_URL        = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;
const SERIES_ID     = psf.series || params.get('series') || '';
let   SERIES_NAME   = psf.seriesname || params.get('seriesname') || '';
let   ROTATION_MS   = (parseInt(psf.sponsorrotationtime || params.get('sponsorrotationtime') || '10')) * 1000;
let VISIBILITY_MODE = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let DNF_DISPLAY     = psf.dnfdisplay || params.get('dnfdisplay') || 'reason';
const PAGE_MS       = Math.max(2, parseInt(psf.pagetime || params.get('pagetime') || '10')) * 1000;   // seconds each page of the field stays up
// Race name shown on the green plate ("DAYTONA 500"). Edit it in the layout editor ("Race Name");
// if left empty the track name from the sim is used.
let customName = psf.customname ? decodeURIComponent(psf.customname)
               : (params.get('customname') ? decodeURIComponent(params.get('customname')) : '');
let _trackShort = '';
const TO_GO_FROM = 2 / 3;        // lap counter switches from "LAP X OF Y" to "N LAPS TO GO" after this fraction of the race
const LAST_NAME_ONLY = true;

function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + rel;
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + rel;
  }
  return rel;
}
const NBC_BASE = assetPath('images/NBC2016');

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NBC_W = 1166, NBC_H = 98, PER_PAGE = 5;
// Optional font: drop a font.ttf into images/NBC2016 to replace the fallback font.
(function injectFonts() {
  const el = document.createElement('style');
  el.textContent = `@font-face { font-family:'NBC2016'; src:url('${NBC_BASE}/font.ttf') format('truetype'); font-weight:700; font-display:swap; }`;
  document.head.appendChild(el);
})();

// ── Scale ───────────────────────────────────────────────────────────────────
const root = document.getElementById('scale-root');
root.style.transform = `scale(${SCALE})`;
document.body.style.width  = Math.round(NBC_W * SCALE) + 'px';
document.body.style.height = Math.round(NBC_H * SCALE) + 'px';
const $ = id => document.getElementById(id);
const barEl = $('bar');

// ── Visibility ──────────────────────────────────────────────────────────────
let _preview = false;
function checkVisibility(d) {
  if (_preview) return true;
  switch (VISIBILITY_MODE) {
    case 'always': return true;
    case 'in_car': return !!(d.atTrack && d.player?.inCar);
    default:       return !!d.atTrack;
  }
}
function setVisible(v) { root.style.visibility = v ? 'visible' : 'hidden'; barEl.style.opacity = v ? OPACITY : '0'; }

// ── Series logo (top left) + optional side-box image ────────────────────────
(function () {
  const img = $('series-logo');
  img.onload  = () => { img.style.display = 'block'; };
  img.onerror = () => { img.style.display = 'none'; };
  img.src = SERIES_ID ? assetPath(`series/${SERIES_ID}/serieslogo.png`) : assetPath('images/nr2003_logo.svg');
  // TV logo in the grey box on the right (same position as NBC 2017 Shart Edition). First file found wins:
  //   images/NBC2016/tvlogo.png  ->  images/NBC2016/sponsor.png (old name)  ->  images/NBC2017/tvlogo.png (the Shart Edition logo)
  const sp = $('side-img');
  const sideCands = [`${NBC_BASE}/tvlogo.png`, `${NBC_BASE}/sponsor.png`, assetPath('images/NBC2017/tvlogo.png')];
  let sideIdx = 0;
  sp.onload = () => { sp.style.display = 'block'; };
  sp.onerror = () => { if (++sideIdx < sideCands.length) sp.src = sideCands[sideIdx]; else sp.style.display = 'none'; };
  sp.src = sideCands[0];
})();

// ── Car numbers (series/<id>/numbers/<num>.png), probed once and cached ─────
let _driverColors = {};
const _numInfo = {};
const FB_DEFAULT_BG = '#3b3f47';
const _ccCtx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const _lumCache = {};
function bgLuma(c) {
  if (!c || c === 'transparent') return -1;
  if (_lumCache[c] !== undefined) return _lumCache[c];
  let v = -1;
  try {
    _ccCtx.clearRect(0, 0, 1, 1); _ccCtx.fillStyle = '#000'; _ccCtx.fillStyle = c; _ccCtx.fillRect(0, 0, 1, 1);
    const d = _ccCtx.getImageData(0, 0, 1, 1).data;
    if (d[3] >= 32) v = (0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]) / 255;
  } catch (_) {}
  return (_lumCache[c] = v);
}
function sampleCorners(img) {
  try {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const w = c.width, h = c.height, i = 3;
    const px = [g.getImageData(i, i, 1, 1).data, g.getImageData(w - i - 1, i, 1, 1).data,
                g.getImageData(i, h - i - 1, 1, 1).data, g.getImageData(w - i - 1, h - i - 1, 1, 1).data];
    const op = px.filter(p => p[3] >= 32);
    if (op.length < 3) return null;
    const a = op.reduce((t, p) => [t[0] + p[0], t[1] + p[1], t[2] + p[2]], [0, 0, 0]).map(v => Math.round(v / op.length));
    return `rgb(${a[0]},${a[1]},${a[2]})`;
  } catch (_) { return null; }

// Points to the cutoff line (only while the cutoff line is on in the Championship screen): points above / below it in the live championship

function diKindText(kind, inf, i, d, s, num) {

  const key = String(d.sessionCookie) + '|' + String(d.track);
  const past = _season.races.filter(r => r.key !== key);            // stored races, not counting the one on screen
  const mine = r => (r.rows || []).find(x => normNum(x.number) === num);

    }

    }

      return c ? 'Has pitted ' + c + (c === 1 ? ' time' : ' times') : (isRace ? 'Yet to pit' : '');
    }
    case 'lastPit': {
      const l = isRace && _pit.key === key ? _pit.last[num] : 0;

        p = (_srvStart.start && _srvStart.start[nn]) || (_srvStart.qual && _srvStart.qual[nn]) || ((_srvStart.grid && String(_srvStart.key) === String(d.sessionCookie) + '|' + trk) ? (_srvStart.grid[nn] || 0) : 0) || 0;
      }

// text of line i (1 or 2) for this driver; entries saved before kinds existed are plain custom text
function diLine(inf, i, d, s, num) {

}
// Smooth change from one driver to the next while the banner is up: a copy of the card as it was stays on top and dissolves,

const DI_SWAP_MS = 200;
let _diShownCar = null;

// Put the banner near the bottom of the screen. The overlay window only covers the ticker, so it is stretched down to the

async function diPlace() {

function connect() {
