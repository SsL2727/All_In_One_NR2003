/* Before the race (gridding / pacing): only the header (LCD + series logo) is shown, no black standings box */
#board.pre::before { clip-path: inset(0 0 846px 0); }   /* template header ends at y=116 */
#board.pre #colhead, #board.pre #rows { visibility: hidden; }

#head { position: absolute; left: 0; top: 0; width: 336px; height: 113px; }

/* ── Flag banners (CAUTION / GREEN FLAG): slide over the LCD from the right ── */
.flagbn { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: translateX(100%); overflow: hidden;
  display: flex; align-items: center; justify-content: center; border-radius: 5px 5px 0 0; will-change: transform; }
.flagbn::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 48%; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .04)); }
.flagbn .ft { position: relative; z-index: 1; display: block; width: 100%; text-align: center; white-space: nowrap; overflow: hidden;
  font-size: 36px; line-height: 53px; font-style: italic; letter-spacing: .15em; padding-left: .15em; }
#flag-y { background: linear-gradient(180deg, #ffd23c 0%, #f3b412 46%, #d99600 54%, #c98a00 100%); color: #1b1407;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), inset 0 -3px 6px rgba(120, 70, 0, .35); }
#flag-y .ft { text-shadow: 0 1px 0 rgba(255, 236, 160, .6); }
#flag-g { background: linear-gradient(180deg, #58c244 0%, #36932a 46%, #2a8420 54%, #1c6613 100%); color: #fff;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), inset 0 -3px 6px rgba(0, 50, 0, .35); }
#flag-g .ft { text-shadow: 0 2px 2px rgba(0, 40, 0, .55); }

/* ── Header: teal glass LCD over the green slot, white plate over the blue slot ── */
#lcdwrap { position: absolute; left: 11px; top: 3px; width: 315px; height: 53px; border-radius: 5px 5px 0 0; overflow: hidden; }
#lcd {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  border-radius: 5px 5px 0 0;
  background: linear-gradient(180deg, #0f7380 0%, #0a5560 48%, #06333b 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .55), inset 0 0 14px rgba(110, 230, 245, .22);
  text-align: center; color: #8ff0fa;
  text-shadow: 0 0 5px rgba(120, 230, 245, .85), 0 0 12px rgba(70, 200, 220, .4);
  overflow: hidden;
}
#lcd.caution { background: linear-gradient(180deg, #5c4208 0%, #3b2a05 48%, #201603 100%); color: #ffd23c;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .55), inset 0 0 14px rgba(255, 190, 40, .22);
  text-shadow: 0 0 5px rgba(255, 205, 70, .8), 0 0 12px rgba(255, 170, 0, .4); }
#lcd::after {   /* glass highlight on the upper half */
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 46%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .02));
  pointer-events: none;
}
#title { position: absolute; left: 6px; right: 6px; top: 2px;  height: 24px; line-height: 25px; font-size: 22px; white-space: nowrap; overflow: hidden; letter-spacing: .3px; }
#lap   { position: absolute; left: 6px; right: 6px; top: 24px; height: 29px; line-height: 30px; font-size: 28px; white-space: nowrap; overflow: hidden; letter-spacing: .4px; }
#lap small { font-size: .72em; }
#logo {
  position: absolute; left: 11px; top: 60px; width: 315px; height: 52px;
  border-radius: 0 0 5px 5px;
  background: linear-gradient(180deg, #ffffff 0%, #eef2f4 62%, #d4dbdf 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .45);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
#logo img { max-height: 40px; max-width: 290px; object-fit: contain; display: block; }
#logo span { color: #11242b; font-size: 24px; letter-spacing: .5px; }

/* ── Column header (black bar comes from the template, only text here) ── */
#colhead { position: absolute; left: 0; top: 117px; width: 336px; height: 22px; color: #fff; font-size: 19px; line-height: 23px; letter-spacing: .3px; }
#ch-l { position: absolute; left: 47px; white-space: nowrap; }
#ch-r { position: absolute; right: 55px; white-space: nowrap; }

/* ── Rows: positioned on the template's 20 slots ── */
#rows { position: absolute; left: 0; top: 0; width: 336px; height: 963px; }
.row { position: absolute; left: 5px; width: 327px; color: #fff; font-size: 23px; line-height: var(--h); }
.row.me { background: linear-gradient(180deg, rgba(90, 150, 220, .38), rgba(40, 80, 130, .38)); }
.row { overflow: hidden; }
.row.dim .cont, .row.dim .pos { opacity: .36; }
.row > *, .cont > * { position: absolute; top: 0; height: var(--h); text-shadow: 0 1px 1px rgba(0, 0, 0, .7); }
.cont { left: 0; width: 100%; will-change: transform; }
.pos { will-change: transform; }
.pos  { left: 3px; width: 35px; text-align: right; font-size: 22px; overflow: hidden; white-space: nowrap; }
.chip {
  left: 41px; top: 50%; margin-top: -11px; width: 28px; height: 22px; border-radius: 3px;
  background: #3b3f47; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28), inset 0 -6px 8px rgba(0, 0, 0, .25), inset 0 5px 6px rgba(255, 255, 255, .14);
  font-size: 17px; line-height: 22px; text-align: center; letter-spacing: -.3px; overflow: hidden;
}
.chip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.chip.img { background: transparent; box-shadow: none; }
.name { left: 99px; width: 137px; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: clip; letter-spacing: .5px; }
.name.chase { color: #ffd23c; }
.gap  { left: 238px; width: 68px; text-align: right; white-space: nowrap; overflow: hidden; letter-spacing: .2px; }
.gap.lead { font-size: 22px; }

/* ── Driver Info banner (ported from NBC 2016) ── */
.np { position: relative; width: 38px; height: 27px; overflow: hidden; background: #3b3f47; flex: none; }
.np-c { position: absolute; inset: 0; }
.np img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.np .np-t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 21px; font-style: italic; font-weight: 800; letter-spacing: -.5px; }
/* ── Driver Info Banner (hotkey): [number | manufacturer | name | optional text] on the driver's colour, fades in / out ── */
#di-wrap { position: absolute; left: 4px; top: 130px; width: 700px; transform-origin: 0 0; z-index: 40; pointer-events: none; display: none; opacity: 0; transition: opacity .6s ease; }
#di-tab { position: absolute; right: 8px; top: -26px; height: 26px; padding: 0 16px; display: none; align-items: center; border-radius: 5px 5px 0 0;
          background: linear-gradient(180deg, #1c2330 0%, #0b0f16 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px rgba(150,158,168,.6);
          font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
#di-box { position: relative; height: 80px; display: flex; overflow: hidden; border-radius: 5px; background: var(--di-bg, linear-gradient(180deg, #2b4b8f 0%, #16357a 36%, #08194a 70%, #040c2b 100%)); color: var(--di-fg, #fff);
          box-shadow: 0 0 0 2px #8f979f, 0 0 0 3px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.55); }
#di-box::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
                 background: linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,.30) 100%); }
#di-box > div { position: relative; z-index: 1; display: flex; align-items: center; height: 100%; }
#di-box > div + div { box-shadow: inset 1px 0 0 rgba(0,0,0,.4), inset 2px 0 0 rgba(255,255,255,.18); }
#di-num { width: 170px; flex: none; justify-content: center; }
#di-num .np { width: 140px; height: 66px; background: none; }
#di-num .np-c { display: none; }
#di-num .np img { inset: auto; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
#di-num .np .np-t { left: 0; right: 0; font-size: 56px; font-style: italic; }
#di-manu { width: 110px; flex: none; justify-content: center; }
#di-manu img { max-width: 86px; max-height: 60px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
#di-name { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start !important; justify-content: center; padding: 0 22px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
#di-name .f { font-size: 26px; font-weight: 600; opacity: .95; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
#di-name .l { font-size: 38px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.4); margin-top: 2px; }
#di-r { flex: none; width: 232px; overflow: hidden; flex-direction: column; align-items: flex-start !important; justify-content: center; padding: 0 18px; line-height: 1.15; white-space: nowrap; }
#di-r .a { font-size: 28px; font-weight: 600; }
#di-r .b { font-size: 21px; font-weight: 700; color: var(--di-accent, #ffd21f); text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
#di-r .b .ar { flex: none; }
#di-num .np .np-t { color: var(--di-fg, #fff) !important; }
/* di-css-end */
#di-r .a { text-transform: none; }
#di-wrap, #di-wrap * { font-family: inherit; }
</style>
</head>
<body>
<div id="app" style="display:none">
  <div id="scale-root">
    <div id="board">
      <div id="head">
        <div id="lcdwrap">
          <div id="lcd">
            <div id="title"></div>
            <div id="lap"></div>
          </div>
          <div id="flag-y" class="flagbn"><span class="ft">CAUTION</span></div>
          <div id="flag-g" class="flagbn"><span class="ft">GREEN FLAG</span></div>
        </div>
        <div id="logo"><img id="logo-img" alt=""><span id="logo-txt" style="display:none"></span></div>
      </div>
      <div id="colhead"><span id="ch-l">BEHIND LEADER</span><span id="ch-r">SEC</span></div>
      <div id="rows"></div>
    </div>
    <div id="di-wrap">
      <div id="di-tab"></div>
      <div id="di-box">
        <div id="di-num"></div>
        <div id="di-manu"></div>
        <div id="di-name"></div>
        <div id="di-r" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Chase highlight (drivers in the championship chase get a gold name) ─────
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
function _setChase(list) { _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey)); _lastRowsKey = ''; if (_latestData) renderAll(_latestData); }
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}

// ── PSF bootstrap ─────────────────────────────────────────────────────────
const psf         = window.__PSF || {};
const params      = new URLSearchParams(location.search);
const INSTALL_DIR = psf.installDir || params.get('installdir') || '';
let SERIES_ID     = psf.series || params.get('series') || 'default';
let SERIES_NAME   = params.get('seriesname') || SERIES_ID;
const WS_URL      = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;

const SCALE   = Math.max(0.1, Math.min(4.0, parseFloat(psf.scale   || params.get('scale')   || '1.0')));
const OPACITY = Math.max(0.0, Math.min(1.0, parseFloat(psf.opacity || params.get('opacity') || '1.0')));
let VISIBILITY_MODE = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let customName      = psf.customname ? decodeURIComponent(psf.customname) : (params.get('customname') ? decodeURIComponent(params.get('customname')) : '');

(function applyScaleOpacity() {
  document.getElementById('scale-root').style.transform = `scale(${SCALE})`;
  document.getElementById('board').style.opacity = OPACITY;
})();

function encodeRelPath(rel) { return rel.split('/').map(encodeURIComponent).join('/'); }
function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + encodeRelPath(rel);
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + encodeRelPath(rel);
  }
  return encodeRelPath(rel);
}
(function injectFont() {
  const el = document.createElement('style');
  el.textContent = "@font-face { font-family:'D-DIN Condensed Bold'; src:url('" + assetPath('images/ticker/DIN Condensed Bold.ttf') + "') format('truetype'); font-weight:bold; font-style:normal; font-display:swap; }";
  document.head.appendChild(el);
})();

// ── Series logo (series/<id>/serieslogo.png, else the default logo, else the series name) ──
function loadSeriesLogo() {
  const im = document.getElementById('logo-img'), tx = document.getElementById('logo-txt');
  const isDefault = !SERIES_ID || SERIES_ID === 'default';
  const cands = [];
  if (!isDefault) cands.push(assetPath(`series/${SERIES_ID}/serieslogo.png`));
  cands.push(assetPath('images/nr2003_logo.svg'));
  let k = 0;
  tx.style.display = 'none'; im.style.display = '';
  im.onerror = () => {
    if (++k < cands.length) im.src = cands[k];
    else { im.style.display = 'none'; tx.textContent = isDefault ? 'NR2003' : SERIES_NAME; tx.style.display = ''; }
  };
  im.src = cands[0];
}
loadSeriesLogo();

// ── Helpers ───────────────────────────────────────────────────────────────
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let _driverColors = {};

function numImgSrc(num) {
  const n = String(num || '').trim();
  if (!n || n === '??') return '';
  if (!SERIES_ID || SERIES_ID === 'default') return '';
  return assetPath(`series/${SERIES_ID}/numbers/${n}.png`);
}
// The bridge appends a rookie marker to entry.name ("Alonso R", "Alonso (R)", "Alonso *"): split it off and show it as " (R)"
const ROOKIE_TAIL = /(?:\s*[\(\[]\s*R\s*[\)\]]|\s+[-\u2013*]?\s*R\*?|\s*\*)\s*$/i;
function splitRookie(raw) {
  let s = String(raw == null ? '' : raw).trim(), rookie = false;
  for (let k = 0; k < 2; k++) {
    const m = s.match(ROOKIE_TAIL);
    if (!m || m.index === 0) break;
    s = s.slice(0, m.index).trim(); rookie = true;
  }
  return { name: s, rookie };
}
function lastName(entry) {          // "J. Johnson" -> "JOHNSON", "Jimmie Johnson" -> "JOHNSON", rookies get " (R)"
  const sp = splitRookie(entry.name || entry.fullName || '?');
  const n = sp.name;
  let out;
  const m = n.match(/^[A-Za-z]\.\s*(.+)$/);
  if (m) out = m[1];
  else { const parts = n.split(/\s+/); out = parts.length > 1 ? parts.slice(1).join(' ') : n; }
  return out + ((sp.rookie || entry.rookie === true || entry.isRookie === true) ? ' (R)' : '');
}
function bgLuma(c) {
  try {
    const cv = bgLuma._c || (bgLuma._c = document.createElement('canvas').getContext('2d', { willReadFrequently: true }));
    cv.clearRect(0, 0, 1, 1); cv.fillStyle = '#000'; cv.fillStyle = c; cv.fillRect(0, 0, 1, 1);
    const p = cv.getImageData(0, 0, 1, 1).data;
    return (0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2]) / 255;
  } catch (_) { return 0; }
}
function fmtGap(entry, isLeader, isPQ, ahead) {    // race: interval to the car in front (not to the leader)
  const status = String(entry.status || '').trim().toLowerCase();
  if (status && status !== 'running' && status !== 'pitting') return status.toUpperCase().slice(0, 9);
  if (isPQ) { const bl = entry.bestLap || entry.lastLap || entry.time || 0; return bl > 0 ? Number(bl).toFixed(3) : ''; }
  if (isLeader) return 'Leader';
  const down = entry.lapsDown || 0, aheadDown = ahead ? (ahead.lapsDown || 0) : 0;
  const t = entry.time || 0, ta = ahead ? (ahead.time || 0) : 0;
  const lapsTxt = `\u2212${down} LAP${down > 1 ? 'S' : ''}`;
  if (down > aheadDown) return lapsTxt;                              // a lap (or more) behind the car in front
  if (down > 0) return (t > 0 && ta > 0 && t > ta) ? `\u2212${(t - ta).toFixed(3)}` : lapsTxt;   // both lapped: seconds if the data has them
  if (!ahead) return t > 0 ? `\u2212${t.toFixed(3)}` : '';
  const iv = t - ta;                                                 // both on the lead lap: gap to leader minus the car ahead's gap
  return (t > 0 && iv >= 0) ? `\u2212${iv.toFixed(3)}` : '';
}
function getStandings(d) {
  const isPQ  = ['practice', 'qualifying', 'testing'].includes((d.session || '').toLowerCase());
  const state = (d.sessionState || '').toLowerCase();
  const liveEnabled = d.liveStandingsEnabled !== false;
  if (isPQ) return d.standings || [];
  if (state === 'cool down' || state === 'get in car' || state === 'warmup' || state === 'parade laps') return d.standings || [];
  if (state === 'checkered' && liveEnabled && Array.isArray(d.computedStandings) && d.computedStandings.length) return d.computedStandings;
  const live = d.liveStandings || d.standings || [];
  return (liveEnabled && live.length) ? live : (d.standings || []);
}
function fit(el, maxPx, minPx) {
  let sz = maxPx; el.style.fontSize = sz + 'px';
  while (el.scrollWidth > el.clientWidth + 1 && sz > minPx) { sz -= 1; el.style.fontSize = sz + 'px'; }
}

const TO_GO_FROM = 3 / 4;   // lap counter switches from "LAP X OF Y" to "N LAPS TO GO" after this fraction of the race
// ── Header (race name is editable: Layout > Race Name) ───────────────────
function lapLine(d) {
  const session = (d.session || '').toLowerCase();
  if (['practice', 'qualifying', 'testing'].includes(session)) {
    const label = session === 'qualifying' ? 'QUALIFYING' : session === 'testing' ? 'TESTING' : 'PRACTICE';
    const tr = (d.timeRemaining !== undefined) ? d.timeRemaining : -1;
    return tr >= 0 ? `${label} - ${Math.floor(tr / 60)}:${String(Math.floor(tr % 60)).padStart(2, '0')}` : label;
  }
  const state = (d.sessionState || '').toLowerCase();
  if (state === 'get in car') return 'GRIDDING';
  if (state === 'warmup' || state === 'parade laps') return 'PACING';
  if (state === 'checkered') return 'CHECKERED FLAG';
  if (state === 'cool down') return 'RESULTS';
  const lapsComplete = d.lapsComplete || 0;
  const total = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  let lap = lapsComplete + 1; if (total) lap = Math.min(lap, total);
  if (total && lap >= total) return 'FINAL LAP';
  if (total && lapsComplete >= total * TO_GO_FROM) { const left = total - lapsComplete; return `${left} ${left === 1 ? 'LAP' : 'LAPS'} TO GO`; }
  return total ? `LAP ${lap} OF ${total}` : `LAP ${lap}`;
}
function updateHeader(d) {
  const t = document.getElementById('title'), l = document.getElementById('lap');
  t.textContent = String(customName || d.trackNameShort || d.track || 'TRACK').toUpperCase();
  l.innerHTML = esc(lapLine(d)).replace(/^(LAP \d+) OF (\d+)$/, '$1 <small>OF</small> $2');
  fit(t, 22, 8); fit(l, 28, 10);
  const isPQ = ['practice', 'qualifying', 'testing'].includes((d.session || '').toLowerCase());
  document.getElementById('ch-l').textContent = isPQ ? 'BEST LAP' : 'BEHIND LEADER';
  document.getElementById('ch-r').textContent = 'SEC';
}

// ── Rows: top 15 + the last 5 of the field (dimmed) ──────────────────────
let _lastRowsKey = '';
// top / bottom (px) of the 20 slots drawn in template.png
const ROW_T = [143,175,217,258,299,341,382,424,465,506,547,588,629,671,712,753,793,834,875,917];
const ROW_B = [172,214,255,296,338,379,420,461,502,543,584,625,667,708,749,790,831,872,913,955];
function chipHTML(num) {
  const n = String(num || '').trim();
  const col = _driverColors[n] || '';
  const bg  = col ? `background:${col};` : '';
  const fg  = col && bgLuma(col) > 0.6 ? '#111' : '#fff';
  const src = numImgSrc(n);
  const img = src ? `<img src="${src}" alt="" onload="this.parentNode.classList.add('img');this.previousSibling.style.visibility='hidden'" onerror="this.remove()">` : '';
  return `<div class="chip" style="${bg}"><span style="color:${fg}">${esc(n)}</span>${img}</div>`;
}
// Row transitions: when the car shown in a slot changes (overtake, or the last-five block shifting) the old content scrolls UP
// out of the row, the slot stays empty for a moment (only the position number remains), and the new content scrolls up into place.
const ROTATE_MS = 6000;      // how long each block of five (16-20, 21-25, ...) stays up
const ROW_OUT_MS = 230, ROW_GAP_MS = 50, ROW_IN_MS = 300, ROW_DIM_STAGGER = 40;
let _rowEls = [];
function rowParts(r) {                       // r: { e, pos, dim, isPQ, me, num, nameTxt, chase, gapTxt }
  return {
    cls: 'row' + (r.dim ? ' dim' : '') + (r.me ? ' me' : ''),
    pos: r.pos + '.',
    cont: chipHTML(r.num) + `<div class="name${r.chase ? ' chase' : ''}">${esc(r.nameTxt)}</div><div class="gap${r.pos === 1 && !r.isPQ ? ' lead' : ''}">${esc(r.gapTxt)}</div>`
  };
}
function fitRow(el) {
  const nm = el.querySelector('.name'), gp = el.querySelector('.gap'), ps = el.querySelector('.pos');
  if (nm) fit(nm, 22, 11);                   // long surnames shrink instead of being cut off
  if (gp) fit(gp, gp.classList.contains('lead') ? 22 : 23, 11);
  if (ps) fit(ps, 22, 12);
}
function paintRow(el, w) {
  el.className = w.parts.cls;
  el.querySelector('.pos').textContent = w.parts.pos;
  el.querySelector('.cont').innerHTML = w.parts.cont;
  fitRow(el);
}
function scrollRow(el, w, delay) {           // old content up and out, then new content up from below
  const tok = el._tok = (el._tok || 0) + 1;
  const parts = [el.querySelector('.cont')];
  const posChanged = el.querySelector('.pos').textContent !== w.parts.pos;
  if (posChanged) parts.push(el.querySelector('.pos'));
  el._busy = true;
  const run = (kf, ms, ease, dl) => parts.map(x => x.animate ? x.animate(kf, { duration: ms, easing: ease, delay: dl || 0, fill: 'both' }) : null);
  run([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], ROW_OUT_MS, 'cubic-bezier(.55,0,.85,.45)', delay);
  setTimeout(() => {
    if (el._tok !== tok) return;
    parts.forEach(x => x.getAnimations().forEach(a => a.cancel()));
    parts.forEach(x => { x.style.transform = 'translateY(100%)'; });          // hidden below while the slot is empty
    paintRow(el, el._want);
    setTimeout(() => {
      if (el._tok !== tok) return;
      parts.forEach(x => { x.style.transform = ''; });
      parts.forEach(x => x.animate && x.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }],
        { duration: ROW_IN_MS, easing: 'cubic-bezier(.15,.7,.25,1)' }));
      setTimeout(() => { if (el._tok === tok) el._busy = false; }, ROW_IN_MS + 20);
    }, ROW_GAP_MS);
  }, delay + ROW_OUT_MS);
}
function renderRows(d) {
  const standings = getStandings(d);
  const isPQ = ['practice', 'qualifying', 'testing'].includes((d.session || '').toLowerCase());
  const n = standings.length, playerCarIdx = d.playerCarIdx ?? -1;
  const picks = [];
  const top = Math.min(15, n);
  for (let i = 0; i < top; i++) picks.push({ e: standings[i], pos: i + 1, dim: false });
  // Rows 16+ rotate in blocks of five (16-20, 21-25, 26-30, ...) every ROTATE_MS; a last block with fewer than five cars shows the final five
  if (n > 15) {
    const groups = Math.ceil((n - 15) / 5);
    const g = Math.floor(Date.now() / ROTATE_MS) % groups;
    let start = 15 + g * 5;
    if (start + 5 > n) start = Math.max(15, n - 5);
    for (let i = start; i < Math.min(n, start + 5); i++) picks.push({ e: standings[i], pos: i + 1, dim: true });
  }
  const host = document.getElementById('rows');
  const rebuild = (_lastRowsKey === '') || _rowEls.length !== picks.length;     // first paint / forced refresh / row count changed: no animation
  if (rebuild) {
    _lastRowsKey = 'x'; host.innerHTML = ''; _rowEls = [];
    picks.forEach((_, i) => {
      const el = document.createElement('div');
      el.style.cssText = `top:${ROW_T[i]}px;height:${ROW_B[i] - ROW_T[i] + 1}px;--h:${ROW_B[i] - ROW_T[i] + 1}px`;
      el.innerHTML = '<div class="pos"></div><div class="cont"></div>';
      host.appendChild(el); _rowEls.push(el);
    });
  }
  picks.forEach(({ e, pos, dim }, i) => {
    const el = _rowEls[i];
    const num = String(e.number || '').trim();
    const r = { e, pos, dim, isPQ, num, me: e.carIdx === playerCarIdx, nameTxt: lastName(e),
                chase: !!(_CHASE.size && _CHASE.has(chaseKey(num))), gapTxt: fmtGap(e, pos === 1, isPQ, standings[pos - 2]) };
    const w = { sig: [pos, num, r.nameTxt, dim ? 1 : 0, r.chase ? 1 : 0, isPQ ? 1 : 0].join('|'), parts: rowParts(r), gapTxt: r.gapTxt, me: r.me };
    el._want = w;
    if (rebuild || el._sig === undefined) { el._sig = w.sig; paintRow(el, w); return; }
    if (w.sig !== el._sig) {                                    // a different car (or position) in this slot: scroll it
      el._sig = w.sig;
      if (!el._busy) scrollRow(el, w, dim ? Math.max(0, i - 15) * ROW_DIM_STAGGER : 0);
      return;
    }
    if (el._busy) return;                                       // the scroll will paint the latest values
    el.classList.toggle('me', w.me);
    const gp = el.querySelector('.gap');
    if (gp && gp.textContent !== w.gapTxt) { gp.textContent = w.gapTxt; fit(gp, gp.classList.contains('lead') ? 22 : 23, 11); }
  });
  host.style.display = picks.length ? '' : 'none';
}

// ══ Driver Info banner (ported from the NBC 2016 ticker) ═══════════════════════════════════════════
const TICKER_W = 336, NBC_H = 963;
const $ = id => document.getElementById(id);
let _diLast = null, _diCookie = null;
const _numInfo = {};
const FB_DEFAULT_BG = '#3b3f47';
function sampleCorners(img) {
  try {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const w = c.width, h = c.height, i = 3;
    const px = [g.getImageData(i, i, 1, 1).data, g.getImageData(w - i - 1, i, 1, 1).data,
                g.getImageData(i, h - i - 1, 1, 1).data, g.getImageData(w - i - 1, h - i - 1, 1, 1).data];
    const op = px.filter(p => p[3] >= 32);
    if (op.length < 3) return null;
    const a = op.reduce((t, p) => [t[0] + p[0], t[1] + p[1], t[2] + p[2]], [0, 0, 0]).map(v => Math.round(v / op.length));
    return `rgb(${a[0]},${a[1]},${a[2]})`;
  } catch (_) { return null; }
}
// crop the empty margin of the number PNG so the digits fill the plate
function trimNumber(img, bgCss) {
  try {
    const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return null;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const data = g.getImageData(0, 0, w, h).data;
    let bg = null;
    if (bgCss) { const m = /rgb\((\d+),(\d+),(\d+)\)/.exec(bgCss); if (m) bg = [+m[1], +m[2], +m[3]]; }

}

// Put the banner near the bottom of the screen, centred horizontally. The overlay window only covers the ticker, so it is

// Without the app bridge (OBS) it stays to the right of the ticker.
async function diPlace() {
  const sc = SCALE * DI_SCALE;
  diWrap.style.transform = 'scale(' + DI_SCALE + ')';
  if (!(window.shl && window.shl.extendOverlay) || !window.screen) {
    diWrap.style.left = (TICKER_W + 12) + 'px'; diWrap.style.top = Math.max(0, NBC_H - 100) + 'px';
    return;
  }
  try {
    const scrH = window.screen.height, scrW = window.screen.width;

    const left = Math.max(0, Math.round((scrW / 2 - winLeft - 350 * sc) / SCALE));
    await window.shl.extendOverlay(scrH, winLeft + left * SCALE + 700 * sc + 4);
    diWrap.style.left = left + 'px';
    diWrap.style.top = Math.max(0, Math.round((scrH * DI_BOTTOM - 80 * sc - winTop) / SCALE)) + 'px';
  } catch (e) { diWrap.style.left = (TICKER_W + 12) + 'px'; diWrap.style.top = Math.max(0, NBC_H - 100) + 'px'; }

}
async function diShow() {

  if (!diRender(_diLast)) return;
  _diOn = true;
  await diPlace();

function diHide() {

}
function diToggle() { if (_diOn) diHide(); else diShow(); }
function diUpdate(d) { if (_diOn && diRender(d)) diFit(); }
window.__toggleDriverInfo = diToggle;
if (window.shl && window.shl.onDriverInfoToggle) window.shl.onDriverInfoToggle(diToggle);
if (window.shl && window.shl.onDriverInfoStep) window.shl.onDriverInfoStep(diStep);
window.__stepDriverInfo = diStep;

// Called with every data frame (the driver info lines need laps led, grid, pit stops and the qualifying order even while the banner is hidden)
function diFeed(d) { trackLed(d); trackQual(d); trackGrid(d); trackPits(d); }

// ── Flag banners: the yellow CAUTION / GREEN FLAG banner pushes the LCD out to the left ──────────────
// Enters from the right, the text spreads out a little, the LCD leaves to the left. CAUTION stays up while the race is yellow;
// GREEN FLAG (race start and every restart) stays FLAG.greenHoldMs and then the LCD comes back the same way.
const FLAG = { enterMs: 650, textMs: 1300, textDelay: 250, greenHoldMs: 8000, cautionBannerMs: 3500 };
const _fEls = { lcd: document.getElementById('lcd'), yellow: document.getElementById('flag-y'), green: document.getElementById('flag-g') };
// modes: 'lcd' (teal) | 'yellow' (CAUTION banner) | 'yellowlcd' (amber LCD with race name + lap) | 'green' (GREEN FLAG banner)
const _elOf = m => (m === 'lcd' || m === 'yellowlcd') ? _fEls.lcd : _fEls[m];
let _fMode = 'lcd', _fInit = false, _fSeen = false, _prevYellow = false, _prevPre = false, _greenUntil = 0, _yellowSince = 0, _fTimer = null, _fClsTimer = null;
function setFlagMode(next, animate) {
  if (_fInit && next === _fMode) return;
  const prev = _fMode; _fMode = next; _fInit = true;
  const eNext = _elOf(next), ePrev = _elOf(prev);
  Object.values(_fEls).forEach(e => { e.getAnimations().forEach(a => a.cancel()); const t = e.querySelector('.ft'); if (t) t.getAnimations().forEach(a => a.cancel()); });
  clearTimeout(_fClsTimer);
  const setAmber = on => _fEls.lcd.classList.toggle('caution', on);
  if (next === 'yellowlcd') setAmber(true);
  else if (prev === 'yellowlcd' && animate && eNext !== ePrev) _fClsTimer = setTimeout(() => { if (_fMode !== 'yellowlcd') setAmber(false); }, FLAG.enterMs + 80);   // stays amber while it slides out
  else setAmber(false);
  Object.keys(_fEls).forEach(k => { _fEls[k].style.transform = (_fEls[k] === eNext) ? 'translateX(0)' : 'translateX(100%)'; });   // end state
  if (next === 'yellow' || next === 'green') fit(_fEls[next].querySelector('.ft'), 36, 14);
  if (!animate || eNext === ePrev || !_fEls.lcd.animate) return;
  const ease = 'cubic-bezier(.2,.8,.2,1)';
  eNext.animate([{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], { duration: FLAG.enterMs, easing: ease });
  ePrev.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-100%)' }], { duration: FLAG.enterMs, easing: ease });
  if (next === 'yellow' || next === 'green') {                // the banner text spreads out a bit while it settles
    eNext.querySelector('.ft').animate([{ letterSpacing: '.03em', paddingLeft: '.03em' }, { letterSpacing: '.15em', paddingLeft: '.15em' }],

function updateFlag(d) {

  const isRace = session === 'race';
  const pre = isRace && (state === 'get in car' || state === 'warmup' || state === 'parade laps');
  const fin = isRace && (state === 'checkered' || state === 'cool down');
  const yellow = isRace && !pre && !fin && flag === 'yellow';
  const now = Date.now();
  if (_fSeen && isRace && !pre && !fin && !yellow) {
    if (_prevYellow) _greenUntil = now + FLAG.greenHoldMs;                      // caution just ended: restart
    else if (_prevPre && state === 'racing') _greenUntil = now + FLAG.greenHoldMs;   // race just started
  }
  if (!isRace || pre || fin) _greenUntil = 0;

// ── Visibility + data ────────────────────────────────────────────────────
let _preview = false, _latestData = null;

}

}

}

// Layout editor preview (sample data plus live setting changes)

// ── WebSocket ────────────────────────────────────────────────────────────
let ws;
