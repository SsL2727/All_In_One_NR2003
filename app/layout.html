<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; script-src 'self' 'unsafe-inline'; frame-src 'self' file:">
<title>Layout Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e1014;
    color: #e0e4ec;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── Toolbar ── */
  #toolbar {
    background: #1a1d23;
    border-bottom: 1px solid #252830;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #toolbar h2 {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-right: 8px;
  }

  button {
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary { background: #3a7bd5; color: #fff; }
  .btn-primary:hover { background: #4a8be5; }
  .btn-secondary { background: #252830; color: #aaa; }
  .btn-secondary:hover { background: #2e3340; color: #fff; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-success:hover { background: #2ecc71; }

  #toolbar-right { margin-left: auto; display: flex; gap: 8px; }

  /* ── Main area ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    background: #13161a;
    border-right: 1px solid #1e2128;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 4px;
  }

  .widget-item {
    background: #1a1d23;
    border: 1px solid #252830;
    border-radius: 5px;
    padding: 10px;
  }
  .widget-item.active { border-color: #3a7bd5; }

  .widget-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .widget-name {
    font-weight: 600;
    font-size: 13px;
    color: #fff;
  }

  .toggle {
    position: relative;
    width: 34px; height: 18px;
  }
  .toggle input { display: none; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #252830;
    border-radius: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider:before {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    left: 3px; top: 3px;
    background: #555;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .toggle-slider { background: #3a7bd5; }
  .toggle input:checked + .toggle-slider:before {
    transform: translateX(16px); background: #fff;
  }

  .widget-controls { display: flex; flex-direction: column; gap: 6px; }
  .widget-controls.collapsed { display: none; }
  .collapse-btn {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    padding: 0 2px;
    font-size: 12px;
    line-height: 1;
    transition: color 0.15s, transform 0.2s;
  }
  .collapse-btn:hover { color: #aaa; }
  .collapse-btn.collapsed { transform: rotate(-90deg); }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-label {
    font-size: 10px;
    color: #666;
    width: 44px;
    flex-shrink: 0;
  }
  .ctrl-row input[type=range] {
    flex: 1;
    accent-color: #3a7bd5;
    height: 3px;
  }
  .ctrl-val {
    font-size: 10px;
    color: #aaa;
    width: 40px;
    text-align: right;
    flex-shrink: 0;
  }
  .coord-row {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .coord-row input[type=number] {
    flex: 1;
    background: #0e1014;
    border: 1px solid #2a2d35;
    border-radius: 3px;
    padding: 4px 6px;
    font-size: 12px;
    color: #e0e4ec;
    min-width: 0;
    max-width: 70px;
  }

  /* ── Preview canvas area ── */
  #preview-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080a0c;
    overflow: hidden;
    position: relative;
  }

  #preview {
    position: relative;
    background: #111;
    overflow: hidden;
    flex-shrink: 0;
    transition: width 0.1s, height 0.1s;
  }

  #preview-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.5;
  }

  /* ── Widget thumbnails on canvas ── */
  .widget-thumb {
    position: absolute;
    border: 2px solid rgba(58,123,213,0.6);
    border-radius: 4px;
    background: rgba(58,123,213,0.15);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
    overflow: visible;
  }
  .widget-thumb:active { cursor: grabbing; }
  .widget-thumb.selected {
    border-color: #3a7bd5;
    background: rgba(58,123,213,0.3);
  }
  .widget-thumb.hidden-widget {
    display: none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h2>Layout Editor</h2>
  <button class="btn-secondary" id="bg-btn">📷 Set Background</button>
  <div id="toolbar-right">
    <button class="btn-secondary" id="master-obs-btn">📋 Copy Master OBS URL</button>
    <button class="btn-secondary" id="racestats-btn">📊 Copy Race Stats URL</button>
    <button class="btn-secondary" id="cancel-btn">Cancel</button>
    <button class="btn-secondary" id="save-btn">💾 Save</button>
    <button class="btn-success" id="exit-btn">Save &amp; Exit</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-title">Widgets</div>
    <div id="widget-list"></div>
    <div class="sidebar-title" style="margin-top:10px">RaceControl, AIMOD &amp; TV graphics</div>
    <div id="gfx-panel"></div>
  </div>

  <div id="preview-wrap">
    <div id="preview">
      <div id="preview-bg"></div>
      <!-- widget thumbnails injected here -->
    </div>
  </div>
</div>

<script>
// Name-plate colour presets (the colour behind the driver names and the TOP 3 bar). NBC (grey 120,120,120) is the default; SHART is the original blue.
const NAME_DEFAULT = '#787878';
const NAME_DEFAULT_PRESET = 'nbc';
const NAME_PRESETS = [
  { id: 'nbc',    label: 'NBC (default)', color: '#787878' },
  { id: 'shart',  label: 'SHART',         color: '#1e5fd8' },
  { id: 'gascar', label: 'GASCAR',        color: '#ff8c00' },
];

// ── Constants ──────────────────────────────────────────────────────────────
// These get set dynamically from rend_dxg.ini via main process
let ACTUAL_W  = 1920;
let ACTUAL_H  = 1080;
let appConfig = {};  // module-level config with seriesList
let PREVIEW_W = 960;
let PREVIEW_H = 540;
let SCALE     = 0.5;

// Widget definitions — size in actual pixels (must match widget HTML dimensions)
const WIDGET_DEFS = [
  { id: 'dash',          label: 'Dashboard',      w: 572,  h: 231, extras: ['visibilityMode'] },
  { id: 'input',         label: 'Inputs',         w: 560,  h: 110, extras: ['lineThickness', 'steerInput', 'clutch', 'showTrace', 'showSteer', 'visibilityMode'] },
  { id: 'relative',      label: 'Relative',       w: 460,  h: 286, extras: ['visibilityMode'] },
  { id: 'trackmap',      label: 'Track Map',      w: 500,  h: 500, extras: ['showTrackName', 'visibilityMode'] },
  { id: 'deltabar',      label: 'Delta Bar',      w: 570,  h: 80,  extras: ['visibilityMode'] },
  { id: 'battle',        label: 'Battle Box',     w: 360,  h: 88,  extras: ['visibilityMode'] },
  { id: 'radar',         label: 'Radar',          w: 200,  h: 200, extras: ['radarMode', 'visibilityMode'] },
  { id: 'pitspeed',      label: 'Pit Road Speed', w: 220,  h: 90,  extras: ['pitBeep'] },
  { id: 'season',        label: 'Season Standings', w: 460, h: 532, extras: ['seasonMode', 'seasonRows', 'visibilityMode'], defaultEnabled: false },
  { id: 'results',       label: 'Results & Stat Leaders', w: 460, h: 420, extras: ['resultsMode', 'visibilityMode'], defaultEnabled: false },
  // h is overwritten in init() from the saved "rows shown" — see championshipWindowHeight() in main.js
];

// Slot definitions — each slot has selectable skins
const SLOT_DEFS = [
  {
    slotId: 'tower',
    label:  'Vertical Tower',
    skins: [
      { id: 'livestandings', label: 'Default',    w: 290,  h: 720,  extras: ['dnfDisplay', 'customName', 'visibilityMode', 'seasonPts'] },
      { id: 'fox2022',       label: 'Fox (2022)',     w: 409,  h: 1080, extras: ['dnfDisplay', 'sponsorRotationTime', 'customName', 'visibilityMode'] },
      { id: 'foxpersonal',   label: 'Fox (Personal)', w: 409,  h: 1080, extras: ['dnfDisplay', 'sponsorRotationTime', 'customName', 'visibilityMode', 'showManu'] },
      { id: 'prime',         label: 'Prime',          w: 399,  h: 1080, extras: ['sponsorRotationTime', 'customName', 'visibilityMode', 'startGrid'] },
      { id: 'fox2026',       label: 'Fox (2026)',     w: 327,  h: 1013, extras: ['sponsorRotationTime', 'customName', 'visibilityMode'] },
      { id: 'foxindy2026',   label: 'Fox IndyCar (2026)', w: 450, h: 986, extras: ['sponsorRotationTime', 'customName', 'visibilityMode'] },
      { id: 'tnt2026',       label: 'TNT 2026',       w: 321,  h: 967, extras: ['sponsorRotationTime', 'customName', 'visibilityMode'] },
      { id: 'nbc2019',       label: 'NBC 2019',       w: 336,  h: 963, extras: ['customName', 'visibilityMode'] },
    ]
  },
  {
    slotId: 'ticker',
    label:  'Horizontal Ticker',
    skins: [
      { id: 'ticker',     label: 'Scrolling Ticker', w: 1920, h: 145, extras: ['dnfDisplay', 'scrollSpeed', 'customName', 'visibilityMode'] },
      { id: 'cw_overlay', label: 'CW Overlay',       w: 1920, h: 548, extras: ['dnfDisplay', 'customName', 'visibilityMode'] },
      { id: 'floracing',  label: 'FloRacing',         w: 1842, h: 129, extras: ['stripZeros', 'sponsorRotationTime', 'customName', 'visibilityMode'] },
      { id: 'espn2010',   label: 'ESPN 2010',          w: 1920, h: 208, extras: ['dnfDisplay', 'scrollSpeed', 'visibilityMode'] },
      { id: 'espn2011',   label: 'ESPN 2011',          w: 1920, h: 215, extras: ['dnfDisplay', 'scrollSpeed', 'visibilityMode'] },
      { id: 'espn2017',   label: 'ESPN 2017',          w: 1728, h: 540,  extras: ['dnfDisplay', 'scrollSpeed', 'sponsorRotationTime', 'visibilityMode', 'showCar'] },
      { id: 'nbc2014',    label: 'NBC 2014',           w: 1920, h: 532,  extras: ['dnfDisplay', 'scrollSpeed', 'visibilityMode'] },
      { id: 'nbc2016',    label: 'NBC 2016',           w: 1166, h: 98,   extras: ['dnfDisplay', 'customName', 'visibilityMode'] },
      { id: 'nbc2017shart', label: 'NBC 2017', w: 1166, h: 326, extras: ['dnfDisplay', 'sponsorRotationTime', 'customName', 'visibilityMode', 'chaseColor', 'nameColor', 'finalLapColor', 'finalLapSponsorColor', 'startGrid'] },
      { id: 'fox2010',    label: 'Fox (2010)',         w: 1456, h: 176, extras: ['dnfDisplay', 'scrollSpeed', 'sponsorRotationTime', 'visibilityMode'] },
      { id: 'fox2016',    label: 'Fox 2016',           w: 1184, h: 388, extras: ['dnfDisplay', 'sponsorRotationTime', 'customName', 'visibilityMode', 'columns'] },
      { id: 'fox2004',    label: 'Fox (2004)',         w: 1456, h: 516, extras: ['dnfDisplay', 'scrollSpeed', 'sponsorRotationTime', 'customName', 'visibilityMode', 'yellowSound'] },
    ]
  },
];

// Series from main config (passed as URL param when layout editor opens)
const SERIES_ID   = new URLSearchParams(location.search).get('series')     || 'default';
const INSTALL_DIR = new URLSearchParams(location.search).get('installdir') || '';
const STREAM_IP   = new URLSearchParams(location.search).get('streamip')   || 'localhost';
const HTTP_PORT   = new URLSearchParams(location.search).get('httpport')   || '8766';
const SEASON_PORT = new URLSearchParams(location.search).get('seasonport') || '8769';

function buildObsUrl(id, w, extras) {
  const base = id === 'season' || id === 'results' ? `http://${STREAM_IP}:${SEASON_PORT}/widget/${id}` : `http://${STREAM_IP}:${HTTP_PORT}/widget/${id}`;
  const p    = new URLSearchParams();
  if (SERIES_ID && SERIES_ID !== 'default') {
    p.set('series', SERIES_ID);
    // Look up pretty name from seriesList, fall back to folder ID
    const seriesName = appConfig.seriesList?.find(s => s.id === SERIES_ID)?.name || SERIES_ID;
    if (seriesName) p.set('seriesname', seriesName);
  }
  p.set('scale',   w.scale   ?? 1);
  p.set('opacity', w.opacity ?? 1);
  if (extras.includes('scrollSpeed') && w.scrollSpeed) p.set('scrollspeed', w.scrollSpeed);
  if (extras.includes('customName')          && w.customName)          p.set('customname',          w.customName);
  if (extras.includes('chaseColor') && w.chaseColor) p.set('chasecolor', w.chaseColor);
  if (extras.includes('finalLapColor') && w.finalLapColor) p.set('finallapcolor', w.finalLapColor);
  if (extras.includes('nameColor') && w.nameColor) p.set('namecolor', w.nameColor);
  if (extras.includes('finalLapSponsorColor') && w.finalLapSponsorColor) p.set('finallapsponsorcolor', w.finalLapSponsorColor);
  if (extras.includes('sponsorRotationTime') && w.sponsorRotationTime) p.set('sponsorrotationtime', w.sponsorRotationTime);
  if (extras.includes('columns') && Number(w.columns) === 3) p.set('columns', '3');
  if (extras.includes('steerInput')  && w.steerInput)  p.set('steerinput',  w.steerInput);
  if (extras.includes('showTrace')     && w.showTrace     === false) p.set('showtrace',     '0');
  if (extras.includes('showSteer')     && w.showSteer     === false) p.set('showsteer',     '0');
  if (extras.includes('showTrackName') && w.showTrackName === false) p.set('showtrackname', '0');
  if (extras.includes('visibilityMode') && w.visibilityMode) p.set('visibilitymode', w.visibilityMode);
  if (extras.includes('radarMode')      && w.radarMode)      p.set('radarmode',      w.radarMode);
  if (extras.includes('pitBeep') && w.pitBeep === false) p.set('pitbeep', '0');
  if (extras.includes('clutch')  && w.hasClutch === false) p.set('clutch', '0');
  if (extras.includes('seasonMode') && w.seasonMode) p.set('seasonmode', w.seasonMode);
  if (extras.includes('seasonRows') && w.seasonRows) p.set('seasonrows', w.seasonRows);
  if (extras.includes('resultsMode') && w.resultsMode) p.set('resultsmode', w.resultsMode);
  return `${base}?${p.toString()}`;
}

// ── State ──────────────────────────────────────────────────────────────────
let layout = {};   // { widgetId: { enabled, x, y, scale, opacity } }
let selectedId = null;
let dragging = null;

// Listen for widgets reporting their actual rendered width (e.g. input
// widget shrinking when clutch/trace are toggled off) so the thumb box
// and iframe can match it instead of relying on a static WIDGET_DEFS size.
window.addEventListener('message', e => {
  if (typeof e.data !== 'string') return;
  try {
    const m = JSON.parse(e.data);
    if (m._widgetWidth !== undefined && m._widgetId) {
      const thumb  = document.getElementById(`thumb-${m._widgetId}`);
      const iframe = document.getElementById(`iframe-${m._widgetId}`);
      if (thumb)  thumb.style.width  = m._widgetWidth + 'px';
      if (iframe) iframe.style.width = m._widgetWidth + 'px';
    }
  } catch (ex) {}
});

// ── Init ───────────────────────────────────────────────────────────────────
// Fox 2016 ticker: width depends on the number of modules (2 -> 1184 px, 3 -> 1628 px)
function skinEffW(skinDef, sw) {
  return (skinDef && skinDef.id === 'fox2016' && sw && Number(sw.columns) === 3) ? 1628 : skinDef.w;
}

async function init() {
  const config    = await window.shl.getConfig();
  const profData  = await window.shl.getProfiles();
  const seriesList = await window.shl.getSeries();
  const active    = profData.active || 'Default';

  // Store in module-level so setupSidebar can access it
  appConfig = config;
  appConfig.seriesList = seriesList;

  // Championship widget height follows the number of rows the user chose to show
  const champDef = WIDGET_DEFS.find(d => d.id === 'championship');
  if (champDef) {
    const champCfg  = (config.championships || {})[SERIES_ID || config.series || 'default'] || {};
    const champRows = Math.max(3, Math.min(20, parseInt(champCfg.visibleRows, 10) || 10));
    const champCut = (champCfg.cutoffEnabled && champCfg.cutoffPos >= (champCfg.rowFrom || 1) && champCfg.cutoffPos <= (champCfg.rowTo || 0)) ? 22 : 0;
    champDef.h = 52 + champRows * 30 + 36 + champCut;
    champDef.w = 384 + (champCfg.gapEnabled !== false ? 54 : 0);
  }

  // Get widgets from active profile
  layout = (config.profiles?.[active]?.widgets) || {};

  // Update title to show active profile
  document.querySelector('#toolbar h2').textContent = `Layout Editor — ${active}`;

  // Get actual NR2003 resolution and compute preview scale
  const res = await window.shl.getResolution();
  ACTUAL_W  = res.width  || 1920;
  ACTUAL_H  = res.height || 1080;

  // Fit preview inside available space (max 960px wide or 540px tall)
  const maxW  = 960;
  const maxH  = 540;
  SCALE       = Math.min(maxW / ACTUAL_W, maxH / ACTUAL_H);
  PREVIEW_W   = Math.round(ACTUAL_W * SCALE);
  PREVIEW_H   = Math.round(ACTUAL_H * SCALE);

  WIDGET_DEFS.forEach(def => {
    if (!layout[def.id]) {
      layout[def.id] = {
        enabled:       def.defaultEnabled !== false,
        x:             20,
        y:             Math.round(1080 - def.h - 20),
        scale:         1.0,
        opacity:       1.0,
        lineThickness: def.extras.includes('lineThickness') ? 1.5 : undefined,
      };
    } else if (def.extras.includes('lineThickness') && layout[def.id].lineThickness === undefined) {
      layout[def.id].lineThickness = 1.5;
    }
    if (def.extras.includes('steerInput') && layout[def.id].steerInput === undefined) {
      layout[def.id].steerInput = 'game';
    }
    if (def.extras.includes('pitBeep') && layout[def.id].pitBeep === undefined) {
      layout[def.id].pitBeep = true;
    }
    if (def.extras.includes('clutch') && layout[def.id].hasClutch === undefined) {
      layout[def.id].hasClutch = true;
    }
    if (def.extras.includes('scrollSpeed') && layout[def.id].scrollSpeed === undefined) {
      layout[def.id].scrollSpeed = 70;
    }
    if (def.extras.includes('customName') && layout[def.id].customName === undefined) {
      layout[def.id].customName = '';
    }
    if (def.extras.includes('chaseColor') && layout[def.id].chaseColor === undefined) layout[def.id].chaseColor = '#007aff';
    if (def.extras.includes('nameColor') && layout[def.id].nameColor === undefined) { layout[def.id].nameColor = NAME_DEFAULT; layout[def.id].namePreset = NAME_DEFAULT_PRESET; }
    if (def.extras.includes('finalLapColor') && layout[def.id].finalLapColor === undefined) layout[def.id].finalLapColor = '#1b57c6';
    if (def.extras.includes('finalLapSponsorColor') && layout[def.id].finalLapSponsorColor === undefined) layout[def.id].finalLapSponsorColor = '#1b57c6';
    if (def.extras.includes('sponsorRotationTime') && layout[def.id].sponsorRotationTime === undefined) {
      layout[def.id].sponsorRotationTime = 10;
    }
    if (def.extras.includes('showTrackName') && layout[def.id].showTrackName === undefined) {
      layout[def.id].showTrackName = true;
    }
    if (def.extras.includes('showTrace') && layout[def.id].showTrace === undefined) {
      layout[def.id].showTrace = true;
    }
    if (def.extras.includes('showSteer') && layout[def.id].showSteer === undefined) {
      layout[def.id].showSteer = true;
    }
    if (def.extras.includes('visibilityMode') && layout[def.id].visibilityMode === undefined) {
      // Sensible defaults: broadcast widgets at_track, player widgets in_car
      const atTrackDefaults = ['trackmap', 'livestandings', 'ticker', 'season', 'championship'];
      layout[def.id].visibilityMode = atTrackDefaults.includes(def.id) ? 'at_track' : 'in_car';
    }
    if (def.extras.includes('radarMode') && layout[def.id].radarMode === undefined) {
      layout[def.id].radarMode = 'always';
    }
    if (def.extras.includes('seasonMode') && layout[def.id].seasonMode === undefined) layout[def.id].seasonMode = 'auto';
    if (def.extras.includes('seasonRows') && layout[def.id].seasonRows === undefined) layout[def.id].seasonRows = 14;
  });

  // Initialize slot structure
  SLOT_DEFS.forEach(slot => {
    // Defensive: ensure slot entry exists and is a proper object (not null)
    if (!layout[slot.slotId] || typeof layout[slot.slotId] !== 'object' || Array.isArray(layout[slot.slotId])) {
      layout[slot.slotId] = { activeSkin: slot.skins[0].id, skins: {} };
    }
    if (!layout[slot.slotId].skins || typeof layout[slot.slotId].skins !== 'object') {
      layout[slot.slotId].skins = {};
    }
    if (!layout[slot.slotId].activeSkin) {
      layout[slot.slotId].activeSkin = slot.skins[0].id;
    }
    slot.skins.forEach(skin => {
      if (!layout[slot.slotId].skins[skin.id]) {
        layout[slot.slotId].skins[skin.id] = {
          enabled: false, x: 0, y: 0, scale: 1.0, opacity: 1.0,
        };
      }
      const sw = layout[slot.slotId].skins[skin.id];
      if (skin.extras.includes('customName') && sw.customName === undefined) sw.customName = '';
      if (skin.extras.includes('chaseColor') && sw.chaseColor === undefined) sw.chaseColor = '#007aff';
      if (skin.extras.includes('nameColor') && sw.nameColor === undefined) { sw.nameColor = NAME_DEFAULT; sw.namePreset = NAME_DEFAULT_PRESET; }
      if (skin.extras.includes('finalLapColor') && sw.finalLapColor === undefined) sw.finalLapColor = '#1b57c6';
      if (skin.extras.includes('finalLapSponsorColor') && sw.finalLapSponsorColor === undefined) sw.finalLapSponsorColor = '#1b57c6';
      if (skin.extras.includes('scrollSpeed') && sw.scrollSpeed === undefined) sw.scrollSpeed = 70;
      if (skin.extras.includes('sponsorRotationTime') && sw.sponsorRotationTime === undefined) sw.sponsorRotationTime = 10;
      if (skin.extras.includes('stripZeros')          && sw.stripZeros          === undefined) sw.stripZeros          = false;
      if (skin.extras.includes('dnfDisplay')          && sw.dnfDisplay          === undefined) sw.dnfDisplay          = 'reason';
      if (skin.extras.includes('columns')             && sw.columns             === undefined) sw.columns             = 2;
      if (skin.extras.includes('showManu')             && sw.showManu            === undefined) sw.showManu            = true;
      if (skin.extras.includes('seasonPts')            && sw.seasonPts           === undefined) sw.seasonPts           = 'off';

    document.getElementById('preview-bg').style.backgroundImage = `url('${appConfig.layoutBg}')`;
  }

  setupPreview();
  setupSidebar();

  // Dynamically resize preview canvas when window resizes
  const wrap = document.getElementById('preview-wrap');
  const preview = document.getElementById('preview');

  function resizePreview() {
    const availW = wrap.clientWidth  - 40;
    const availH = wrap.clientHeight - 40;
    const newScale = Math.min(availW / ACTUAL_W, availH / ACTUAL_H);
    const newW = Math.round(ACTUAL_W * newScale);
    const newH = Math.round(ACTUAL_H * newScale);
    preview.style.width  = newW + 'px';
    preview.style.height = newH + 'px';

    // Reposition all widget thumbs based on new scale
    WIDGET_DEFS.forEach(def => {
      const w     = layout[def.id];
      const thumb = document.getElementById('thumb-' + def.id);
      if (!thumb) return;
      thumb.style.left = Math.round(w.x * newScale) + 'px';
      thumb.style.top  = Math.round(w.y * newScale) + 'px';
      // Update iframe container transform
      const iframe = document.getElementById('iframe-' + def.id);
      if (iframe) {
        thumb.style.transform = `scale(${newScale * (w.scale || 1)})`;
      } else {
        thumb.style.width  = Math.round(def.w * newScale) + 'px';
        thumb.style.height = Math.round(def.h * newScale) + 'px';
      }
    });

    // Reposition slot thumbs
    SLOT_DEFS.forEach(slot => {
      const slotData   = layout[slot.slotId] || {};
      const activeSkin = slotData.activeSkin || slot.skins[0].id;
      const skinDef    = slot.skins.find(s => s.id === activeSkin) || slot.skins[0];
      const sw         = (slotData.skins || {})[activeSkin] || {};
      const thumb      = document.getElementById('thumb-' + slot.slotId);
      if (!thumb) return;
      thumb.style.left      = Math.round((sw.x || 0) * newScale) + 'px';
      thumb.style.top       = Math.round((sw.y || 0) * newScale) + 'px';
      thumb.style.transform = `scale(${newScale * (sw.scale || 1)})`;
    });
  }

  new ResizeObserver(resizePreview).observe(wrap);
  resizePreview();
}

// Inject fake data into an iframe
let _fakeT = 0;
let _shimActive = new URLSearchParams(location.search).get('nr2003running') === '1';
let _fakeIntervals = [];

// Stop fake data when NR2003 launches
window.shl.onNR2003Status(on => {
  _shimActive = on;
  if (on) {
    // Clear all fake data intervals
    _fakeIntervals.forEach(id => clearInterval(id));
    _fakeIntervals = [];
  }
});
function injectFakeData(iframe) {
  if (_shimActive) return;  // real data flowing — don't inject fake
  try {
    _fakeT += 0.08;
    const throttle = Math.max(0, Math.min(1, 0.5 + 0.5 * Math.sin(_fakeT)));
    const brake    = Math.max(0, Math.min(1, 0.3 * Math.max(0, -Math.sin(_fakeT + 0.5))));
    const steering = Math.sin(_fakeT * 0.4) * 0.3;
    const rpm      = 5000 + 2500 * Math.abs(Math.sin(_fakeT * 0.5));


    const data = Object.assign({}, FAKE_DATA, {
      player:        Object.assign({}, FAKE_PLAYER, { throttle, brake, steering, rpm }),
      _hideConnEl:   true,
    });
    {
      // Chase highlight preview (the real run gets this from the recorder via IPC)
      const cc = (appConfig.championships || {})[SERIES_ID || appConfig.series || 'default'];
      const fakeNums = (FAKE_DATA.standings || []).map(s => String(s.number).trim());
      let pv = [];
      if (cc && cc.chaseEnabled) {
        if (cc.chaseMode === 'manual') pv = (cc.drivers || []).filter(d => d.playoff).map(d => String(d.number).trim());
        else pv = fakeNums.slice(0, parseInt(cc.chaseSize, 10) || 10);
        if (!pv.some(n => fakeNums.includes(n))) pv = fakeNums.slice(0, 3);   // preview only: show something
      }
      data._chase = pv;
    }
    if (iframe.id === 'iframe-championship') {
      const cc = (appConfig.championships || {})[SERIES_ID || appConfig.series || 'default'];
      if (cc) data._championship = cc;   // no saved config → widget shows its sample data
    }
    iframe.contentWindow?.postMessage(JSON.stringify(data), '*');
  } catch(e) {}
}

function setupPreview() {
  const preview = document.getElementById('preview');
  preview.style.width  = PREVIEW_W + 'px';
  preview.style.height = PREVIEW_H + 'px';

  // Regular widget thumbs
  WIDGET_DEFS.forEach(def => {
    const w = layout[def.id];
    if (!w) return;
    const el = document.createElement('div');
    el.className = 'widget-thumb' + (w.enabled ? '' : ' hidden-widget');
    el.id = 'thumb-' + def.id;
    el.style.left = Math.round(w.x * SCALE) + 'px';
    el.style.top  = Math.round(w.y * SCALE) + 'px';

    const hasSrc = def.id !== 'input' || w.showTrace !== false;
    if (true) {
      el.style.width  = def.w + 'px';
      el.style.height = def.h + 'px';
      el.style.transform = `scale(${SCALE * (w.scale || 1)})`;
      el.style.transformOrigin = 'top left';
      el.style.overflow = 'hidden';

      const series      = SERIES_ID;
      const seriesName  = appConfig.seriesList?.find(s => s.id === series)?.name || series;
      let iframeUrl = `nr2003_${def.id}.html?visibilitymode=always&scale=1&opacity=${w.opacity || 1}`;
      if (series && series !== 'default') iframeUrl += `&series=${encodeURIComponent(series)}&seriesname=${encodeURIComponent(seriesName)}`;
      if (INSTALL_DIR) iframeUrl += `&installdir=${encodeURIComponent(INSTALL_DIR)}`;
      if (def.extras.includes('lineThickness') && w.lineThickness !== undefined) iframeUrl += `&linethickness=${w.lineThickness}`;
      if (def.extras.includes('steerInput') && w.steerInput) iframeUrl += `&steerinput=${w.steerInput}`;
      if (def.extras.includes('scrollSpeed') && w.scrollSpeed) iframeUrl += `&scrollspeed=${w.scrollSpeed}`;
      if (def.extras.includes('customName') && w.customName) iframeUrl += `&customname=${encodeURIComponent(w.customName)}`;
      if (def.extras.includes('chaseColor') && w.chaseColor) iframeUrl += `&chasecolor=${encodeURIComponent(w.chaseColor)}`;
      if (def.extras.includes('finalLapColor') && w.finalLapColor) iframeUrl += `&finallapcolor=${encodeURIComponent(w.finalLapColor)}`;
      if (def.extras.includes('nameColor') && w.nameColor) iframeUrl += `&namecolor=${encodeURIComponent(w.nameColor)}`;
      if (def.extras.includes('finalLapSponsorColor') && w.finalLapSponsorColor) iframeUrl += `&finallapsponsorcolor=${encodeURIComponent(w.finalLapSponsorColor)}`;
      if (def.extras.includes('radarMode') && w.radarMode) iframeUrl += `&radarmode=${w.radarMode}`;
      if (def.extras.includes('showTrackName') && w.showTrackName === false) iframeUrl += '&showtrackname=0';
      if (def.extras.includes('seasonMode') && w.seasonMode) iframeUrl += `&seasonmode=${w.seasonMode}&seasonport=${SEASON_PORT}`;
      if (def.extras.includes('seasonRows') && w.seasonRows) iframeUrl += `&seasonrows=${w.seasonRows}`;
      if (def.extras.includes('resultsMode')) iframeUrl += `&resultsmode=${w.resultsMode || 'auto'}&seasonport=${SEASON_PORT}`;
      if (def.id === 'input' && w.hasClutch === false) iframeUrl += '&clutch=0';
      if (def.id === 'input' && w.showTrace === false) iframeUrl += '&showtrace=0';
      if (def.id === 'input' && w.showSteer === false) iframeUrl += '&showsteer=0';

      const iframe = document.createElement('iframe');
      iframe.id = 'iframe-' + def.id;
      iframe.src = iframeUrl;
      iframe.style.width  = def.w + 'px';
      iframe.style.height = def.h + 'px';
      iframe.style.border  = 'none';
      iframe.style.display = 'block';
      iframe.style.pointerEvents = 'none';
      iframe.style.overflow = 'hidden';
      iframe.scrolling = 'no';
      iframe.addEventListener('load', () => {
        setTimeout(() => { injectFakeData(iframe); }, 300);
        const fakeInterval = setInterval(() => {
          if (_shimActive) { clearInterval(fakeInterval); return; }
          injectFakeData(iframe);
        }, 100);
        _fakeIntervals.push(fakeInterval);
      });

      el.appendChild(iframe);
    } else {
      el.style.width  = Math.round(def.w * SCALE) + 'px';
      el.style.height = Math.round(def.h * SCALE) + 'px';
      el.style.transform = `scale(${w.scale || 1})`;
      el.style.transformOrigin = 'top left';
      el.textContent = def.label;
    }

    el.addEventListener('mousedown', e => startDrag(e, def.id));
    el.addEventListener('click', () => selectWidget(def.id));
    preview.appendChild(el);
  });

  // Add slot thumbs
  SLOT_DEFS.forEach(slot => {
    const slotData   = layout[slot.slotId] || { activeSkin: slot.skins[0].id, skins: {} };
    const validSkinIds = slot.skins.map(s => s.id);
    const activeSkin   = validSkinIds.includes(slotData.activeSkin) ? slotData.activeSkin : slot.skins[0].id;
    if (slotData.activeSkin !== activeSkin) slotData.activeSkin = activeSkin;
    const skinDef    = slot.skins.find(s => s.id === activeSkin);
    const sw         = (slotData.skins || {})[activeSkin] || {};

    const el = document.createElement('div');
    el.className = 'widget-thumb' + (sw.enabled ? '' : ' hidden-widget');
    el.id        = 'thumb-' + slot.slotId;
    el.style.left = Math.round((sw.x || 0) * SCALE) + 'px';
    el.style.top  = Math.round((sw.y || 0) * SCALE) + 'px';
    el.style.background      = 'transparent';
    el.style.border          = '2px solid rgba(200,168,75,0.6)';
    el.style.width           = skinEffW(skinDef, sw) + 'px';
    el.style.height          = skinDef.h + 'px';
    el.style.overflow        = 'hidden';
    el.style.transform       = `scale(${SCALE * (sw.scale || 1)})`;
    el.style.transformOrigin = 'top left';

    const iframe = document.createElement('iframe');
    iframe.id   = 'iframe-' + slot.slotId;
    iframe.src  = buildSlotIframeUrl(slot.slotId, skinDef, sw);
    iframe.style.cssText = `width:${skinEffW(skinDef, sw)}px;height:${skinDef.h}px;border:none;display:block;pointer-events:none;overflow:hidden;`;
    iframe.scrolling = 'no';
    iframe.addEventListener('load', () => {
      setTimeout(() => { injectFakeData(iframe); }, 300);
      const fakeInterval = setInterval(() => {
        if (_shimActive) { clearInterval(fakeInterval); return; }
        injectFakeData(iframe);
      }, 100);
      _fakeIntervals.push(fakeInterval);
    });
    el.appendChild(iframe);

    el.addEventListener('mousedown', e => startDrag(e, slot.slotId));
    el.addEventListener('click', () => selectWidget(slot.slotId));
    preview.appendChild(el);
  });
}

    div.innerHTML = `
      <div class="widget-header">
        <button class="collapse-btn" id="col-${def.id}" title="Collapse/Expand">&#9660;</button>

      p.set('scale', ww.scale || 1); p.set('opacity', ww.opacity || 1);

      if (extras.includes('scrollSpeed') && ww.scrollSpeed) p.set('scrollspeed', ww.scrollSpeed);
      if (extras.includes('customName') && ww.customName) p.set('customname', encodeURIComponent(ww.customName));
      if (extras.includes('chaseColor') && ww.chaseColor) p.set('chasecolor', ww.chaseColor);
      if (extras.includes('finalLapColor') && ww.finalLapColor) p.set('finallapcolor', ww.finalLapColor);

      if (extras.includes('finalLapSponsorColor') && ww.finalLapSponsorColor) p.set('finallapsponsorcolor', ww.finalLapSponsorColor);

      if (extras.includes('showSteer') && ww.showSteer === false) p.set('showsteer', '0');

    document.getElementById(`op-${def.id}`).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      document.getElementById(`opv-${def.id}`).textContent = Math.round(v * 100) + '%';

      if (iframe) {

      document.getElementById(`vm-${def.id}`)?.addEventListener('change', e => {
        layout[def.id].visibilityMode = e.target.value;

        const v = parseFloat(e.target.value);
        document.getElementById(`ltv-${def.id}`).textContent = v + 'px';
        layout[def.id].lineThickness = v;
        const iframe = document.getElementById(`iframe-${def.id}`);
        iframe?.contentWindow?.postMessage(JSON.stringify({ _lineThickness: v }), '*');
      });

      document.getElementById(`st-${def.id}`)?.addEventListener('change', e => {

        layout[def.id].showSteer = e.target.checked;

        const iframe = document.getElementById(`iframe-${def.id}`);

      document.getElementById(`sm-${def.id}`)?.addEventListener('change', e => {
        layout[def.id].seasonMode = e.target.value;
        saveLayout();
        const iframe = document.getElementById(`iframe-${def.id}`);
        if (iframe) iframe.src = buildWidgetUrl(def, layout[def.id]);

    if (def.extras.includes('resultsMode')) {
      document.getElementById(`rm-${def.id}`)?.addEventListener('change', e => {
        layout[def.id].resultsMode = e.target.value;
        saveLayout();
        const iframe = document.getElementById(`iframe-${def.id}`);
        if (iframe) iframe.src = buildWidgetUrl(def, layout[def.id]);
      });
    }
    if (def.extras.includes('seasonRows')) {
      document.getElementById(`sr-${def.id}`)?.addEventListener('change', e => {
        layout[def.id].seasonRows = Math.max(5, Math.min(40, parseInt(e.target.value) || 14));

        const iframe = document.getElementById(`iframe-${def.id}`);

    if (def.extras.includes('showTrackName')) {
      document.getElementById(`tn-${def.id}`)?.addEventListener('change', e => {

    if (def.extras.includes('steerInput')) {

        const calibRow = document.getElementById(`calib-row-${def.id}`);

      document.getElementById(`calib-btn-${def.id}`)?.addEventListener('click', () => {

    // X/Y inputs
    document.getElementById(`px-${def.id}`)?.addEventListener('change', e => {

      btn.classList.toggle('collapsed', isCollapsed);

  // ── Slot cards ─────────────────────────────────────────────────────────────
  SLOT_DEFS.forEach(slot => {
    try {
    const slotData   = layout[slot.slotId] || { activeSkin: slot.skins[0].id, skins: {} };
    const validSkinIds = slot.skins.map(s => s.id);
    const activeSkin   = validSkinIds.includes(slotData.activeSkin) ? slotData.activeSkin : slot.skins[0].id;
    if (slotData.activeSkin !== activeSkin) slotData.activeSkin = activeSkin;
    const skinDef    = slot.skins.find(s => s.id === activeSkin);
    const sw         = (slotData.skins || {})[activeSkin] || {};

    const div = document.createElement('div');
    div.className = 'widget-item' + (selectedId === slot.slotId ? ' active' : '');
    div.id = 'item-' + slot.slotId;

    div.innerHTML = `
      <div class="widget-header">
        <button class="collapse-btn" id="col-${slot.slotId}" title="Collapse/Expand">&#9660;</button>
        <span class="widget-name">${slot.label}</span>
        <label class="toggle">
          <input type="checkbox" id="en-${slot.slotId}" ${sw.enabled ? 'checked' : ''}>
          <div class="toggle-slider"></div>
        </label>
      </div>
      <div class="widget-controls" id="ctrl-${slot.slotId}">
        <div class="ctrl-row">
          <span class="ctrl-label">Skin</span>
          <select id="skin-${slot.slotId}" style="flex:1;background:#0e1014;border:1px solid #2a2d35;border-radius:3px;padding:4px 6px;font-size:12px;color:#e0e4ec;">
            ${slot.skins.map(s => `<option value="${s.id}" ${s.id === activeSkin ? 'selected' : ''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div id="skin-extras-${slot.slotId}">
          ${buildSlotExtras(slot.slotId, skinDef, sw)}
        </div>
      </div>
    `;
    list.appendChild(div);

    // Wire up skin dropdown
    document.getElementById(`skin-${slot.slotId}`).addEventListener('change', async e => {
      const newSkinId  = e.target.value;
      const newSkinDef = slot.skins.find(s => s.id === newSkinId);
      layout[slot.slotId].activeSkin = newSkinId;
      const newSw = (layout[slot.slotId].skins || {})[newSkinId] || {};

      document.getElementById(`skin-extras-${slot.slotId}`).innerHTML = buildSlotExtras(slot.slotId, newSkinDef, newSw);
      wireSlotExtras(slot.slotId, newSkinDef);

      const oldThumb = document.getElementById(`thumb-${slot.slotId}`);
      if (oldThumb) {
        const cs        = getCurrentScale();
        const newThumb  = document.createElement('div');
        newThumb.className        = 'widget-thumb';
        newThumb.id               = 'thumb-' + slot.slotId;
        newThumb.style.position   = 'absolute';
        newThumb.style.left       = Math.round((newSw.x || 0) * cs) + 'px';
        newThumb.style.top        = Math.round((newSw.y || 0) * cs) + 'px';
        newThumb.style.background = 'transparent';
        newThumb.style.border     = '2px solid rgba(200,168,75,0.6)';
        newThumb.style.width           = skinEffW(newSkinDef, newSw) + 'px';
        newThumb.style.height          = newSkinDef.h + 'px';
        newThumb.style.overflow        = 'hidden';
        newThumb.style.transform       = `scale(${cs * (newSw.scale || 1)})`;
        newThumb.style.transformOrigin = 'top left';

        const newIframe = document.createElement('iframe');
        newIframe.id          = 'iframe-' + slot.slotId;
        newIframe.src         = buildSlotIframeUrl(slot.slotId, newSkinDef, newSw);
        newIframe.style.cssText = `width:${skinEffW(newSkinDef, newSw)}px;height:${newSkinDef.h}px;border:none;display:block;pointer-events:none;overflow:hidden;`;
        newIframe.scrolling   = 'no';
        newIframe.addEventListener('load', () => {
          setTimeout(() => { injectFakeData(newIframe); }, 300);
        });
        newThumb.appendChild(newIframe);
        newThumb.addEventListener('mousedown', e2 => startDrag(e2, slot.slotId));
        newThumb.addEventListener('click', () => selectWidget(slot.slotId));
        oldThumb.replaceWith(newThumb);
      }

      await window.shl.switchSlotSkin(slot.slotId, newSkinId);
      saveLayout();

      const enEl = document.getElementById(`en-${slot.slotId}`);
      if (enEl) enEl.checked = !!newSw.enabled;

      const ctrl = document.getElementById(`ctrl-${slot.slotId}`);
      const btn  = document.getElementById(`col-${slot.slotId}`);
      if (ctrl) ctrl.classList.remove('collapsed');
      if (btn)  btn.classList.remove('collapsed');
    });

    wireSlotExtras(slot.slotId, skinDef);

    document.getElementById(`en-${slot.slotId}`).addEventListener('change', async e => {
      if (!layout[slot.slotId].skins) layout[slot.slotId].skins = {};
      const curSkin = layout[slot.slotId].activeSkin;
      if (!layout[slot.slotId].skins[curSkin]) layout[slot.slotId].skins[curSkin] = {};
      layout[slot.slotId].skins[curSkin].enabled = e.target.checked;
      const ctrl = document.getElementById(`ctrl-${slot.slotId}`);
      if (ctrl) ctrl.classList.toggle('collapsed', !e.target.checked);
      const thumb = document.getElementById(`thumb-${slot.slotId}`);
      thumb?.classList.toggle('hidden-widget', !e.target.checked);
      await window.shl.setSlotSkinEnabled(slot.slotId, e.target.checked);
      saveLayout();
    });

    document.getElementById(`col-${slot.slotId}`).addEventListener('click', () => {
      const ctrl = document.getElementById(`ctrl-${slot.slotId}`);
      const btn  = document.getElementById(`col-${slot.slotId}`);
      const isCollapsed = ctrl.classList.toggle('collapsed');
      btn.classList.toggle('collapsed', isCollapsed);
    });
    } catch(err) { console.error('Slot card error for', slot.slotId, err); }
  });

  // Start all widgets collapsed; start enabled slots expanded
  WIDGET_DEFS.forEach(def => {
    const ctrl = document.getElementById(`ctrl-${def.id}`);
    const btn  = document.getElementById(`col-${def.id}`);
    if (ctrl) ctrl.classList.add('collapsed');
    if (btn)  btn.classList.add('collapsed');
  });
  SLOT_DEFS.forEach(slot => {
    const slotData   = layout[slot.slotId] || {};
    const activeSkin = slotData.activeSkin || slot.skins[0].id;
    const sw         = (slotData.skins || {})[activeSkin] || {};
    const ctrl = document.getElementById(`ctrl-${slot.slotId}`);
    const btn  = document.getElementById(`col-${slot.slotId}`);
    if (!sw.enabled) {
      if (ctrl) ctrl.classList.add('collapsed');
      if (btn)  btn.classList.add('collapsed');
    }
  });
}

// ── Slot helper functions ──────────────────────────────────────────────────
function buildWidgetUrl(def, w) {
  const series = SERIES_ID;
  const seriesName = appConfig.seriesList?.find(s => s.id === series)?.name || series;
  const p = new URLSearchParams();
  if (series && series !== 'default') { p.set('series', series); p.set('seriesname', seriesName); }
  if (INSTALL_DIR) p.set('installdir', INSTALL_DIR);
  p.set('scale', w.scale || 1);
  p.set('opacity', w.opacity || 1);
  p.set('visibilitymode', 'always');
  const extras = def.extras || [];
  if (extras.includes('lineThickness') && w.lineThickness !== undefined) p.set('linethickness', w.lineThickness);
  if (extras.includes('steerInput') && w.steerInput) p.set('steerinput', w.steerInput);
  if (extras.includes('scrollSpeed') && w.scrollSpeed) p.set('scrollspeed', w.scrollSpeed);
  if (extras.includes('customName') && w.customName) p.set('customname', encodeURIComponent(w.customName));
  if (extras.includes('chaseColor') && w.chaseColor) p.set('chasecolor', w.chaseColor);
  if (extras.includes('finalLapColor') && w.finalLapColor) p.set('finallapcolor', w.finalLapColor);
  if (extras.includes('nameColor') && w.nameColor) p.set('namecolor', w.nameColor);
  if (extras.includes('finalLapSponsorColor') && w.finalLapSponsorColor) p.set('finallapsponsorcolor', w.finalLapSponsorColor);
  if (extras.includes('radarMode') && w.radarMode) p.set('radarmode', w.radarMode);
  if (extras.includes('showTrackName') && w.showTrackName === false) p.set('showtrackname', '0');
  if (def.id === 'input' && w.hasClutch === false) p.set('clutch', '0');
  if (def.id === 'input' && w.showTrace === false) p.set('showtrace', '0');
  if (def.id === 'input' && w.showSteer === false) p.set('showsteer', '0');
  if (extras.includes('seasonMode') && w.seasonMode) { p.set('seasonmode', w.seasonMode); p.set('seasonport', SEASON_PORT); }
  if (extras.includes('resultsMode')) { p.set('resultsmode', w.resultsMode || 'auto'); p.set('seasonport', SEASON_PORT); }
  if (extras.includes('seasonRows') && w.seasonRows) p.set('seasonrows', w.seasonRows);
  return `nr2003_${def.id}.html?${p}`;
}

function buildSlotIframeUrl(slotId, skinDef, sw) {
  const seriesName  = appConfig.seriesList?.find(s => s.id === SERIES_ID)?.name || SERIES_ID;
  const seriesParam = SERIES_ID ? `&series=${encodeURIComponent(SERIES_ID)}&seriesname=${encodeURIComponent(seriesName)}` : '';
  const installParam = INSTALL_DIR ? `&installdir=${encodeURIComponent(INSTALL_DIR)}` : '';
  const extras = skinDef.extras || [];
  let url = `nr2003_${skinDef.id}.html?visibilitymode=always&scale=1&opacity=${sw.opacity ?? 1}${seriesParam}${installParam}`;
  if (extras.includes('scrollSpeed') && sw.scrollSpeed)         url += `&scrollspeed=${sw.scrollSpeed}`;
  if (extras.includes('customName')  && sw.customName)          url += `&customname=${encodeURIComponent(sw.customName)}`;
  if (extras.includes('chaseColor')  && sw.chaseColor)          url += `&chasecolor=${encodeURIComponent(sw.chaseColor)}`;
  if (extras.includes('finalLapColor')  && sw.finalLapColor)          url += `&finallapcolor=${encodeURIComponent(sw.finalLapColor)}`;
  if (extras.includes('nameColor')  && sw.nameColor)          url += `&namecolor=${encodeURIComponent(sw.nameColor)}`;
  if (extras.includes('finalLapSponsorColor')  && sw.finalLapSponsorColor)          url += `&finallapsponsorcolor=${encodeURIComponent(sw.finalLapSponsorColor)}`;
  if (extras.includes('sponsorRotationTime') && sw.sponsorRotationTime) url += `&sponsorrotationtime=${sw.sponsorRotationTime}`;
  if (extras.includes('columns') && Number(sw.columns) === 3) url += `&columns=3`;
  if (extras.includes('dnfDisplay')  && sw.dnfDisplay && sw.dnfDisplay !== 'reason') url += `&dnfdisplay=${sw.dnfDisplay}`;
  if (extras.includes('stripZeros')  && sw.stripZeros)          url += `&stripzeros=true`;
  if (extras.includes('showManu')    && sw.showManu === false)   url += `&showmanu=0`;
  if (extras.includes('seasonPts')   && sw.seasonPts && sw.seasonPts !== 'off') url += `&seasonpts=${sw.seasonPts}&seasonport=${SEASON_PORT}`;
  if (extras.includes('showCar')     && sw.showCar  === false)   url += `&showcar=0`;
  if (extras.includes('yellowSound') && sw.yellowSound === false) url += `&yellowsound=0`;
  if (extras.includes('startGrid') && sw.startGrid) url += `&startgrid=1`;
  if (extras.includes('startGrid') && sw.startGridTime) url += `&startgridtime=${sw.startGridTime}`;
  if (extras.includes('startGrid') && sw.startGridSkipSelf) url += `&startgridskip=1`;
  return url;
}

function updateSlotObsUrl(slotId, skinDef, sw) {
  const el = document.getElementById(`obs-url-${slotId}`);
  if (!el) return;
  const base = `http://${STREAM_IP}:${HTTP_PORT}/widget/${skinDef.id}`;
  const p    = new URLSearchParams();
  if (SERIES_ID && SERIES_ID !== 'default') {
    p.set('series', SERIES_ID);
    const seriesName = appConfig.seriesList?.find(s => s.id === SERIES_ID)?.name || SERIES_ID;
    p.set('seriesname', seriesName);
  }
  p.set('scale',          sw.scale   || 1);
  p.set('opacity',        sw.opacity || 1);
  p.set('visibilitymode', sw.visibilityMode || 'at_track');
  const extras = skinDef.extras || [];
  if (extras.includes('scrollSpeed')         && sw.scrollSpeed)         p.set('scrollspeed',         sw.scrollSpeed);
  if (extras.includes('customName')          && sw.customName)          p.set('customname',           encodeURIComponent(sw.customName));
  if (extras.includes('chaseColor')          && sw.chaseColor)          p.set('chasecolor',           sw.chaseColor);
  if (extras.includes('finalLapColor')          && sw.finalLapColor)          p.set('finallapcolor',           sw.finalLapColor);
  if (extras.includes('nameColor')          && sw.nameColor)          p.set('namecolor',           sw.nameColor);
  if (extras.includes('finalLapSponsorColor')          && sw.finalLapSponsorColor)          p.set('finallapsponsorcolor',           sw.finalLapSponsorColor);
  if (extras.includes('sponsorRotationTime') && sw.sponsorRotationTime) p.set('sponsorrotationtime',  sw.sponsorRotationTime);
  if (extras.includes('columns') && Number(sw.columns) === 3) p.set('columns', '3');
  if (extras.includes('dnfDisplay')          && sw.dnfDisplay && sw.dnfDisplay !== 'reason') p.set('dnfdisplay', sw.dnfDisplay);
  if (extras.includes('stripZeros')          && sw.stripZeros)          p.set('stripzeros',            'true');
  if (extras.includes('showManu')            && sw.showManu === false)  p.set('showmanu',              '0');
  if (extras.includes('seasonPts')           && sw.seasonPts && sw.seasonPts !== 'off') { p.set('seasonpts', sw.seasonPts); p.set('seasonport', SEASON_PORT); }
  if (extras.includes('showCar')             && sw.showCar  === false)  p.set('showcar',               '0');
  if (extras.includes('yellowSound')         && sw.yellowSound === false) p.set('yellowsound',          '0');
  if (extras.includes('startGrid')           && sw.startGrid)           p.set('startgrid',             '1');
  if (extras.includes('startGrid')           && sw.startGridTime)       p.set('startgridtime',         sw.startGridTime);
  if (extras.includes('startGrid')           && sw.startGridSkipSelf)   p.set('startgridskip',         '1');
  el.textContent = `${base}?${p}`;
}

function wireSlotExtras(slotId, skinDef) {
  const extras = skinDef.extras || [];

  function getIframe() { return document.getElementById(`iframe-${slotId}`); }

  function getSkinData() {
    const activeSkin = layout[slotId]?.activeSkin;
    return (layout[slotId]?.skins || {})[activeSkin] || {};
  }

  function saveSkinProp(key, val) {
    const activeSkin = layout[slotId]?.activeSkin;
    if (!layout[slotId]) layout[slotId] = { activeSkin: skinDef.id, skins: {} };
    if (!layout[slotId].skins[activeSkin]) layout[slotId].skins[activeSkin] = {};
    layout[slotId].skins[activeSkin][key] = val;
  }

  const scEl = document.getElementById(`sc-${slotId}`);
  if (scEl) scEl.oninput = e => {
    const v  = parseFloat(e.target.value);
    const cs = getCurrentScale();
    document.getElementById(`scv-${slotId}`).textContent = v.toFixed(2) + 'x';
    saveSkinProp('scale', v);
    const thumb = document.getElementById(`thumb-${slotId}`);
    if (thumb) thumb.style.transform = `scale(${cs * v})`;
  };

  const opEl = document.getElementById(`op-${slotId}`);
  if (opEl) {
    opEl.oninput = e => {
      const v = parseFloat(e.target.value);
      document.getElementById(`opv-${slotId}`).textContent = Math.round(v * 100) + '%';
      saveSkinProp('opacity', v);
    };
    opEl.onchange = e => {
      const v      = parseFloat(e.target.value);
      const iframe = getIframe();
      if (iframe) {
        const url = new URL(iframe.src, location.href);
        url.searchParams.set('opacity', v);
        iframe.src = url.toString();
      }
    };
  }

  if (extras.includes('visibilityMode')) {
    document.getElementById(`vm-${slotId}`).onchange = e => {
      saveSkinProp('visibilityMode', e.target.value);
      getIframe()?.contentWindow?.postMessage(JSON.stringify({ _visibilityMode: e.target.value }), '*');
    };
  }

  if (extras.includes('seasonPts')) {
    document.getElementById(`sp-${slotId}`)?.addEventListener('change', e => {
      saveSkinProp('seasonPts', e.target.value);
      getIframe()?.contentWindow?.postMessage(JSON.stringify({ _seasonPts: e.target.value }), '*');
    });
  }

  if (extras.includes('dnfDisplay')) {
    document.getElementById(`dd-${slotId}`)?.addEventListener('change', e => {
      saveSkinProp('dnfDisplay', e.target.value);
      getIframe()?.contentWindow?.postMessage(JSON.stringify({ _dnfDisplay: e.target.value }), '*');
    });
  }

  if (extras.includes('columns')) {
    document.getElementById(`nmod-${slotId}`)?.addEventListener('change', e => {
      const v = parseInt(e.target.value) === 3 ? 3 : 2;
      saveSkinProp('columns', v);
      const W = (skinDef.id === 'fox2016' && v === 3) ? 1628 : skinDef.w;
      const th = document.getElementById(`thumb-${slotId}`), ifr = document.getElementById(`iframe-${slotId}`);
      if (th)  th.style.width  = W + 'px';
      if (ifr) ifr.style.width = W + 'px';
      getIframe()?.contentWindow?.postMessage(JSON.stringify({ _columns: v }), '*');
    });
  }

  if (extras.includes('chaseColor')) {
    const ccEl = document.getElementById(`cc-${slotId}`);
    const ccSet = v => { saveSkinProp('chaseColor', v); getIframe()?.contentWindow?.postMessage(JSON.stringify({ _chaseColor: v }), '*'); };
    ccEl.oninput = e => ccSet(e.target.value);
    document.getElementById(`ccr-${slotId}`).onclick = () => { ccEl.value = '#007aff'; ccSet('#007aff'); };
  }

  if (extras.includes('nameColor')) {
    const ncEl = document.getElementById(`nc-${slotId}`), npEl = document.getElementById(`np-${slotId}`);
    const ncSet = (v, preset) => {
      saveSkinProp('nameColor', v); saveSkinProp('namePreset', preset);
      getIframe()?.contentWindow?.postMessage(JSON.stringify({ _nameColor: v }), '*');
    };
    ncEl.oninput = e => { npEl.value = 'custom'; ncSet(e.target.value, 'custom'); };   // picking a colour by hand = Custom
    npEl.onchange = () => {
      const pr = NAME_PRESETS.find(x => x.id === npEl.value);
      if (!pr) { saveSkinProp('namePreset', 'custom'); return; }
      ncEl.value = pr.color; ncSet(pr.color, pr.id);
    };
    document.getElementById(`ncr-${slotId}`).onclick = () => { ncEl.value = NAME_DEFAULT; npEl.value = NAME_DEFAULT_PRESET; ncSet(NAME_DEFAULT, NAME_DEFAULT_PRESET); };
  }

  if (extras.includes('finalLapColor')) {
    const flEl = document.getElementById(`fl-${slotId}`);
    const flSet = v => { saveSkinProp('finalLapColor', v); getIframe()?.contentWindow?.postMessage(JSON.stringify({ _finalLapColor: v }), '*'); };

function getCurrentScale() {
  const preview = document.getElementById('preview');
  return parseFloat(preview.style.width) / ACTUAL_W;
}

function startDrag(e, id) {
  e.preventDefault();
  selectWidget(id);
  const thumb    = document.getElementById('thumb-' + id);
  const preview  = document.getElementById('preview');
  const curScale = getCurrentScale();
  const startX   = e.clientX - thumb.offsetLeft;
  const startY   = e.clientY - thumb.offsetTop;

  const slotDef = SLOT_DEFS.find(s => s.slotId === id);
  const def     = slotDef
    ? slotDef.skins.find(s => s.id === layout[id]?.activeSkin) || slotDef.skins[0]
    : WIDGET_DEFS.find(d => d.id === id);
  const userScale = slotDef
    ? ((layout[id]?.skins || {})[layout[id]?.activeSkin]?.scale || 1)
    : (layout[id]?.scale || 1);

  const visualW = (slotDef ? skinEffW(def, (layout[id]?.skins || {})[layout[id]?.activeSkin]) : def.w) * curScale * userScale;
  const visualH = def.h * curScale * userScale;
  const previewW = parseFloat(preview.style.width)  || PREVIEW_W;
  const previewH = parseFloat(preview.style.height) || PREVIEW_H;

  function onMove(e) {
    let nx = e.clientX - startX;
    let ny = e.clientY - startY;
    nx = Math.max(0, Math.min(Math.max(0, previewW - visualW), nx));
    ny = Math.max(0, Math.min(Math.max(0, previewH - visualH), ny));
    thumb.style.left = nx + 'px';
    thumb.style.top  = ny + 'px';
    layout[id].x = Math.round(nx / curScale);
    layout[id].y = Math.round(ny / curScale);
    const slotDef2 = SLOT_DEFS.find(s => s.slotId === id);
    if (slotDef2) {
      const activeSkin = layout[id]?.activeSkin;
      if (activeSkin && layout[id].skins?.[activeSkin]) {
        layout[id].skins[activeSkin].x = Math.round(nx / curScale);
        layout[id].skins[activeSkin].y = Math.round(ny / curScale);
      }
    }
    const pxEl = document.getElementById(`px-${id}`);
    const pyEl = document.getElementById(`py-${id}`);
    if (pxEl) pxEl.value = layout[id].x;
    if (pyEl) pyEl.value = layout[id].y;
  }

  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function selectWidget(id) {
  selectedId = id;
  document.querySelectorAll('.widget-thumb').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.widget-item').forEach(el => el.classList.remove('active'));
  document.getElementById('thumb-' + id)?.classList.add('selected');
  document.getElementById('item-' + id)?.classList.add('active');
  document.getElementById('item-' + id)?.scrollIntoView({ block: 'nearest' });

  WIDGET_DEFS.forEach(def => {
    const ctrl = document.getElementById(`ctrl-${def.id}`);
    const btn  = document.getElementById(`col-${def.id}`);
    if (!ctrl || !btn) return;
    const shouldExpand = def.id === id;
    ctrl.classList.toggle('collapsed', !shouldExpand);
    btn.classList.toggle('collapsed', !shouldExpand);
  });
  SLOT_DEFS.forEach(slot => {
    const ctrl = document.getElementById(`ctrl-${slot.slotId}`);
    const btn  = document.getElementById(`col-${slot.slotId}`);
    if (!ctrl || !btn) return;
    const shouldExpand = slot.slotId === id;
    ctrl.classList.toggle('collapsed', !shouldExpand);
    btn.classList.toggle('collapsed', !shouldExpand);
  });
}

// ── Save helper ────────────────────────────────────────────────────────────
async function saveLayout() {
  await window.shl.saveLayout(layout);
}

// ── Buttons ────────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-btn');

  navigator.clipboard.writeText(url).then(() => {

  }

// ── Calibration ────────────────────────────────────────────────────────────
// (wheel calibration UI wired separately by calibration section)

// ── Window message handler (from overlay iframes) ──────────────────────────
window.addEventListener('message', e => {
  if (typeof e.data !== 'string') return;
  try {
    const m = JSON.parse(e.data);
    if (m._widgetWidth !== undefined && m._widgetId) {
      const iframe = document.getElementById(`iframe-${m._widgetId}`);
      const thumb  = document.getElementById(`thumb-${m._widgetId}`);
      if (thumb && iframe) {
        const def = WIDGET_DEFS.find(d => d.id === m._widgetId);
        if (def) {
          thumb.style.width  = m._widgetWidth + 'px';
          iframe.style.width = m._widgetWidth + 'px';
        }
      }
    }
  } catch(_) {}
});

  const ghostEl = {}; let dragging = null, built = false;
  const kUnit = () => (parseFloat(document.getElementById('preview').style.height) || 0) / 1080;
  const save = (gh, p) => {
    if (gh.put) { const v = gh.put(p); CFG[gh.g] = Object.assign({}, CFG[gh.g], v); S.aimod.setRivalIndicator(v).catch(() => {}); return; }
    if (gh.frac) {
      const W = W1080(), v = { x: Math.round(p[0] / W * 10000) / 10000, y: Math.round(p[1] / 1080 * 10000) / 10000, scale: Math.round(p[2] * 100) / 100 };
      CFG[gh.g] = Object.assign({}, CFG[gh.g], { [gh.key]: v }); S.rc.set({ [gh.key]: v }).catch(() => {}); return;
    }
    const g = GROUPS.find((x) => x.id === gh.g); const v = fmt(p); CFG[gh.g] = Object.assign({}, CFG[gh.g], { [gh.key]: v }); g.set(g.api, gh.key, v); const i = inputs.find((x) => x.dataset.g === gh.g && x.dataset.key === gh.key); if (i && document.activeElement !== i) i.value = v; };
  const paintGhost = (gh) => {
    const el = ghostEl[gh.id], c = CFG[gh.g]; if (!el || !c) return;
    const on = gh.on(c); el.style.display = on ? 'flex' : 'none';
    if (!on || dragging === gh) return;
    const p = parsePos(gh, c), K = kUnit();
    el.style.left = Math.round(p[0] * K) + 'px'; el.style.top = Math.round(p[1] * K) + 'px';
    el.style.width = Math.round(gh.w * K * p[2]) + 'px'; el.style.height = Math.round(gh.h * K * p[2]) + 'px';
  };
  const paintAll = () => GH.forEach(paintGhost);
  const build = () => {
    const preview = document.getElementById('preview');
    if (built || !preview || !preview.style.width || !preview.style.height) return;
    built = true;
    for (const gh of GH) {
      const el = document.createElement('div');
      el.className = 'widget-thumb gfx-ghost'; el.id = 'ghost-' + gh.id; el.textContent = gh.label; el.style.display = 'none';
      el.style.borderColor = 'rgba(232,168,56,.8)'; el.style.background = 'rgba(232,168,56,.14)'; el.style.zIndex = 5; el.title = 'Drag to move, mouse wheel to resize';
      el.addEventListener('mousedown', (e) => {
        e.preventDefault(); const c = CFG[gh.g]; if (!c) return;
        dragging = gh; const K = kUnit(), p = parsePos(gh, c);
        const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop, pw = parseFloat(preview.style.width), ph = parseFloat(preview.style.height);
        const move = (ev) => {
          const nx = Math.max(0, Math.min(Math.max(0, pw - el.offsetWidth), ev.clientX - dx)), ny = Math.max(0, Math.min(Math.max(0, ph - el.offsetHeight), ev.clientY - dy));
          el.style.left = nx + 'px'; el.style.top = ny + 'px'; p[0] = nx / K; p[1] = ny / K;
        };
        const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); dragging = null; save(gh, p); };
        document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
      });
      el.addEventListener('wheel', (e) => {
        e.preventDefault(); const c = CFG[gh.g]; if (!c) return;
        const p = parsePos(gh, c).slice(); p[2] = Math.max(0.4, Math.min(2.5, p[2] + (e.deltaY < 0 ? 0.05 : -0.05)));
        save(gh, p); paintGhost(gh);
      }, { passive: false });
      preview.appendChild(el); ghostEl[gh.id] = el;
    }
    paintAll();
  };
  setInterval(() => { build(); if (built) paintAll(); }, 700);
  window.addEventListener('resize', () => { if (built) paintAll(); });
  refresh(); setInterval(refresh, 2500);
})();
</script>
