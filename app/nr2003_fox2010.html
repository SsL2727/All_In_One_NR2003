<!DOCTYPE html>
<html lang="en">
<head>
<script src="perf-shim.js"></script>
<meta charset="UTF-8">
<title>NR2003 Fox 2010 Ticker</title>
<style>
/* Chase highlight — drivers in the chase get a yellow name background */
.chase { background: #f5d100 !important; color: #111 !important; text-shadow: none !important;
         box-shadow: -3px 0 0 #f5d100, 3px 0 0 #f5d100; }
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'D-DIN Condensed Bold', 'Arial Narrow', Impact, sans-serif;
  --pos:  #f5a31a;
  --ink:  #15171b;
  /* number-cell shape (pos_cell.png), tinted with the driver colour */
  --cell-mask: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEoAAABACAMAAACKlRElAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAQJQTFRFAAAA////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////eRL3UwAAAFZ0Uk5TABAwQDotHQqPv62IWAsgcM//7ciYXTQbBGCv7/ndyZtRIgWV2pFq+vMzn99vNfQPbc49uPj9P73+tvb8N6TjJ3S05g0mZsw2ouH1phIGjs3EOWhNnShT/NaFAAABXElEQVR4nO3YsUvDQBQG8HsJXmuuFmyHOjiodJMiZHBSOziIWP9W1y6OoujgIKaIgkJFaqlaqElj2ubMNTmrFIXeyyT3TQkkP16SJd8DklpgcgTwx3W/3B3lY5oyqBIVBD+pBXg3mOJUAB5rTag8eyt4zJuZYh4TVqcnqbV7Y+VFAYpThEH/WVIA5WYh11akSsOB1ZBUni3CkyIkwpcdzmOqMgKziaAs1w9CQW046/CAgET8YCSoOZoV46VB2dHXvENS47cFZBNC8wZJjd8WEJNmkZCIXznXlKY0pSlNaUpTmtKUpv4FZWcAHCSU/GxvAQwbSCqpANWoTVwiqaSY7EbURToUIXsRdoqAvkocIatlGp4hqG/Vsta9CuYtFzdTTB3y9tKJcidMZpLLAUo5pwqdvuTaUI9nklSG89rt4+wri1x/B47k8+AWKQf1/ddjeYJb7xS729etaQqdT3OZx0EjIS+oAAAAAElFTkSuQmCC");
}

body {
  background: transparent;
  width: 1456px;
  height: 176px;
  overflow: hidden;
  font-family: var(--font);
}

#scale-root {
  position: relative;
  width: 1456px;
  height: 176px;
  transform-origin: top left;
  visibility: hidden;
}

/* ── Background: the header art (1456x107) plus two CSS rows under it ──── */
#bg-layer { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .2s ease; }
#bg-img   { position: absolute; left: 0; top: 0; width: 1456px; height: 107px; display: block; }

/* driver row (dark) — sits under the header art so the sponsor box overlaps it */
#row-top {
  position: absolute; left: 0; top: 100px; width: 1456px; height: 44px;
  background: linear-gradient(#2b2c30 0%, #17181b 55%, #0f1012 100%);
  border-top: 2px solid #050506;
}
/* interval row (light grey, diagonal hatching) — collapses under caution */
#row-bottom-wrap {
  position: absolute; left: 0; top: 144px; width: 1456px; height: 30px;
  overflow: hidden;
  transition: height .45s cubic-bezier(.4,0,.2,1);
}
#row-bottom-wrap.collapsed { height: 0; }
#row-bottom {
  position: absolute; left: 0; top: 0; width: 1456px; height: 30px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, rgba(255,255,255,0) 3px 7px),
    linear-gradient(#dfe1e4, #c6c9ce);
  border-bottom: 2px solid #8a8e96;
}

/* ── Data layer ───────────────────────────────────────────────────────── */
#data-layer { position: absolute; inset: 0; z-index: 2; visibility: hidden; }

/* series logo (left of the flag square) */
#logo-plate {
  position: absolute; left: 266px; top: 60px; width: 208px; height: 34px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: linear-gradient(#202228, #0a0a0c);
  border: 2px solid #3b3e46; border-radius: 3px;
  box-shadow: inset 0 0 0 1px #000;
}
#series-logo { max-width: 194px; max-height: 28px; object-fit: contain; }

/* flag square — fills the dark square already drawn in the background */
#flag-box {
  position: absolute; left: 484px; top: 63px; width: 31px; height: 28px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  transition: background .25s;
}
#flag-box.green  { background: linear-gradient(#34d34a, #0a8a1f); }
#flag-box.yellow { background: linear-gradient(#ffe45e, #e8aa00); }
#flag-box.red    { background: linear-gradient(#ff5a4d, #b3120a); }
#flag-box.white  { background: linear-gradient(#ffffff, #cfd3d9); }
#flag-box.checkered {
  background: conic-gradient(#fff 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0 / 20.67px 18.67px;
}

/* lap / state pill — transparent normally (the pill is in the background art),
   filled yellow or red while a banner is up */
#pill {
  position: absolute; left: 528px; top: 62px; width: 424px; height: 30px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  overflow: hidden;
  transition: background .25s;
}
#pill.yellow { background: linear-gradient(#fff08a 0%, #ffd91a 45%, #e6a800 100%); }
#pill.green  { background: linear-gradient(#7dff8f 0%, #22c43c 45%, #0a8a1f 100%); }
#pill.green #pill-text { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
#pill.red    { background: linear-gradient(#ff8c82 0%, #e33a2d 45%, #a50e06 100%); }
#pill.red #pill-text { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
#pill-text {
  font-size: 28px; line-height: 1; white-space: nowrap; color: var(--ink);
  letter-spacing: .04em; text-transform: uppercase; word-spacing: .18em;
  display: inline-flex; align-items: center; gap: .3em;
}

/* rotating sponsor (right box) */
#sponsor-zone {
  position: absolute; left: 986px; top: 54px; width: 300px; height: 46px;
  display: flex; align-items: center; justify-content: flex-start; overflow: hidden;
}
#sponsor-zone img {
  position: absolute; left: 0; top: 0; max-width: 300px; max-height: 46px;
  object-fit: contain; object-position: left center;
  opacity: 0; transition: opacity .8s ease-in-out;
}
#sponsor-zone img.on { opacity: 1; }

/* ── Scrolling running order ──────────────────────────────────────────── */
#strip {
  position: absolute; left: 0; top: 102px; width: 1456px; height: 72px;
  overflow: hidden;
}
#track {
  position: absolute; left: 0; top: 0; display: flex; align-items: flex-start;
  white-space: nowrap; will-change: transform;
}
.entry { flex: 0 0 auto; display: flex; flex-direction: column; margin-right: 26px; }
.e-top { height: 42px; display: flex; align-items: center; }
.e-bot { height: 30px; display: flex; align-items: center; transition: opacity .25s ease; }
#strip.no-gaps .e-bot { opacity: 0; }

.e-pos {
  font-size: 34px; line-height: 1; color: var(--pos); min-width: 22px; text-align: right;
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
/* number cell: dark outline + light rim + driver-colour fill, all shaped by pos_cell.png */
.e-numwrap { position: relative; margin: 0 10px 0 9px; height: 32px; width: 46px; flex: 0 0 auto;
             display: flex; align-items: center; justify-content: center; }
.e-numwrap .nb-d, .e-numwrap .nb-h, .e-numwrap .nb-c {
  position: absolute;
  -webkit-mask: var(--cell-mask) center / 100% 100% no-repeat;
          mask: var(--cell-mask) center / 100% 100% no-repeat;
}
.e-numwrap .nb-d { inset: -2px;  background: #07080a; }
.e-numwrap .nb-h { inset: 0;     background: rgba(255,255,255,.7); }
.e-numwrap .nb-c { inset: 1.5px; }
.e-numwrap img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px);
                  object-fit: contain; object-position: center; display: block; }
.e-numfb { position: relative; font-size: 30px; line-height: 1; transform: skewX(-8deg); letter-spacing: .01em; }
.e-numwrap.sm { height: 28px; width: 40px; margin: 0 8px; }
.e-numwrap.sm .e-numfb { font-size: 26px; }
.e-name { font-size: 34px; line-height: 1; color: #fff; text-transform: uppercase; letter-spacing: .015em; text-shadow: 0 2px 2px rgba(0,0,0,.55); }
.e-gap  { font-size: 25px; line-height: 1; color: #1b1d21; letter-spacing: .02em; }
.e-gap-pad { width: 0; flex: 0 0 auto; } /* aligns the gap with the name start */

/* checkered-flag separator marks the leader / loop point */
.sep-flag {
  width: 152px; height: 29px; margin-right: 20px;
  background: conic-gradient(#f4f4f4 25%, #151515 0 50%, #f4f4f4 0 75%, #151515 0) 0 0 / 7.25px 7.25px;
  border: 1px solid #000;
  box-shadow: 0 0 0 1px rgba(255,255,255,.18);
}
.sep-label { font-size: 25px; color: #1b1d21; letter-spacing: .03em; padding-left: 2px; }

/* ── Driver Info Banner (hotkey): Fox 2010 look — [hatch | number on the driver's colour | name | TV logo] over a dark row with Info 1 / Info 2 ── */
#di-wrap { position: absolute; left: 4px; top: 190px; width: 1060px; transform-origin: 0 0; z-index: 40; pointer-events: none; display: none; opacity: 0;
           transition: opacity .6s ease; font-family: var(--font); color: #fff; filter: drop-shadow(0 4px 8px rgba(0,0,0,.55)); }
#di-top { position: relative; height: 58px; display: flex; align-items: center; gap: 8px; padding-right: 9px; border-radius: 9px 9px 0 0;
          background: linear-gradient(180deg, #3a3c41 0%, #1b1c1f 48%, #0c0d0f 100%);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(170,176,186,.55); }
#di-hatch { flex: 0 0 222px; height: 30px; margin-left: 3px; border-radius: 4px 0 0 4px; border: 1px solid #70757c; border-right: 0;
            background: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, rgba(255,255,255,0) 3px 7px), linear-gradient(#dfe1e4, #a9adb3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 3px rgba(0,0,0,.25); }
#di-num { position: relative; flex: 0 0 126px; height: 44px; border-radius: 7px; border: 2px solid var(--di-acc, #1e90d8); overflow: hidden;
          display: flex; align-items: center; justify-content: center; background: var(--di-nbg, #3b3f47);
          box-shadow: inset 0 0 0 1px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.55); }
#di-num::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
                 background: linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 52%, rgba(0,0,0,.28) 100%); }
#di-num img { position: relative; z-index: 1; height: calc(100% - 4px); max-width: calc(100% - 8px); object-fit: contain; display: block; }
#di-num .nf { position: relative; z-index: 1; font-size: 38px; line-height: 1; font-style: italic; transform: skewX(-8deg); letter-spacing: .01em; }
#di-name { flex: 1; min-width: 0; height: 44px; border-radius: 7px; border: 2px solid var(--di-acc, #1e90d8); display: flex; align-items: center; padding: 0 16px; overflow: hidden;
           background: linear-gradient(180deg, #25272b 0%, #0f1012 55%, #050506 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.55); }
#di-nm { font-size: 38px; line-height: 1; text-transform: uppercase; white-space: nowrap; letter-spacing: .02em; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.6); }
#di-logo { flex: 0 0 130px; height: 38px; display: none; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid #8a9098; overflow: hidden;
           background: linear-gradient(180deg, #2c2e33, #0b0c0e); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
#di-logo img { max-width: 118px; max-height: 30px; object-fit: contain; display: block; }
#di-sep { height: 7px; background: linear-gradient(180deg, #f4f5f7 0%, #bcc0c6 50%, #7d828a 100%); box-shadow: 0 1px 0 rgba(0,0,0,.55); }
#di-low { position: relative; height: 64px; display: flex; align-items: center; padding-left: 388px; overflow: hidden;
          background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, rgba(255,255,255,0) 2px 6px), linear-gradient(180deg, #303236 0%, #1c1d20 55%, #101113 100%); }
#di-low::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 372px; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
                  background: repeating-linear-gradient(135deg, rgba(255,255,255,.2) 0 3px, rgba(255,255,255,0) 3px 7px), linear-gradient(180deg, #5d6065 0%, #3a3c40 100%); }
#di-r { position: relative; z-index: 1; flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding-right: 18px; line-height: 1.04; white-space: nowrap; }
#di-r .a, #di-r .b { font-size: 28px; text-transform: uppercase; letter-spacing: .02em; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.55); }
#di-r .b { display: flex; align-items: center; gap: 9px; }
#di-r .b .ar { flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
#di-base { position: relative; height: 15px; background: linear-gradient(180deg, #f4f5f7 0 2px, #b3b7bd 2px 6px, rgba(0,0,0,0) 6px); border-radius: 0 0 6px 6px; }
#di-base i { position: absolute; left: 356px; width: 612px; top: 4px; height: 11px; background: linear-gradient(180deg, var(--di-acc-hi, #46b4f2) 0%, var(--di-acc-mid, #1f8fd8) 55%, var(--di-acc-lo, #0c5fa0) 100%);
             clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 10px 100%); }
/* di-css-end */
</style>
</head>

<script>
// ── Chase highlight ─────────────────────────────────────────────────────────
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
function chaseMark(el, n) {
  if (!el) return;
  const k = chaseKey(n);
  el.dataset.chaseNum = k;
  el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(k));
}
function _chasePass() {
  document.querySelectorAll('[data-chase-num]').forEach(el =>
    el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(el.dataset.chaseNum)));
}
function _setChase(list) {
  _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey));
  _chasePass();
}
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}

// ── PSF bootstrap ───────────────────────────────────────────────────────────
const psf           = window.__PSF || {};
const params        = new URLSearchParams(location.search);
const INSTALL_DIR   = psf.installDir || params.get('installdir') || '';
const SERIES_ID     = psf.series     || params.get('series')     || '';
let   SERIES_NAME   = psf.seriesname || params.get('seriesname') || '';
const $ = id => document.getElementById(id);
const SCALE         = parseFloat(psf.scale   || params.get('scale')   || '1');
const OPACITY       = parseFloat(psf.opacity || params.get('opacity') || '1');
const WS_URL        = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;
let   ROTATION_MS   = (parseInt(psf.sponsorrotationtime || params.get('sponsorrotationtime') || '10')) * 1000;
const BANNER_MS     = (parseInt(psf.cautionbannertime   || params.get('cautionbannertime')   || '8'))  * 1000;
let VISIBILITY_MODE = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let SCROLL_SPEED    = parseFloat(psf.scrollspeed || params.get('scrollspeed') || '80');
let DNF_DISPLAY     = psf.dnfdisplay || params.get('dnfdisplay') || 'reason';

function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + rel;
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + rel;
  }
  return rel;
}
const FOX_BASE = assetPath('images/Fox2010');

// ── Fonts ───────────────────────────────────────────────────────────────────
(function injectFonts() {
  const el = document.createElement('style');
  el.textContent = `@font-face { font-family:'D-DIN Condensed Bold'; src:url('${assetPath('images/ticker/DIN Condensed Bold.ttf')}') format('truetype'); font-weight:bold; font-style:normal; font-display:swap; }`;
  document.head.appendChild(el);
})();

// ── Scale ───────────────────────────────────────────────────────────────────
const root = document.getElementById('scale-root');
root.style.transform = `scale(${SCALE})`;
document.body.style.width  = Math.round(1456 * SCALE) + 'px';
document.body.style.height = Math.round(176  * SCALE) + 'px';

// ── Visibility ──────────────────────────────────────────────────────────────
let _preview = false;
function checkVisibility(d) {
  if (_preview) return true;
  switch (VISIBILITY_MODE) {
    case 'always': return true;
    case 'in_car': return !!(d.atTrack && d.player?.inCar);
    default:       return !!d.atTrack;
  }
}
function setVisible(v) {
  root.style.visibility = v ? 'visible' : 'hidden';
  document.getElementById('bg-layer').style.opacity = v ? OPACITY : '0';
  document.getElementById('data-layer').style.visibility = v ? 'visible' : 'hidden';
}

// ── Background override ─────────────────────────────────────────────────────
// The header art is embedded as a default; a file at images/Fox2010/background.png
// (1456x107, transparent below the bar) replaces it when present.
(function() {
  const probe = new Image();
  probe.onload = () => { document.getElementById('bg-img').src = probe.src; };
  probe.src = FOX_BASE + '/background.png';
})();

// ── Series logo (left plate) ────────────────────────────────────────────────
(function() {
  const img = document.getElementById('series-logo');
  img.onload  = () => { img.style.display = ''; };
  img.onerror = () => { img.style.display = 'none'; };
  img.src = SERIES_ID ? assetPath(`series/${SERIES_ID}/serieslogo.png`) : assetPath('images/nr2003_logo.svg');
})();

// ── Rotating sponsor (right box) ────────────────────────────────────────────
let _sponsors = [], _sIdx = 0, _sFront = 'a';
async function loadSponsors() {
  const probes = [];
  for (let i = 1; i <= 20; i++) {
    probes.push(new Promise(res => {
      const img = new Image();
      const src = `${FOX_BASE}/sponsors/sponsor${String(i).padStart(2, '0')}.png`;
      img.onload  = () => res(src);
      img.onerror = () => res(null);
      img.src = src;
    }));
  }
  _sponsors = (await Promise.all(probes)).filter(Boolean);
  if (!_sponsors.length) return;
  const a = document.getElementById('sponsor-a');
  a.src = _sponsors[0]; a.classList.add('on');
  if (_sponsors.length > 1) startSponsorTimer();
}
let _sponsorTimer = null;
function startSponsorTimer() {
  if (_sponsorTimer) clearInterval(_sponsorTimer);
  _sponsorTimer = setInterval(nextSponsor, ROTATION_MS);
}
function nextSponsor() {
  _sIdx = (_sIdx + 1) % _sponsors.length;
  const front = document.getElementById('sponsor-' + _sFront);
  const backId = _sFront === 'a' ? 'b' : 'a';
  const back  = document.getElementById('sponsor-' + backId);
  back.onload = () => { back.classList.add('on'); front.classList.remove('on'); _sFront = backId; back.onload = null; };
  back.src = _sponsors[_sIdx];
}

// ── Flag square + pill (lap / caution banner) ───────────────────────────────
const flagBox  = document.getElementById('flag-box');
const pill     = document.getElementById('pill');
const pillText = document.getElementById('pill-text');
const rowBotWrap = document.getElementById('row-bottom-wrap');

function ordinal(n) {
  const v = n % 100;
  if (v >= 11 && v <= 13) return n + 'TH';
  return n + (['TH','ST','ND','RD'][n % 10] || 'TH');
}
function fitPill() {
  let size = 28;
  pillText.style.fontSize = size + 'px';
  while (pillText.scrollWidth > pill.clientWidth - 20 && size > 13) { size -= 1; pillText.style.fontSize = size + 'px'; }
}
let _pillTxt = '', _pillCls = '';
function setPill(html, cls) {            // html: plain caps text or markup (winner badge)
  if (html !== _pillTxt) { _pillTxt = html; pillText.innerHTML = html; fitPill(); }
  if (cls !== _pillCls)  { _pillCls = cls;  pill.className = cls; }
}
let _flagCls = '';
function setFlag(name) {
  if (name === _flagCls) return;
  _flagCls = name; flagBox.className = name;
}

// After the checkered flag the pill shows  WINNER [number] NAME  in yellow.
function winnerPillHTML(d) {
  const w = getStandings(d)[0];
  if (!w) return '';
  const num  = (w.number || '').toString().trim();
  const name = (w.name || num).toUpperCase();
  return `WINNER${num ? numberHTML(num, ' sm') : ''}<span>${esc(name)}</span>`;
}

// La bandera de cuadros y el ganador solo salen cuando el LÍDER ya ha cruzado la
// línea de meta al acabar la última vuelta. La fuente de datos puede marcar
// 'checkered' unos instantes antes, así que se usa la posición del líder en la
// pista (trkPct: 0 = línea de meta) y se "engancha" (latch) al cruzar.
let _finishLatched = false;
function _leaderTrkPct(d) {
  const lead = (d.liveStandings || d.standings || [])[0];
  if (!lead || lead.carIdx === undefined) return null;
  const opp = (d.opponents || []).find(o => o.carIdx === lead.carIdx);
  if (opp && typeof opp.trkPct === 'number') return opp.trkPct;
  if (d.playerCarIdx === lead.carIdx && d.player && typeof d.player.trkPct === 'number') return d.player.trkPct;
  return null;
}
function updateFinishLatch(d) {
  const state = (d.sessionState || '').toLowerCase();
  if (state !== 'checkered' && state !== 'cool down') { _finishLatched = false; return; }
  if (_finishLatched) return;
  if (state === 'cool down' || (d.session || '').toLowerCase() !== 'race') { _finishLatched = true; return; }
  const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  const lead = (d.liveStandings || d.standings || [])[0];
  const cl = lead && d.carLaps ? d.carLaps[lead.carIdx] : undefined;
  const laps = Math.max(d.lapsComplete || 0, cl || 0, (lead && lead.lap) || 0);
  if (lt > 0 && laps < lt) return;                     // aún le queda vuelta al líder
  if (d.lapsRemaining !== undefined && lt > 0 && d.lapsRemaining > 0) return;
  const pct = _leaderTrkPct(d);
  if (pct === null) { _finishLatched = true; return; } // sin posición en pista: criterio antiguo
  if (pct < 0.5) _finishLatched = true;                // ya pasó la meta (pct vuelve a ~0)
}
function raceFinished(d) {
  const state = (d.sessionState || '').toLowerCase();
  if (state === 'cool down') return true;
  if (state !== 'checkered') return false;
  if ((d.session || '').toLowerCase() !== 'race') return true;
  return _finishLatched;
}

function lapText(d) {
  const session = (d.session || '').toLowerCase();
  const state   = (d.sessionState || '').toLowerCase();
  const lc = d.lapsComplete || 0;
  const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  if (session === 'race') {
    if (raceFinished(d)) return 'RESULTS';
    if (state === 'get in car' || state === 'warmup' || state === 'parade laps') return 'PRE-RACE';
    if (lt > 0) {
      const togo = lt - lc;
      if (lc > 0 && togo <= 1) return 'FINAL LAP';
      if (lc > 0 && lc >= Math.floor(lt / 2)) return `${togo} ${togo === 1 ? 'LAP' : 'LAPS'} TO GO`;   // from halfway on
      return `LAP ${Math.min(lc + 1, lt)} OF ${lt}`;
    }
    return `LAP ${lc + 1}`;
  }
  if (session === 'qualifying') return 'QUALIFYING';
  const t = d.timeRemaining || 0;
  if (t > 0) return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  return 'PRACTICE';
}

// Caution banner: when the yellow comes out the pill shows "1ST CAUTION" in
// yellow for BANNER_MS, then returns to the lap counter while the small flag
// square stays yellow until the green is shown.
