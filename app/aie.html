<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>AI Enhanced</title><link rel="stylesheet" href="ui.css"></head>
<body>
<header class="app-header"><h1>🛞 AI Enhanced</h1><span class="grow"></span><span class="chip plain" id="state">—</span></header>
<main style="padding:16px">
  <div class="card"><div class="body stack">
    <label class="check"><input type="checkbox" id="on-start"> Launch AI Enhanced when All In One NR2003 starts</label>
  </div></div>
</main>
<script>
const $ = (id) => document.getElementById(id), A = window.shl.aie;
function paint(s) { $('on-start').checked = !!s.onStart; $('state').textContent = s.running ? 'AI Enhanced is running' : 'AI Enhanced is not running'; }
$('on-start').onchange = () => A.launchSet($('on-start').checked).then(paint);
const poll = () => A.launchGet().then(paint).catch(() => {});
poll(); setInterval(poll, 2500);
</script></body></html>
