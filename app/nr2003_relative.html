<!DOCTYPE html>
<html lang="en">
<head>
<script src="perf-shim.js"></script>
<meta charset="UTF-8">
<title>NR2003 Relative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Background colors — alpha set by JS from ?opacity= param */
  --bg-a:         1.0;
  --bg:           rgba(22, 24, 28,    var(--bg-a));
  --bg-header:    rgba(13, 15, 18,    var(--bg-a));
  --bg-footer:    rgba(13, 15, 18,    var(--bg-a));
  --bg-row:       rgba(24, 26, 30,    var(--bg-a));
  --bg-row-alt:   rgba(20, 22, 26,    var(--bg-a));
  --bg-player:    rgba(40, 34, 10,    var(--bg-a));
  --border:       #2a2e36;
  --border-hi:    #3a3f4a;

  /* Row text colors — always full opacity */
  --col-player:        #f0c040;
  --col-ahead:         #e84444;
  --col-same:          #ffffff;
  --col-behind:        #5a9ee8;
  --col-dim:           #3a4050;
  --col-delta-player:  #f0c040;
  --col-delta-ahead:   #e84444;
  --col-delta-same:    #8a909e;
  --col-delta-behind:  #5a9ee8;

  /* Number pill */
  --pill-bg:      rgba(38, 42, 52, 0.95);
  --pill-border:  #3a3f4a;

  --font-num: 'Russo One', sans-serif;
  --font-ui:  'Barlow Condensed', sans-serif;

  --row-h:    32px;
  --widget-w: 460px;
}

html, body {
  background: transparent;
  overflow: hidden;
  width: 100%; height: 100%;
  font-family: var(--font-ui);
  user-select: none;
}

#scale-root {
  transform-origin: top left;
  display: inline-block;
}

/* ── Widget shell ────────────────────────────────────────────────────────── */
#widget {
  width: var(--widget-w);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Header ──────────────────────────────────────────────────────────────── */
#header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  height: 32px;
  flex-shrink: 0;
}

#hdr-session {
  font-family: var(--font-num);
  font-size: 13px;
  color: #ffffff;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex: 1;
}

#hdr-lap {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  color: #9aa0b0;
  letter-spacing: 0.03em;
  text-align: right;
  white-space: nowrap;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}

#hdr-flag {
  min-width: 100px;
  text-align: right;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

/* ── Rows ─────────────────────────────────────────────────────────────────── */
#rows {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.rel-row {
  display: grid;
  /* pos | num-pill | name | delta */
  grid-template-columns: 36px 58px 1fr 68px;
  align-items: center;
  height: var(--row-h);
  padding: 0 10px 0 8px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  position: relative;
  gap: 6px;
}

/* Alternating row bg */
.rel-row:not(.is-player):nth-child(odd)  { background: var(--bg-row); }
.rel-row:not(.is-player):nth-child(even) { background: var(--bg-row-alt); }

/* Player row */
.rel-row.is-player {
  background: var(--bg-player);
  border-top:    1px solid rgba(240,192,64,0.25);
  border-bottom: 1px solid rgba(240,192,64,0.25);
}

/* Left accent bar for player */
.rel-row.is-player::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--col-player);
  border-radius: 0 2px 2px 0;
}

/* Empty row */
.rel-row.empty { opacity: 0; pointer-events: none; }

/* ── Position number ─────────────────────────────────────────────────────── */
.r-pos {
  font-family: var(--font-num);
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  line-height: 1;
}
.color-player   .r-pos { color: rgba(240,192,64,0.8); }
.color-ahead    .r-pos { color: rgba(232,68,68,0.7); }
.color-behind   .r-pos { color: rgba(90,158,232,0.7); }
.color-practice .r-pos { color: rgba(255,255,255,0.5); }

/* ── Car number pill ─────────────────────────────────────────────────────── */
.r-num-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  border-radius: 3px;
  padding: 2px 6px;
  font-family: var(--font-num);
  font-size: 12px;
  color: #ffffff;
  white-space: nowrap;
  width: 100%;
  height: 22px;
}
.color-player   .r-num-pill { border-color: rgba(240,192,64,0.5); color: var(--col-player); }
.color-ahead    .r-num-pill { border-color: rgba(232,68,68,0.4);  color: var(--col-ahead); }
.color-behind   .r-num-pill { border-color: rgba(90,158,232,0.4); color: var(--col-behind); }

/* ── Driver name ─────────────────────────────────────────────────────────── */
.r-name {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
}

/* ── Delta ───────────────────────────────────────────────────────────────── */
.r-delta {
  font-family: var(--font-num);
  font-size: 13px;
  text-align: right;
  letter-spacing: 0.02em;
}

/* ── Color classes ───────────────────────────────────────────────────────── */
.color-player .r-name  { color: var(--col-player); }
.color-player .r-delta { color: var(--col-delta-player); }

.color-ahead  .r-name  { color: var(--col-ahead); }
.color-ahead  .r-delta { color: var(--col-delta-ahead); }

.color-same   .r-name  { color: var(--col-same); }
.color-same   .r-delta { color: var(--col-delta-same); }

.color-behind .r-name  { color: var(--col-behind); }
.color-behind .r-delta { color: var(--col-delta-behind); }

.color-practice .r-name,
.color-practice .r-delta        { color: var(--col-same); }
.color-practice.is-player .r-name,
.color-practice.is-player .r-delta { color: var(--col-player); }

/* ── Qualifying placeholder ──────────────────────────────────────────────── */
#qual-placeholder {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: calc(var(--row-h) * 7);
  gap: 8px;
}
#qual-placeholder .qp-label {
  font-family: var(--font-num);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--col-dim);
  text-transform: uppercase;
  text-align: center;
  line-height: 1.6;
}

/* ── Footer ──────────────────────────────────────────────────────────────── */
#footer {
  background: var(--bg-footer);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  height: 28px;
  flex-shrink: 0;
}

.ftr-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: #6a7080;
}
.ftr-val {
  font-family: var(--font-ui);
  font-weight: 600;
  color: #9aa0b0;
  font-size: 12px;
}

/* ── Connecting overlay ──────────────────────────────────────────────────── */
#connecting {
  position: absolute;
  inset: 0;
  background: rgba(13,15,18,0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 6px;
  z-index: 10;
}
#connecting.hidden { display: none; }

.conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #e84444;
  box-shadow: 0 0 6px #e84444;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.conn-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5a6070;
}
</style>
</head>
<body>

<div id="scale-root">
<div id="widget" style="position:relative;">

  <div id="connecting">
    <div class="conn-dot"></div>
    <div class="conn-label">Waiting for bridge</div>
  </div>

  <div id="header">
    <span id="hdr-session">—</span>
    <span id="hdr-lap">—</span>
    <span id="hdr-flag"></span>
  </div>

  <div id="rows">
    <div class="rel-row empty" id="row-0"></div>
    <div class="rel-row empty" id="row-1"></div>
    <div class="rel-row empty" id="row-2"></div>
    <div class="rel-row empty" id="row-3"></div>
    <div class="rel-row empty" id="row-4"></div>
    <div class="rel-row empty" id="row-5"></div>
    <div class="rel-row empty" id="row-6"></div>
    <div id="qual-placeholder">
      <div class="qp-label">QUALIFYING<br>Relative unavailable</div>
    </div>
  </div>

  <div id="footer">
    <div class="ftr-item">
      <span class="ftr-val" id="ftr-time">--:-- --</span>
    </div>
    <div class="ftr-item">
      <span class="ftr-val" id="ftr-lastlap"></span>
    </div>
  </div>

</div>
</div>

<script>
// ── URL params ────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const INSTALL_DIR = params.get('installdir') || '';
function assetPath(rel) {
  const psf = window.__PSF;
  if (psf && psf.assetBase) return psf.assetBase + '/' + rel;
  if (INSTALL_DIR) {
    const encoded = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + encoded + '/' + rel;
  }
  return rel;
}
const WS_HOST = params.get('host')    || 'localhost';
const WS_PORT = params.get('port')    || '8765';
const WS_URL  = window.__PSF?.wsUrl || `ws://${WS_HOST}:${WS_PORT}`;

// ── In-car visibility ─────────────────────────────────────────────────────
let VISIBILITY_MODE = params.get('visibilitymode') || 'in_car';
const ALWAYS_VISIBLE = VISIBILITY_MODE === 'always'; // legacy compat

// ── Visibility mode ───────────────────────────────────────────────────────────
// Modes: 'in_car' | 'at_track' | 'always'
// Responds to postMessage { _visibilityMode: '...' } from layout editor
window.addEventListener('message', e => {
  if (typeof e.data === 'string') {
    try {
      const m = JSON.parse(e.data);
      if (m._visibilityMode !== undefined) {
        VISIBILITY_MODE = m._visibilityMode;
      }
    } catch(ex) {}
  }
});

function checkVisibility(d) {
  if (!d) return false;
  switch (VISIBILITY_MODE) {
    case 'always':   return true;
    case 'at_track': return !!d.atTrack;
    case 'in_car':
    default:         return !!(d.atTrack && d.player?.inCar);
  }
}


let _visHideTimer = null;
function updateVisibility(d) {
  const session = (d?.session || '').toLowerCase();
  const visible = checkVisibility(d);
  // Hide entirely during testing/qualifying — ghost cars appear, widget useless
  if (session === 'testing' || session === 'qualifying') {
    if (_visHideTimer) { clearTimeout(_visHideTimer); _visHideTimer = null; }
    document.getElementById('scale-root').style.opacity = '0';
    return;
  }
  if (visible) {
    if (_visHideTimer) { clearTimeout(_visHideTimer); _visHideTimer = null; }
    document.getElementById('scale-root').style.opacity = '1';
  } else {
    if (!_visHideTimer) {
      _visHideTimer = setTimeout(() => {
        document.getElementById('scale-root').style.opacity = '0';
        _visHideTimer = null;
      }, 1000);
    }
  }
}

// ── Session reset handler ─────────────────────────────────────────────────
function handleReset() {
  // Clear all cached data so stale state doesn't persist
  latestData = null;
  if (typeof _rowCache !== 'undefined') _rowCache.clear();

  if (typeof dotCache  !== 'undefined') Object.keys(dotCache).forEach(k => delete dotCache[k]);
  if (typeof smoothPos !== 'undefined') Object.keys(smoothPos).forEach(k => delete smoothPos[k]);
  if (typeof _sortedIdx !== 'undefined') { _sortedIdx = null; normalized = null; normBounds = null; }
  if (typeof playerTrkPctSmooth !== 'undefined') playerTrkPctSmooth = -1;
  // Clear SVG dots
  ['field-dots','player-dot','leader-dot'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
  // Clear track lines
  ['track-border','track-surface'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.setAttribute('points',''); el.setAttribute('d',''); }
  });
}

const SCALE   = Math.max(0.1, Math.min(4.0, parseFloat(params.get('scale')   || '1.0')));
const OPACITY = Math.max(0.0, Math.min(1.0, parseFloat(params.get('opacity') || '1.0')));

const WIDGET_W = 460;
// Height: header(32) + 7 rows(32×7=224) + footer(28) + borders = 286
const WIDGET_H = 286;

// Apply scale
const root = document.getElementById('scale-root');
root.style.transform = `scale(${SCALE})`;
root.style.width  = WIDGET_W + 'px';
root.style.height = WIDGET_H + 'px';
document.body.style.width  = Math.round(WIDGET_W * SCALE) + 'px';
document.body.style.height = Math.round(WIDGET_H * SCALE) + 'px';

// Apply opacity to background CSS variables only
// Text/data elements use color properties which are unaffected
document.documentElement.style.setProperty('--bg-a', OPACITY);

// ── State ─────────────────────────────────────────────────────────────────
let latestData = null;

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtDelta(s, isPlayer) {
  if (isPlayer) return '0.0';
  const abs = Math.abs(s);
  const str = abs < 100 ? abs.toFixed(1) : Math.round(abs).toString();
  return (s > 0 ? '+' : '-') + str;
}

function fmtTime(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function fmtCountdown(tr) {
  if (!tr || tr <= 0) return '';
  const m = Math.floor(tr / 60);
  const s = Math.floor(tr % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

// Returns the full left-cell header string: "SESSION - info"
function fmtHeaderLeft(d) {
  const session = (d.session || '').toLowerCase();
  const num     = d.sessionNum !== undefined ? d.sessionNum : -1;

  if (session === 'qualifying') {
    const lc = d.playerLapsCompleted || 0;
    // Use lapsTotal if valid, else fall back to defaultQualLaps from track.ini
    const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : (d.defaultQualLaps || 2);
    return `QUALIFYING — ${lc}/${lt}`;
  }

  if (session === 'race') {
    const lc = (d.lapsComplete || 0) + 1;
    const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
    const lapStr = lt > 0 ? `${lc}/${lt}` : `${lc}`;
    return `RACE — ${lapStr}`;
  }

  // Determine label based on session type and sessionNum
  // session="testing" → single car test session → "TESTING" (no countdown)
  // session="practice", sessionNum=0 → Happy Hour (open practice) → "HAPPY HOUR"
  // session="practice", sessionNum=1 → Practice → "PRACTICE"
  if (session === 'testing') {
    return 'TESTING';
  }

  const label = (num === 0) ? 'HAPPY HOUR' : 'PRACTICE';
  const countdown = fmtCountdown(d.timeRemaining);
  return countdown ? `${label} — ${countdown}` : label;
}

// ── Live standings state (copied from livestandings widget) ──────────────────
let _relLappedState    = new Map();
let _relStickyLeaderLap = 0;
let _relLastOfficialHash = '';
let _relRefLapTime     = 0;
let _relIsLiveMode     = false;

function _relSyncWithOfficial(d) {
  const standings = d.standings || [];
  if (!standings.length) return;
  const leaderLap = standings[0].lap || 0;
  if (leaderLap <= _relStickyLeaderLap && _relStickyLeaderLap > 0) return;
  _relStickyLeaderLap = leaderLap;
  standings.forEach(s => {
    const ci = s.carIdx;
    const officialDown = leaderLap - (s.lap || 0);
    const stickyDown   = _relLappedState.get(ci) || 0;
    if (officialDown === 0 && stickyDown > 0) _relLappedState.delete(ci);
    else if (officialDown > stickyDown) _relLappedState.set(ci, officialDown);
  });
}

function _relComputeLive(d) {
  const standings  = d.standings || [];
  const session    = (d.session      || '').toLowerCase();
  const state      = (d.sessionState || '').toLowerCase();
  if (session !== 'race') return standings;
  if (state === 'cool down') return standings;
  const cautionPhase = d.cautionPhase;
  if (cautionPhase === 'frozen' || cautionPhase === 'official' || cautionPhase === 'warmup') return standings;

  const officialHash = standings.map(s => s.carIdx + ':' + s.lap).join(',');
  if (officialHash !== _relLastOfficialHash) {
    _relLastOfficialHash = officialHash;
    _relSyncWithOfficial(d);
  }

  const opponents = d.opponents || [];
  const playerIdx = d.playerCarIdx;
  const player    = d.player || {};
  const carLaps   = d.carLaps || {};
  const metaMap   = {};
  standings.forEach(s => { metaMap[s.carIdx] = s; });

  const cars = [];
  opponents.forEach(opp => {
    const ci   = opp.carIdx;
    const laps = carLaps[ci] !== undefined ? carLaps[ci] : (metaMap[ci]?.lap || 0);
    cars.push({ carIdx: ci, trkPct: opp.trkPct || 0, laps, totalProgress: laps + (opp.trkPct || 0) });
  });
  if (player.trkPct !== undefined && !cars.find(c => c.carIdx === playerIdx)) {
    const laps = carLaps[playerIdx] !== undefined ? carLaps[playerIdx] : (metaMap[playerIdx]?.lap || 0);
    cars.push({ carIdx: playerIdx, trkPct: player.trkPct, laps, totalProgress: laps + player.trkPct });
  }

  cars.sort((a, b) => b.totalProgress - a.totalProgress);
  const leaderProgress = cars.length > 0 ? cars[0].totalProgress : 0;
  cars.forEach(car => {
    const stickyDown = _relLappedState.get(car.carIdx) || 0;
    if (stickyDown > 0) {
      const leaderLaps = Math.round(leaderProgress);
      car.totalProgress = (leaderLaps - stickyDown) + car.trkPct;
    }
  });

  const officialOrder = {};
  standings.forEach((s, i) => { officialOrder[s.carIdx] = i; });
  cars.sort((a, b) => {
    const aDown = _relLappedState.get(a.carIdx) || 0;
    const bDown = _relLappedState.get(b.carIdx) || 0;
    if (aDown === 0 && bDown === 0) return b.totalProgress - a.totalProgress;
    if (aDown === 0) return -1;
    if (bDown === 0) return 1;
    if (aDown !== bDown) return aDown - bDown;
    return (officialOrder[a.carIdx] ?? 999) - (officialOrder[b.carIdx] ?? 999);
  });

  const leader = cars[0];
  if (!leader) return standings;
  _relIsLiveMode = leader.laps >= 1;
  if (!_relIsLiveMode) return standings;

  const leaderMeta = metaMap[leader.carIdx];
  if (leaderMeta?.lastLap && leaderMeta.lastLap > 0) _relRefLapTime = leaderMeta.lastLap;
  else if (d.fastestLap && d.fastestLap > 0)         _relRefLapTime = d.fastestLap;
  if (_relRefLapTime <= 0) return standings;

  return cars.map((car, i) => {
    const prevLapped = _relLappedState.get(car.carIdx) || 0;
    const progDiff   = leader.totalProgress - car.totalProgress;
    const mathLaps   = Math.floor(progDiff);
    const carAheadOfLeader = car.trkPct > leader.trkPct + 0.05;
    let lapsDiff = prevLapped > 0 ? prevLapped : (mathLaps >= 1 && !carAheadOfLeader) ? mathLaps : 0;
    if (lapsDiff > 0 && !prevLapped) _relLappedState.set(car.carIdx, lapsDiff);
    return { carIdx: car.carIdx, pos: i + 1, lapsDiff };
  });
}

function lapRelation(theirDown, playerDown) {
  if (theirDown < playerDown) return 'ahead';
  if (theirDown > playerDown) return 'behind';
  return 'same';
}

function buildPosMap(standings) {
  const map = {};
  standings.forEach((s, i) => { map[s.carIdx] = i + 1; });
  return map;
}

// ── Render ────────────────────────────────────────────────────────────────
const rowEls = [0,1,2,3,4,5,6].map(i => document.getElementById(`row-${i}`));
const qualEl = document.getElementById('qual-placeholder');

// last content written to each row (null = unknown) — see render()
const _rowKey = [];
function render(d) {
  updateVisibility(d);
  if (!d || !d.atTrack) { setAllEmpty(); return; }

  const session    = (d.session || '').toLowerCase();
  const isQual     = session === 'qualifying';
  const isPractice = session === 'practice' || session === 'testing';

  if (isQual || session === 'testing') {
    document.getElementById('scale-root').style.opacity = '0';
    return;
  }
  if (checkVisibility(d)) {
    document.getElementById('scale-root').style.opacity = '1';
  }

  document.getElementById('hdr-session').textContent = fmtHeaderLeft(d);
  document.getElementById('hdr-lap').textContent = d.trackNameShort || d.track || '';

  const flag   = (d.sessionFlag || 'green').toLowerCase();
  const flagEl = document.getElementById('hdr-flag');
  if (flag === 'yellow') {
    flagEl.textContent = '⚑ CAUTION'; flagEl.style.color = '#e8c84a';
  } else if (flag === 'red') {
    flagEl.textContent = '⚑ RED FLAG'; flagEl.style.color = '#e84444';
  } else {
    flagEl.textContent = '';
  }

  if (isQual) {
    _rowKey.length = 0;   // rows are rewritten behind the memo's back
    rowEls.forEach(r => { r.className = 'rel-row empty'; r.style.display = 'none'; });
    qualEl.style.display = 'flex';
    return;
  }

  qualEl.style.display = 'none';
  rowEls.forEach(r => r.style.display = '');

  const relative    = d.relative  || [];
  const playerIdx   = d.playerCarIdx;

  // Use bridge-computed live standings for position and lapped state
  // liveStandings has lapsDown field per entry
  const liveStandings = d.liveStandings || d.standings || [];
  const livePosMap    = {};
  const liveLapMap    = {};
  liveStandings.forEach((s, i) => {
    livePosMap[s.carIdx] = i + 1;
    liveLapMap[s.carIdx] = s.lapsDown || 0;
  });

  const playerRelIdx = relative.findIndex(r => r.isPlayer);
  if (playerRelIdx < 0) { setAllEmpty(); return; }

  const AHEAD = 3, BEHIND = 3;
  const slots = [];
  for (let offset = -AHEAD; offset <= BEHIND; offset++) {
    const ri = playerRelIdx + offset;
    slots.push((ri >= 0 && ri < relative.length) ? relative[ri] : null);
  }

  const playerDown = liveLapMap[playerIdx] || 0;

  slots.forEach((entry, slotIdx) => {
    const el = rowEls[slotIdx];
    if (!entry) {
      if (_rowKey[slotIdx] !== 'empty') {
        _rowKey[slotIdx] = 'empty';
        el.className = 'rel-row empty';
        el.innerHTML = '';
      }
      return;
    }

    const isPlayer  = entry.isPlayer;
    const theirDown = liveLapMap[entry.carIdx] || 0;
    const isPracticeSession = isPractice;

    let relation;
    if (isPlayer || isPracticeSession) {
      relation = 'same';
    } else {
      relation = lapRelation(theirDown, playerDown);
    }

    const pos  = livePosMap[entry.carIdx] || '—';
    const num  = (entry.number || '??').trim();
    const name = (entry.name   || '?').toUpperCase();

    // Gap — always show physical gap in seconds regardless of flag/lapped state
    // Positive deltaS = they are ahead of me → show as +X.X
    // Negative deltaS = they are behind me  → show as -X.X
    let deltaStr;
    if (isPlayer) {
      deltaStr = '—';
    } else {
      const s   = entry.deltaS || 0;
      const abs = Math.abs(s).toFixed(1);
      deltaStr  = s >= 0 ? `+${abs}` : `-${abs}`;
    }

    let colorClass;
    if (isPlayer)                  colorClass = 'color-player';
    else if (d.isOnline)           colorClass = 'color-same';
    else if (relation === 'ahead') colorClass = 'color-ahead';
    else if (relation === 'behind')colorClass = 'color-behind';
    else                           colorClass = 'color-same';

    // Perf: gaps are shown to 0.1s, so most frames change nothing visible.
    const cls = `rel-row ${colorClass}${isPlayer ? ' is-player' : ''}`;
    const key = cls + '|' + pos + '|' + num + '|' + name + '|' + deltaStr;
    if (_rowKey[slotIdx] === key) return;
    _rowKey[slotIdx] = key;
    el.className = cls;
    el.innerHTML = `
      <span class="r-pos">${pos}</span>
      <span class="r-num-pill">${num}</span>
      <span class="r-name">${name}</span>
      <span class="r-delta">${deltaStr}</span>
    `;
  });
}

function setAllEmpty() {
  rowEls.forEach((el, i) => {
    if (_rowKey[i] === 'empty') return;
    _rowKey[i] = 'empty';
    el.className = 'rel-row empty'; el.innerHTML = '';
  });
}

// ── Footer clock ──────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('ftr-time').textContent = fmtTime(new Date());
}
tickClock();
setInterval(tickClock, 10000);

function updateLastLap(d) {
  const playerIdx = d.playerCarIdx;
  const lapData   = d.lapData || [];
  const ld = lapData.find(l => l.carIdx === playerIdx);
  const el = document.getElementById('ftr-lastlap');
  if (ld && ld.lastLap && ld.lastLap > 0) {
    el.textContent = `Last Lap: ${ld.lastLap.toFixed(3)}`;
  } else {
    el.textContent = '';
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────
let ws = null;
const connEl = document.getElementById('connecting');

function handleMessage(data) { try { const _d = JSON.parse(data); if (_d.reset === true) { handleReset(); return; } latestData = _d; updateVisibility(latestData); render(latestData); updateLastLap(latestData); } catch(e) {} }

let _reconnectCount = 0;
function connect() {
  // Only show 'waiting' overlay after multiple failed reconnects
  ws = new WebSocket(WS_URL);
  ws.onopen    = () => { connEl.classList.add('hidden'); _reconnectCount = 0; };
  ws.onmessage = (evt) => handleMessage(evt.data);
  ws.onclose   = () => { _reconnectCount++; if (_reconnectCount >= 3) connEl?.classList.remove('hidden'); setTimeout(connect, 2000); };
  ws.onerror   = () => ws.close();
}

// Accept postMessage for layout editor preview — registered once at top level
window.addEventListener('message', e => {
  if (typeof e.data === 'string') {
    if (connEl) { connEl.classList.add('hidden'); connEl.style.display = 'none'; }
    handleMessage(e.data);
  }
});

connect();
</script>
