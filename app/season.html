<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*">
<title>Season Manager</title>
<style>
:root { --bg:#0c0e12; --card:#141821; --card2:#181d28; --border:#222834; --border2:#2c3443; --text:#e8ebf2; --dim:#8b94a7; --accent:#e8c84a; --green:#2ecc71; --red:#e74c3c; --blue:#5dade2; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 'Segoe UI', Arial, sans-serif; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: #1b212d; border: 1px solid var(--border2); border-radius: 6px; font-weight: 600; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: #3a4457; background: #232b3a; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #1d3a2a; border-color: #2c6b46; } button.danger { color: #ff8479; }
input, select, textarea { background: #0b0d11; border: 1px solid var(--border2); border-radius: 4px; padding: 6px 8px; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
header h1 { margin: 0; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; background: #1a1e26; border: 1px solid var(--border2); font-size: 12px; color: var(--dim); }
.chip.ok { color: var(--green); border-color: #1e4630; } .chip.live { color: #ff6b61; border-color: #5a2320; } .chip.warn { color: var(--accent); border-color: #4d4220; }
.spacer { flex: 1; }
#main { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); padding: 12px; overflow: auto; background: #0c0e12; }
section { padding: 14px 18px; overflow: auto; min-width: 0; }
.s-item { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer; }
.s-item.sel { border-color: #3a4150; background: var(--card2); }
.s-item .n { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.s-item .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; background: #2a2d35; color: var(--dim); }
.tag.active { background: #1d3a2a; color: var(--green); } .tag.chase { background: var(--accent); color: #111; }
.box { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
.box h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--dim); }
.tab.sel { color: var(--text); border-color: var(--accent); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 6px 8px; border-bottom: 1px solid var(--border2); white-space: nowrap; position: sticky; top: 0; background: var(--bg); }
td { padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr.chase td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.out td { opacity: .6; }
tr.cut td { padding: 2px 8px; background: rgba(232,200,74,.08); color: var(--accent); font-size: 11px; letter-spacing: .12em; text-align: center; border-top: 1px dashed var(--accent); border-bottom: 1px dashed var(--accent); }
td.r, th.r { text-align: right; } td.b { font-weight: 700; }
.up { color: var(--green); } .down { color: var(--red); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.row label { color: var(--dim); min-width: 130px; }
.muted { color: var(--dim); } .empty { padding: 30px; text-align: center; color: var(--dim); }
textarea.json { width: 100%; height: 420px; font: 12px/1.45 Consolas, monospace; white-space: pre; }
.banner { background: #2a2410; border: 1px solid #5a4a18; color: var(--accent); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
#toast { position: fixed; right: 16px; bottom: 16px; background: #1d3a2a; border: 1px solid #2c6b46; padding: 10px 14px; border-radius: 6px; max-width: 420px; display: none; z-index: 5; }
#toast.err { background: #3a1d1d; border-color: #6b2c2c; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; }
code { background: #0b0d11; border: 1px solid var(--border2); padding: 1px 6px; border-radius: 3px; user-select: all; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏆 Season Manager</h1>
    <button id="btn-season-generator" style="display:none" title="Open the NR Season Generator companion">Schedule Generator</button>
    <span class="chip" id="chip-bridge">● Bridge</span>
    <span class="chip" id="chip-tracker">Tracker idle</span>
    <span class="spacer"></span>
    <button id="btn-arm" title="A race counts for the active season only when you activate it, before or during the race. One race per activation.">Count this race</button>
    <label class="chip" style="cursor:pointer"><input type="checkbox" id="chk-enabled" checked> Track races automatically</label>
  </header>
  <div id="main">
    <aside>
      <div class="box">
        <h3>New season</h3>
        <div class="row"><input id="new-name" placeholder="Season name" style="flex:1"></div>
        <div class="row"><select id="new-series" style="flex:1"></select></div>
        <div class="row"><select id="new-system" style="flex:1" title="The official points system the season is scored with (it can be changed later in Points rules)"></select></div>
        <div class="row"><select id="new-link" style="flex:1" title="When you switch to this overlay series in All In One NR2003, this season becomes the active one"></select><button class="primary" id="btn-create">Create</button></div>
        <div class="muted" id="new-hint" style="font-size:12px"></div>
      </div>
      <div id="season-list"></div>
    </aside>
    <section id="content"><div class="empty">Create a season on the left to begin.</div></section>
  </div>
</div>
<div id="toast"></div>

<script>
const api = window.shl.season;
const extmods = window.shl.extmods;
const qs = new URLSearchParams(location.search);
const PORT = qs.get('port') || 8769;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let seasons = [], activeId = null, viewId = null, state = null, tab = 'standings', presets = [], showLive = true, systems = [], lastStatus = null;
let openRace = null, raceCache = {}, rulesDraft = null, overlaySeries = [];

$('btn-season-generator').addEventListener('click', async () => {
  const r = await extmods.launch('seasonGenerator');
  if (!r || !r.ok) toast((r && r.error) || 'Could not open the schedule generator.', true);
  else toast('NR Season Generator opened. Its season.ini output is used by NR2003.');
});

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, err ? 7000 : 4500);
}
async function call(p, okMsg) {
  const r = await p;
  if (r && r.ok === false && !r.canceled) { toast(r.error || 'Failed', true); return r; }
  if (okMsg && r && r.ok !== false) toast(okMsg);
  return r;
}

// ── data ─────────────────────────────────────────────────────────────────────
async function loadSeasons() {
  const r = await api.list();
  seasons = r.seasons; activeId = r.activeId;
  if (!viewId || !seasons.find(s => s.id === viewId)) viewId = activeId || (seasons[0] && seasons[0].id) || null;
  renderSeasonList();
}
async function loadState() {
  if (!viewId) { state = null; render(); return; }
  state = await api.getState(viewId);
  render();
}
async function refresh() { await loadSeasons(); await loadState(); }

function connectEvents() {
  try {
    const es = new EventSource(`http://127.0.0.1:${PORT}/season/events`);
    es.addEventListener('state', e => {
      let s; try { s = JSON.parse(e.data); } catch (_) { return; }
      paintStatus(s);
      if (viewId && s.season && s.season.id === viewId) {
        const raceCountChanged = !state || state.races.length !== s.races.length;
        state = s;
        // Live frames arrive several times a second: only the standings view is
        // redrawn for them. Other tabs hold forms (rules JSON, race editor) that a
        // redraw would wipe, so they refresh only when the race list changes.
        if (tab === 'standings' || raceCountChanged) render(true);
      }
      if (s.season && s.season.id !== (activeId || null)) loadSeasons();
    });
    es.addEventListener('toast', e => { try { const t = JSON.parse(e.data); toast(t.text || t.type, t.type === 'race-pending'); loadSeasons(); } catch (_) {} });
  } catch (_) {}
}

function paintStatus(s) {
  const b = $('chip-bridge'); b.textContent = s.bridge ? '● Bridge connected' : '● Bridge not connected'; b.className = 'chip ' + (s.bridge ? 'ok' : '');
  const t = $('chip-tracker'); const tr = s.tracker || {};
  if (tr.phase === 'racing') { t.textContent = `RACING — lap ${tr.lap}/${tr.lapsTotal || '?'} — ${tr.track}`; t.className = 'chip live'; }
  else if (tr.phase === 'finished') { t.textContent = 'Race finished — waiting for official results'; t.className = 'chip warn'; }
  else if (tr.phase === 'committed') { t.textContent = 'Race scored'; t.className = 'chip ok'; }
  else if (tr.phase === 'waiting') { t.textContent = 'In race session — waiting for green'; t.className = 'chip warn'; }
  else { t.textContent = s.enabled ? 'Waiting for a race' : 'Tracking paused'; t.className = 'chip'; }
  $('chk-enabled').checked = s.enabled;
  lastStatus = s;
  const arm = $('btn-arm');
  arm.style.display = s.requireArm ? '' : 'none';
  arm.textContent = s.armed ? '✔ This race counts — cancel' : (tr.phase === 'racing' ? 'Count this race' : 'Count the next race');
  arm.className = s.armed ? 'primary' : '';
}

// ── rendering ────────────────────────────────────────────────────────────────
function renderSeasonList() {
  $('season-list').innerHTML = seasons.map(s => `
    <div class="s-item ${s.id === viewId ? 'sel' : ''}" data-id="${esc(s.id)}">
      <div class="n"><span>${esc(s.name)}</span>${s.id === activeId ? '<span class="tag active">ACTIVE</span>' : ''}</div>
      <div class="m">${esc((presets.find(p => p.id === s.series) || {}).name || s.series)}</div>
      <div class="m">Race ${s.racesRun} of ${s.totalRaces} · ${esc(s.phase)}${s.leader ? ' · ' + esc(s.leader) : ''}</div>
    </div>`).join('') || '<div class="muted">No seasons yet.</div>';
  document.querySelectorAll('.s-item').forEach(el => el.onclick = async () => { viewId = el.dataset.id; openRace = null; rulesDraft = null; renderSeasonList(); await loadState(); });
}

function render(keepScroll) {
  const c = $('content');
  const scrollTop = keepScroll ? c.scrollTop : 0;
  if (!state || !state.season) { c.innerHTML = '<div class="empty">Create a season on the left to begin.</div>'; return; }
  const isActive = state.season.id === activeId;
  const tabs = [['standings', 'Standings'], ['stats', 'Stats'], ['champs', 'Championships'], ['races', 'Races'], ['schedule', 'Schedule'], ['rivals', 'Rivals'], ['career', 'Career'], ['rules', 'Points rules'], ['setup', 'Setup & import']];
  let h = '';
  if (state.pending) h += `<div class="banner">⚠ ${state.pending} finished race(s) couldn't be scored automatically. Open <b>Setup &amp; import</b> to assign them to a season.</div>`;
  h += `<div class="row" style="margin-top:0"><h2 style="margin:0;font-size:20px">${esc(state.season.name)}</h2>` +
    (isActive ? '<span class="tag active">ACTIVE — races are scored into this season</span>' : '<button class="primary" id="btn-activate">Make active</button>') +
    `<span class="spacer"></span><button id="btn-rename">Rename</button><button class="danger" id="btn-delete">Delete…</button></div>`;
  h += '<div class="tabs">' + tabs.map(([k, l]) => `<div class="tab ${tab === k ? 'sel' : ''}" data-tab="${k}">${l}</div>`).join('') + '</div>';
  if (isActive && state.requireArm && !state.armed) h += `<div class="banner">Races count for this season only when you activate them: press <b>Count this race</b> (top right, or on the main window's Season card) before or during a race. A race that wasn't activated is kept under Setup &amp; import → Unassigned races.</div>`;
  h += tab === 'standings' ? tabStandings() : tab === 'stats' ? tabStats() : tab === 'champs' ? tabChamps() : tab === 'races' ? tabRaces() : tab === 'schedule' ? tabSchedule() : tab === 'rivals' ? tabRivals() : tab === 'career' ? tabCareer() : tab === 'rules' ? tabRules() : tabSetup();
  c.innerHTML = h;
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => { tab = el.dataset.tab; render(); if (tab === 'rules') loadRules(); if (tab === 'setup') loadPending(); if (tab === 'schedule') loadSchedule(); if (tab === 'career') loadCareer(); });
  $('btn-activate') && ($('btn-activate').onclick = async () => { await api.setActive(state.season.id); await refresh(); });
  $('btn-rename').onclick = async () => { const n = prompt('Season name', state.season.name); if (n && n.trim()) { await call(api.rename({ id: state.season.id, name: n.trim() })); await refresh(); } };
  $('btn-delete').onclick = async () => { if (confirm(`Delete "${state.season.name}" and all its races?\n(A backup copy is kept in the season data folder.)`)) { await api.delete(state.season.id); viewId = null; await refresh(); } };
  bindTab();
  if (keepScroll) c.scrollTop = scrollTop;
}

function tabStandings() {
  const st = state.standings;
  if (!st) return '<div class="empty">No data.</div>';
  const live = state.live && state.live.rows && state.live.rows.length && state.season.id === activeId;
  const useLive = live && showLive;
  const rows = useLive ? state.live.rows : st.rows;
  const phaseTxt = st.phase === 'complete' ? 'Season complete' : st.phase === 'chase' && st.chase ? `The Chase — ${st.racesRun - st.regularRaces} of ${st.chaseRaces} Chase races run` : st.phase === 'chase' ? 'Regular season complete — Chase seeds on next race' : `Regular season — ${st.racesRun} of ${st.regularRaces} races run`;
  let h = `<div class="row"><b>${esc(phaseTxt)}</b>` +
    (st.cutPoints != null ? `<span class="muted">· Chase cut line (P${st.chaseField}): ${st.cutPoints} pts</span>` : '') +
    (st.champion ? `<span class="tag chase">CHAMPION: ${esc(st.champion.name)}</span>` : '') +
    '<span class="spacer"></span>' +
    (live ? `<label class="chip live" style="cursor:pointer"><input type="checkbox" id="chk-live" ${showLive ? 'checked' : ''}> Live projection — ${esc(state.live.track)} lap ${state.live.lap}/${state.live.lapsTotal || '?'}</label>` : '') +
    '<button id="btn-export">Export HTML…</button></div>';
  if (!rows.length) return h + '<div class="empty">No races scored yet. Finish a race in NR2003 (or import AutoStages results under Setup &amp; import).</div>';
  const cutAfter = (!st.chase && st.phase === 'regular' && st.chaseRaces) ? st.chaseField : 0;
  h += '<table><thead><tr><th>Pos</th><th></th><th>#</th><th>Driver</th><th class="r">Points</th><th class="r">' + (useLive ? 'This race' : 'Behind') + '</th><th class="r">Wins</th><th class="r">Stage W</th><th class="r">Top 5</th><th class="r">Top 10</th><th class="r">Laps led</th><th class="r">Fast laps</th><th class="r">AFP</th><th class="r">GFP</th><th class="r">QP</th></tr></thead><tbody>';
  rows.forEach(r => {
    const d = useLive ? (r.liveDelta || 0) : (r.delta || 0);
    const cls = (st.chase || st.phase === 'complete') ? (r.inChase ? (r.alive === false ? 'out' : 'chase') : (r.inChase === false ? 'out' : '')) : '';
    h += `<tr class="${cls}"><td class="b">${r.rank}</td><td class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '▲' + d : d < 0 ? '▼' + (-d) : ''}</td><td>${esc(r.number)}</td><td class="b">${esc(r.name)}</td>` +
      `<td class="r b">${r.points}</td><td class="r muted">${useLive ? (r.racePts ? '+' + r.racePts : '') : (r.rank === 1 ? '—' : r.behind)}</td>` +
      `<td class="r">${r.wins}</td><td class="r">${r.stageWins}</td><td class="r">${r.top5s}</td><td class="r">${r.top10s}</td><td class="r">${r.lapsLed}</td><td class="r">${r.fastestLaps}</td><td class="r">${r.afp || ''}</td><td class="r">${r.gfp}</td><td class="r">${r.qp}</td></tr>`;
    if (cutAfter && r.rank === cutAfter) h += '<tr class="cut"><td colspan="15">▼ CHASE CUT LINE ▼</td></tr>';
  });
  h += '</tbody></table><p class="muted" style="font-size:12px">AFP = average finishing position. GFP/QP (green-flag / quality passes) are estimated from live telemetry and can differ slightly from the sim\'s own view.</p>';
  return h;
}

// every driver's season statistics (the standings order)
function tabStats() {
  const st = state.standings;
  if (!st || !st.rows.length) return '<div class="empty">No races scored yet.</div>';
  const v = (x) => (x == null || x === '' ? '<span class="muted">–</span>' : x);
  const cols = [['Races', r => r.races], ['Wins', r => r.wins], ['Win %', r => r.winPct + '%'], ['Poles', r => r.poles], ['Top 5', r => r.top5s], ['Top 10', r => r.top10s], ['Top 15', r => r.top15s], ['Top 20', r => r.top20s],
    ['Avg start', r => r.avgStart], ['Avg run', r => r.avgRun], ['Avg finish', r => r.afp || null], ['Best', r => r.bestFinish || null], ['Worst', r => r.worstFinish || null], ['Pos +/-', r => r.gained == null ? null : (r.gained > 0 ? '+' + r.gained : r.gained)],
    ['Laps', r => r.lapsCompleted || null], ['Led', r => r.lapsLed], ['Races led', r => r.racesLed], ['Most led', r => r.mostLed], ['Lead-lap', r => r.leadLap], ['DNF', r => r.dnfs],
    ['Stage W', r => r.stageWins], ['Stage top 10', r => r.stageTop10s], ['Fast laps', r => r.fastestLaps], ['Bonus pts', r => r.bonusPts], ['Pts / race', r => r.ptsPerRace], ['GFP', r => r.gfp], ['QP', r => r.qp],
    ['Incidents', r => (r.damage == null ? null : r.incidents)], ['Contacts', r => r.contacts], ['Damage', r => (r.damage == null ? null : r.damage.toFixed(2))], ['Cautions caused', r => r.cautionsCaused]];
  if (st.rows.some(r => r.playoffPoints != null)) cols.unshift(['Playoff pts', r => r.playoffPoints]);
  if (st.rows.some(r => r.dropped)) cols.push(['Dropped', r => r.dropped || null]);
  let h = '<div class="tablewrap" style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>#</th><th>Driver</th><th class="r">Points</th>' + cols.map(c => `<th class="r">${c[0]}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of st.rows) h += `<tr><td class="b">${r.rank}</td><td>${esc(r.number)}</td><td class="b">${esc(r.name)}</td><td class="r b">${r.points}</td>` + cols.map(c => `<td class="r">${v(c[1](r))}</td>`).join('') + '</tr>';
  h += '</tbody></table></div><p class="muted" style="font-size:12px">Avg start / avg run (average running position, every lap) / laps / lead-lap / DNF come from races All In One NR2003 tracked: imported AutoStages races have no such data. Pos +/- = starting position minus finishing position, summed. Lead-lap = finishes on the lead lap.</p>';
  return h;
}

// the other championships: owners, manufacturers, teams (constructors), rookies
function tabChamps() {
  const st = state.standings;
  if (!st || !st.racesRun) return '<div class="empty">No races scored yet.</div>';
  const tbl = (title, list, note, cols) => {
    if (!list || !list.length) return `<div class="box"><h3>${title}</h3><div class="muted">${note}</div></div>`;
    return `<div class="box"><h3>${title}</h3><table><thead><tr><th>Pos</th><th>${cols[0]}</th><th class="r">Points</th><th class="r">Behind</th><th class="r">Wins</th><th class="r">Top 5</th><th class="r">Top 10</th><th>${cols[1]}</th></tr></thead><tbody>` +
      list.slice(0, 20).map(x => `<tr><td class="b">${x.rank}</td><td class="b">${esc(x.name)}</td><td class="r b">${x.points}</td><td class="r muted">${x.rank === 1 ? '—' : x.behind}</td><td class="r">${x.wins}</td><td class="r">${x.top5s}</td><td class="r">${x.top10s}</td><td class="muted">${esc((x.drivers || []).slice(0, 4).join(', '))}${x.number ? '#' + esc(x.number) : ''}</td></tr>`).join('') + '</tbody></table></div>';
  };
  const rook = (st.rookies || []).map(r => Object.assign({}, r, { drivers: ['#' + r.number] }));
  return tbl('Owners (by car number)', st.owners, 'No car numbers in the results.', ['Car', 'Drivers']) +
    tbl('Manufacturers', st.makes, 'No manufacturer known for these races: All In One NR2003 reads each car\'s make from its .car file during a counted race.', ['Make', 'Drivers']) +
    tbl('Teams / constructors', st.teams, 'No team known for these races: All In One NR2003 reads each car\'s team from its .car file during a counted race.', ['Team', 'Drivers']) +
    tbl('Rookie of the year', rook, 'No rookies: mark them in the series art folder\'s rookies.json (car number: true).', ['Driver', 'Car']) +
    '<p class="muted" style="font-size:12px">Manufacturers: each make\'s best-finishing car scores its finish points. Teams: the points of the team\'s cars added up (F1 constructors). Owners: every point the car scored, whoever drove it.</p>';
}

// ── the schedule ──────────────────────────────────────────────────────────────
let schedTracks = [], schedRefs = [], schedNrSeries = [], schedDraft = null, schedBuild = { style: 'reference', ref: '', count: 36, types: ['short', 'intermediate', 'superspeedway', 'road'], repeat: false };
async function loadSchedule() {
  try { [schedTracks, schedRefs, schedNrSeries] = await Promise.all([api.calTracks(), api.calReferences(), api.calNrSeries()]); } catch (_) { /* no NR2003 folder */ }
  if (!schedBuild.ref && schedRefs[0]) schedBuild.ref = schedRefs[0].id;
  if (tab === 'schedule') render();
}
function tabSchedule() {
  const sc = state.schedule, ev = schedDraft || (sc ? sc.events : null);
  const done = state.standings ? state.standings.racesRun : 0;
  const trackOpts = (sel) => '<option value="">— pick a track —</option>' + schedTracks.map(t => `<option value="${esc(t.dir)}" ${t.dir === sel ? 'selected' : ''}>${esc(t.name)} (${t.type}, ${t.miles} mi)</option>`).join('');

function raceDetail(d, meta) {

function finishPtsOf(r, p) {
  if (Array.isArray(r.finish.table)) return p <= r.finish.table.length ? r.finish.table[p - 1] : (r.finish.beyond || 0);
  return p === 1 ? r.finish.win : Math.max(r.finish.floor, r.finish.second - (p - 2) * r.finish.step);
}

  const list = await api.pendingList();
  if (!list.length) { el.textContent = 'None — every finished race has been scored.'; return; }
  el.innerHTML = list.map(p => `<div class="row"><b>${esc(p.track)}</b><span class="muted">${p.cars} cars · winner ${esc(p.winner || '?')} · ${esc(String(p.savedAt).slice(0, 16).replace('T', ' '))} · ${esc(p.why)}</span>` +
    `<button class="primary btn-assign" data-f="${esc(p.file)}">Add to “${esc(state.season.name)}”</button><button class="danger btn-dismiss" data-f="${esc(p.file)}">Discard</button></div>`).join('');
  document.querySelectorAll('.btn-assign').forEach(b => b.onclick = async () => { const r = await call(api.pendingAssign({ file: b.dataset.f, id: state.season.id }), 'Race added'); await refresh(); loadPending(); });
  document.querySelectorAll('.btn-dismiss').forEach(b => b.onclick = async () => { if (confirm('Discard this race result?')) { await api.pendingDismiss(b.dataset.f); await refresh(); loadPending(); } });
}

function bindTab() {
  if (tab === 'standings') {
    $('chk-live') && ($('chk-live').onchange = e => { showLive = e.target.checked; render(); });
    $('btn-export') && ($('btn-export').onclick = () => call(api.exportHtml(state.season.id), 'Exported — opening folder'));
  }
  if (tab === 'races') {
    document.querySelectorAll('.race-row').forEach(tr => tr.onclick = async ev => {
      if (ev.target.closest('button')) return;
      const id = tr.dataset.id;
      if (openRace === id) { openRace = null; render(); return; }
      const r = await api.getRace({ id: state.season.id, raceId: id });
      if (r.ok) { raceCache[id] = r; openRace = id; render(); }
    });
    document.querySelectorAll('.btn-rm').forEach(b => b.onclick = async () => {
      if (!confirm('Remove this race and its points from the season?\n(A backup of the season is kept.)')) return;
      await call(api.removeRace({ id: state.season.id, raceId: b.dataset.id }), 'Race removed'); openRace = null; await refresh();
    });
    $('btn-save-mult') && ($('btn-save-mult').onclick = async () => {
      const v = $('sel-mult').value;
      await call(api.updateRace({ id: state.season.id, raceId: openRace, patch: { pointsMultiplier: v === '' ? null : Number(v) } }), 'Saved — season recomputed');
      raceCache = {}; const r = await api.getRace({ id: state.season.id, raceId: openRace }); if (r.ok) raceCache[openRace] = r; await refresh();
    });
    $('btn-save-fl') && ($('btn-save-fl').onclick = async () => {
      await call(api.updateRace({ id: state.season.id, raceId: openRace, patch: { fastestKey: $('sel-fl').value || null } }), 'Saved');
      raceCache = {}; const r = await api.getRace({ id: state.season.id, raceId: openRace }); if (r.ok) raceCache[openRace] = r; await refresh();
    });
  }
  if (tab === 'schedule') {
    const keepBuild = () => {
      const st = $('sc-style'); if (st) schedBuild.style = st.value;
      if ($('sc-ref')) schedBuild.ref = $('sc-ref').value;
      if ($('sc-count')) schedBuild.count = Number($('sc-count').value) || 36;
      if (document.querySelector('.sc-type')) schedBuild.types = [...document.querySelectorAll('.sc-type')].filter(c => c.checked).map(c => c.value);
      if ($('sc-repeat')) schedBuild.repeat = $('sc-repeat').checked;
    };
    $('sc-style').onchange = () => { keepBuild(); render(); };
    $('sc-build').onclick = async () => {
      keepBuild();
      const r = await call(api.calBuild({ style: schedBuild.style, ref: schedBuild.ref, count: schedBuild.count, types: schedBuild.types, repeat: schedBuild.repeat }));
      if (r && r.ok) { schedDraft = r.events; schedDraft.name = r.name; const miss = r.events.filter(e => !e.track).length; toast(`${r.events.length} races${miss ? ' - ' + miss + ' need a track' : ''}. Save to keep it.`, !!miss); render(); }
    };
    document.querySelectorAll('.sc-f').forEach(el => el.onchange = () => {
      if (!schedDraft) { schedDraft = JSON.parse(JSON.stringify(state.schedule.events)); schedDraft.name = state.schedule.name; }
      const e = schedDraft[Number(el.dataset.i)], k = el.dataset.k;
      if (k === 'stages') e.stages = el.value.split(/[,\s/]+/).map(Number).filter(x => x > 0);
      else if (k === 'charters') e.charters = el.value.split(/[,;\s/]+/).map(x => x.trim()).filter(Boolean);
      else if (k === 'laps' || k === 'day' || k === 'month') e[k] = Number(el.value) || 1;
      else if (k === 'track') { e.track = el.value; const t = schedTracks.find(x => x.dir === el.value); e.trackName = t ? t.name : ''; }
      else e[k] = el.value;
      render();
    });
    $('sc-save') && ($('sc-save').onclick = async () => {
      const r = await call(api.calSet({ id: state.season.id, schedule: { events: schedDraft, name: schedDraft.name || (state.schedule && state.schedule.name) || '', series: $('sc-series') ? $('sc-series').value : '', autoArm: $('sc-autoarm') ? $('sc-autoarm').checked : true } }), 'Schedule saved');
      if (r && r.ok) { schedDraft = null; await refresh(); }
    });
    $('sc-discard') && ($('sc-discard').onclick = () => { schedDraft = null; render(); });
    const saveEntry = async () => { const r = await call(api.setEntry({ id: state.season.id, entry: { lockTop: $('en-top').checked, topN: Number($('en-topn').value) || 35, charters: $('en-charters').value } }), 'Guaranteed starters saved'); if (r && r.ok) await refresh(); };
    $('en-save') && ($('en-save').onclick = saveEntry);
    $('en-top') && ($('en-top').onchange = saveEntry);
    $('en-topn') && ($('en-topn').onchange = saveEntry);
    $('sc-autoarm') && ($('sc-autoarm').onchange = async e => { if (state.schedule) { await call(api.calSet({ id: state.season.id, schedule: Object.assign({}, state.schedule, { autoArm: e.target.checked }) })); await refresh(); } });
    $('sc-setup') && ($('sc-setup').onclick = async () => { const r = await call(api.setupNext($('sc-dist').checked)); if (r && r.ok !== false) toast('Set up: stages' + (r.distance ? (r.distance.ok ? ' and race length' : ' (race length: ' + r.distance.error + ')') : '')); });
    $('sc-export') && ($('sc-export').onclick = async () => { if (schedDraft) return toast('Save the schedule first.', true); const s = $('sc-series').value; if (!confirm(`Write this schedule to NR2003's ${s} season file? (the game's own is kept as a backup)`)) return; const r = await call(api.calExport({ id: state.season.id, series: s })); if (r && r.ok) toast('Written: ' + r.file); });
    $('sc-import') && ($('sc-import').onclick = async () => { const s = $('sc-series').value; if (state.schedule && !confirm('Replace this season\'s schedule with ' + s + '\'s season file?')) return; const r = await call(api.calImport({ id: state.season.id, series: s }), 'Schedule read from ' + s); if (r && r.ok) { schedDraft = null; await refresh(); } });
    $('sc-clear') && ($('sc-clear').onclick = async () => { if (!confirm('Remove this season\'s schedule?')) return; await call(api.calSet({ id: state.season.id, schedule: null })); schedDraft = null; await refresh(); });
  }
  if (tab === 'career') {
    $('h2h-go') && ($('h2h-go').onclick = async () => { h2hData = await api.headToHead({ a: $('h2h-a').value, b: $('h2h-b').value }); render(); });
    $('al-go') && ($('al-go').onclick = async () => {
      const f = $('al-from').value, t = $('al-to').value;
      if (!confirm(`Count "${f}" as "${t}" in every season?`)) return;
      const r = await call(api.aliasSet({ from: f, to: t, name: t }), 'Merged'); if (r && r.ok) { await refresh(); await loadCareer(); }
    });
    document.querySelectorAll('.al-rm').forEach(b => b.onclick = async () => { await call(api.aliasRemove(b.dataset.f), 'Merge undone'); await refresh(); await loadCareer(); });
  }
  if (tab === 'rivals') {
    document.querySelectorAll('.btn-rival-rm').forEach(b => b.onclick = async () => { await call(api.rivalRemove({ id: state.season.id, key: b.dataset.k }), 'Rivalry removed'); await refresh(); });
    $('btn-rivals-clear') && ($('btn-rivals-clear').onclick = async () => { if (confirm('Clear every rivalry of this season?')) { await call(api.rivalsClear(state.season.id), 'Rivalries cleared'); await refresh(); } });
  }
  if (tab === 'rules') {
    loadRules();
    $('btn-system').onclick = async () => {
      const id = $('sel-system').value, s = systems.find(x => x.id === id);
      if (!confirm(`Score "${state.season.name}" with ${s ? s.name : id}? Every race is re-scored (your edits to the ruleset JSON are replaced; a backup is kept).`)) return;
      await call(api.setSystem({ id: state.season.id, system: id }), 'Points system changed — season recomputed'); await refresh(); loadRules();
    };
    $('btn-rules-save').onclick = async () => {
      let rs; try { rs = JSON.parse($('rules-json').value); } catch (e) { toast('Invalid JSON: ' + e.message, true); return; }
      await call(api.setRuleset({ id: state.season.id, ruleset: rs }), 'Ruleset saved — season recomputed'); await refresh(); loadRules();
    };
    $('btn-rules-reset').onclick = async () => {
      if (!confirm('Replace this season\'s ruleset with the series\' current points system?')) return;
      const d = await api.defaultRuleset(state.season.series);
      if (d.ok) { await call(api.setRuleset({ id: state.season.id, ruleset: d.ruleset }), 'Defaults restored'); await refresh(); loadRules(); }
    };
  }
  if (tab === 'setup') {
    loadPending();
    $('opt-link').onchange = async e => { await api.setLinked({ id: state.season.id, linkedSeries: e.target.value }); toast('Link saved'); await loadSeasons(); };
    $('opt-requirearm').onchange = async e => { await api.setOptions({ requireArm: e.target.checked }); toast(e.target.checked ? 'Races count only when you activate them' : 'Every finished race counts'); await refresh(); };
    $('opt-autoexport').onchange = e => api.setOptions({ autoExport: e.target.checked });
    $('opt-passes').onchange = e => api.setOptions({ trackPasses: e.target.checked });
    $('opt-record').onchange = e => api.setOptions({ recordFrames: e.target.checked });
    $('btn-exportdir').onclick = async () => { const r = await api.chooseExportDir(); if (r.ok) { toast('Export folder set'); await refresh(); } };
    $('btn-datafolder').onclick = () => api.openDataFolder();
    $('btn-copyobs').onclick = () => { const t = [...document.querySelectorAll('code')].find(c => c.textContent.startsWith('http')); navigator.clipboard.writeText(t.textContent); toast('OBS URL copied'); };
    $('btn-imp-html').onclick = async () => {
      const r = await api.importHtml(state.season.id);
      if (r.canceled) return;
      if (r.errors && r.errors.length) toast(`Imported ${r.imported}. Problems: ${r.errors.join('; ')}`, true); else toast(`Imported ${r.imported} race(s)`);
      await refresh();
    };
    $('btn-imp-xml').onclick = async () => { const r = await call(api.importXml(state.season.id)); if (r && r.ok) toast(`Imported ${r.drivers} drivers, ${r.racesRun} race(s) of totals`); await refresh(); };
  }
}

// ── global controls ──────────────────────────────────────────────────────────
$('chk-enabled').onchange = e => api.setOptions({ enabled: e.target.checked });
$('btn-arm').onclick = async () => {
  const on = !(lastStatus && lastStatus.armed);
  const r = await call(api.arm(on));
  if (r && r.ok) { try { const s = await api.getState(); paintStatus(s); } catch (_) {} await loadState(); }
};
$('btn-create').onclick = async () => {
  const name = $('new-name').value.trim() || ($('new-series').selectedOptions[0].textContent + ' ' + new Date().getFullYear());
  const r = await call(api.create({ name, series: $('new-series').value, linkedSeries: $('new-link').value, system: $('new-system').value }), 'Season created');
  if (r && r.ok) { $('new-name').value = ''; viewId = r.id; await refresh(); }
};
$('new-series').onchange = () => { fillSystems(); updateHint(); };
$('new-system').onchange = updateHint;
function familyOf(seriesId) { const p = presets.find(x => x.id === seriesId); return (p && p.family) || 'nascar'; }
function fillSystems() {
  const fam = familyOf($('new-series').value);
  const list = systems.filter(s => s.family === fam);
  const def = fam === 'nascar' ? 'nascar-2026' : fam === 'indycar' ? 'indycar-2023' : 'f1-2025';
  $('new-system').innerHTML = list.map(s => `<option value="${esc(s.id)}" ${s.id === def ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}
function updateHint() {
  const p = presets.find(x => x.id === $('new-series').value);
  const s = systems.find(x => x.id === $('new-system').value);
  const chase = p && p.chaseRaces && s && s.id === 'nascar-2026' ? ` + ${p.chaseRaces}-race Chase (top ${p.chaseField})` : '';
  $('new-hint').textContent = (p ? `${p.regularSeasonRaces} races${chase}. ` : '') + (s ? s.note : '');
}

(async function init() {
  presets = await api.seriesPresets();
  systems = await api.systems();
  $('new-series').innerHTML = presets.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  fillSystems();
  try {
    overlaySeries = (await window.shl.getSeries()) || [];
    const cfg = await window.shl.getConfig();
    $('new-link').innerHTML = '<option value="">Link to overlay series: none</option>' + overlaySeries.map(s => `<option value="${esc(s.id)}" ${cfg.series === s.id && s.id !== 'default' ? 'selected' : ''}>Link to: ${esc(s.id === 'default' ? s.name : s.id)}</option>`).join('');
  } catch (_) { $('new-link').innerHTML = '<option value="">Link to overlay series: none</option>'; }
  updateHint();
  await refresh();
  connectEvents();
  try { const s = await api.getState(); paintStatus(s); } catch (_) {}
})();
</script>
</body>
</html>
