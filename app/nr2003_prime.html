// ── Build a single row ────────────────────────────────────────────────────
function buildRow(el, entry, displayPos, session, playerCarIdx, leaderBest, lapTracker) {
  if (!entry) { el.innerHTML = ''; el.className = 's-row'; return; }

  const isPlayer = entry.carIdx === playerCarIdx;
  el.className   = 's-row' + (isPlayer ? ' is-player' : '') + chaseCls(entry.number);
  el.dataset.chaseNum = chaseKey(entry.number);

  const isLeader  = displayPos === 1;
  const isPQ      = session === 'practice' || session === 'qualifying' || session === 'testing';
  // bestLap/lastLap live in a separate lapTracker map keyed by carIdx,
  // not directly on the standings entry — see nr2003_racestats.html.
  const entryBest = (lapTracker && lapTracker[entry.carIdx]?.bestLap) || 0;
  const gap       = fmtGap(entry, isLeader, session, leaderBest, entryBest);
  const gapCls    = (isPQ && isLeader) ? 's-gap pq-leader' : 's-gap';
  const numSrc    = numImgSrc(entry.number);
  const name      = displayName(entry);

  const numColor = _driverColors[(entry.number || '').trim()] || '';
  const numBg    = numColor ? `background:${numColor}` : '';
  const numHtml = numSrc
    ? `<div class="s-num-wrap"><div class="s-num-bg" style="${numBg}">
         <img class="s-num-img" src="${numSrc}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';" alt="${entry.number}">
         <span class="s-num-text">${entry.number || ''}</span>
       </div></div>`
    : `<div class="s-num-wrap"><div class="s-num-bg" style="${numBg}"><span class="s-num-text" style="display:block">${entry.number || ''}</span></div></div>`;

  el.innerHTML = `
    <img class="s-chase-div" src="${CHASE_DIVIDER_SRC}" alt="">
    <span class="s-pos">${displayPos}.</span>
    ${numHtml}
    <span class="s-name">${name}</span>
    <span class="${gapCls}">${gap}</span>
  `;
  el.dataset.caridx = entry.carIdx;
}

// ── Bottom-half rotation (11-20, 21-30, ... same cadence as Fox2022) ─────
let _rotGroupIdx = 0;
let _rotTimer    = null;
const BOTTOM_GROUP_SIZE = 10;

function renderBottom(standings, session, playerCarIdx, lapTracker) {
  const rest       = standings.slice(10);
  const groupStart = _rotGroupIdx * BOTTOM_GROUP_SIZE;
  const leaderBest = (lapTracker && lapTracker[standings[0]?.carIdx]?.bestLap) || 0;
  // Once cars start finishing, the top N spots belong to finisher cards —
  // the still-racing field's true position is offset by however many are
  // already locked in, not just its own index within the filtered array.
  const posOffset  = _lockedFinishers.length;
  for (let i = 0; i < BOTTOM_GROUP_SIZE; i++) {
    const rowEl  = document.getElementById(`row-${11 + i}`);
    const entry  = rest[groupStart + i] || null;
    const absPos = entry ? (posOffset + 11 + groupStart + i) : null;
    buildRow(rowEl, entry, absPos, session, playerCarIdx, leaderBest, lapTracker);
  }
}

function startRotation() {
  if (_rotTimer) clearInterval(_rotTimer);
  const rotMs = parseFloat(10) * 1000;
  _rotTimer = setInterval(runRotation, rotMs);
}

function runRotation() {
  if (!_latestData) return;
  if (_ppOn) return;                       // points panel is covering the bottom group
  const src  = getStandings(_latestData);
  const rest = src.slice(10);
  if (rest.length <= BOTTOM_GROUP_SIZE) return;

  const sess     = (_latestData.session || '').toLowerCase();
  const pid      = _latestData.playerCarIdx ?? -1;
  const maxGroup = Math.ceil(rest.length / BOTTOM_GROUP_SIZE);

  const fadeMs    = parseInt(350, 10);
  const slideMs   = parseInt(550, 10);
  const slidePx   = parseInt(16, 10);
  const staggerMs = parseInt(30, 10);

  const rows = [];
  for (let i = 0; i < BOTTOM_GROUP_SIZE; i++) rows.push(document.getElementById(`row-${11 + i}`));

  // Phase 1 — each row fades out individually, staggered top-to-bottom,
  // rather than the whole group fading as one flat block.
  rows.forEach((el, i) => {
    if (!el) return;
    el.style.transition = `opacity ${fadeMs}ms ease ${i * staggerMs}ms`;
    el.style.opacity = '0';
  });

  const fadeTotal = fadeMs + (BOTTOM_GROUP_SIZE - 1) * staggerMs;

  setTimeout(() => {
    // Swap to the next group of 10 while every row is fully transparent
    _rotGroupIdx = (_rotGroupIdx + 1) % maxGroup;
    renderBottom(src, sess, pid, _latestData.lapTracker || {});

    // Phase 2 — snap every row to its entrance pose (above final position,
    // invisible) with no transition, then release into a staggered
    // slide-down + fade-in, again top-to-bottom.
    rows.forEach(el => {
      if (!el) return;
      el.style.transition = 'none';
      el.style.opacity    = '0';
      el.style.transform  = `translateY(-${slidePx}px)`;
    });
    if (rows[0]) void rows[0].offsetWidth; // force reflow so the snap isn't animated

    requestAnimationFrame(() => {
      rows.forEach((el, i) => {
        if (!el) return;
        const delay = i * staggerMs;
        el.style.transition = `opacity ${slideMs}ms ease-out ${delay}ms, transform ${slideMs}ms cubic-bezier(0.22, 1, 0.36, 1) ${delay}ms`;
        el.style.opacity    = '1';
        el.style.transform  = 'translateY(0)';
      });
    });
  }, fadeTotal);
}


// ── Standings source selection ────────────────────────────────────────────
// Priority chain matches Fox2022's getStandings exactly (gridding/pacing/
// cooldown -> plain standings; checkered + computedStandings available ->
// that frozen/bridge-computed array, avoiding the live trkPct-based
// reordering churn raw liveStandings has right at the finish; otherwise
// liveStandings with a standings fallback). Layered on top: our own
// finished-car filter, since Fox2022 has no finisher cards to feed.
// During checkered, still-racing cars (2nd onward, before cooldown) use
// computedStandings rather than raw liveStandings — once the leader has
// taken the checkered, everyone else is just cruising their cooldown lap,
// not actually racing, so trkPct-based live gap interpolation goes
// erratic. computedStandings' unfrozen entries show a neutral placeholder
// instead, which is preferable to an actively-wrong live number; the real
// gap fills in once that car's own official result lands at cooldown.
function getStandings(d) {
  const isPQ  = ['practice', 'qualifying', 'testing'].includes((d.session || '').toLowerCase());
  const state = (d.sessionState || '').toLowerCase();
  const liveEnabled = d.liveStandingsEnabled !== false;

  let raw;
  if (isPQ) {
    raw = d.standings || [];
  } else if (state === 'cool down' || state === 'get in car' || state === 'warmup' || state === 'parade laps') {
    raw = d.standings || [];
  } else if (state === 'checkered' && liveEnabled && Array.isArray(d.computedStandings) && d.computedStandings.length) {
    raw = d.computedStandings;
  } else {
    const live = d.liveStandings || d.standings || [];
    raw = (liveEnabled && live.length) ? live : (d.standings || []);
  }

  // Once cars start finishing under the checkered flag, they move into
  // finisher cards and drop out of the normal running-order rows entirely.
  if (_lockedFinishers.length === 0) return raw;
  return raw.filter(s => !_lockedFinishers.includes(s.carIdx));
}

// ── Position-change tracking + arrow injection ─────────────────────────────
let _prevOrder = [];

function applyArrow(el, gained) {
  const gapEl = el.querySelector('.s-gap');
  if (!gapEl) return;
  const existing = gapEl.querySelector('.s-arrow');
  if (existing) existing.remove();
  const arrow = document.createElement('span');
  arrow.className   = `s-arrow ${gained ? 'gained' : 'lost'}`;
  arrow.textContent = gained ? '▲' : '▼';
  gapEl.prepend(arrow);
  setTimeout(() => arrow.classList.add('fade'), 500);
  setTimeout(() => arrow.remove(), 3000);
}

function renderStandings(standings, session, playerCarIdx, lapTracker) {
  const top10 = standings.slice(0, 10);
  const oldOrder = _prevOrder.slice();
  const newOrder = top10.map(s => s.carIdx);
  const leaderBest = (lapTracker && lapTracker[standings[0]?.carIdx]?.bestLap) || 0;
  // Same offset as renderBottom — the still-racing field's real position
  // starts after however many finisher cards are already locked in.
  const posOffset = _lockedFinishers.length;

  top10.forEach((entry, i) => {
    const el = document.getElementById(`row-${i + 1}`);
    buildRow(el, entry, posOffset + i + 1, session, playerCarIdx, leaderBest, lapTracker);
    if (oldOrder.length > 0) {
      const oldIdx = oldOrder.indexOf(entry.carIdx);
      const newIdx = newOrder.indexOf(entry.carIdx);
      if (oldIdx !== -1 && oldIdx !== newIdx) applyArrow(el, newIdx < oldIdx);
    }
  });
  for (let i = top10.length; i < 10; i++) {
    const el = document.getElementById(`row-${i + 1}`);
    el.innerHTML = ''; el.className = 's-row'; el.dataset.caridx = '';
  }

  _prevOrder = newOrder;

  // Bottom group — same idea as top10: compare each slot's carIdx before
  // and after rebuild. This only fires for shuffles *within* the currently
  // displayed group (e.g. 11-20 reordering amongst themselves); a full
  // group rotation (11-20 -> 21-30) is an entirely different car set, so
  // there's no prior slot to compare against and no arrow fires there —
  // that swap gets its own staggered fade/slide treatment in runRotation().
  const prevBottomOrder = [];
  for (let i = 0; i < BOTTOM_GROUP_SIZE; i++) {
    const el = document.getElementById(`row-${11 + i}`);
    prevBottomOrder.push(el ? parseInt(el.dataset.caridx || '-1') : -1);
  }

  renderBottom(standings, session, playerCarIdx, lapTracker);

  for (let i = 0; i < BOTTOM_GROUP_SIZE; i++) {
    const el = document.getElementById(`row-${11 + i}`);
    if (!el) continue;
    const ci = parseInt(el.dataset.caridx || '-1');
    if (ci < 0) continue;
    const oldIdx = prevBottomOrder.indexOf(ci);
    if (oldIdx === -1 || oldIdx === i) continue;
    applyArrow(el, i < oldIdx);
  }
}

// ── Fast gap update — no DOM rebuild, runs every tick ─────────────────────
function updateGaps(standings, session, lapTracker) {
  const leaderBest = (lapTracker && lapTracker[standings[0]?.carIdx]?.bestLap) || 0;
  const isPQ = session === 'practice' || session === 'qualifying' || session === 'testing';
  // Once any finisher is locked in, the true leader isn't in this filtered
  // array at all anymore — so array index 0 is just whoever's now leading
  // the still-racing pack, never treat them as "the leader" for gap
  // display purposes. Same offset renderStandings/buildRow already use for
  // position numbering, just missing here on the fast per-tick path.
  standings.slice(0, 10).forEach((entry, i) => {
    const el  = document.getElementById(`row-${i + 1}`);
    const gapEl = el?.querySelector('.s-gap');
    if (!gapEl) return;
    const isLeader = _lockedFinishers.length === 0 && i === 0;
    const entryBest = (lapTracker && lapTracker[entry.carIdx]?.bestLap) || 0;
    // Preserve any live arrow span, only touch the trailing text node
    const arrow = gapEl.querySelector('.s-arrow');
    gapEl.textContent = fmtGap(entry, isLeader, session, leaderBest, entryBest);
    gapEl.classList.toggle('pq-leader', isPQ && isLeader);
    if (arrow) gapEl.prepend(arrow);
  });

  const rest       = standings.slice(10);
  const groupStart = _rotGroupIdx * BOTTOM_GROUP_SIZE;
  for (let i = 0; i < BOTTOM_GROUP_SIZE; i++) {
    const el    = document.getElementById(`row-${11 + i}`);
    const entry = rest[groupStart + i];
    const gapEl = el?.querySelector('.s-gap');
    if (!gapEl || !entry) continue;
    const entryBest = (lapTracker && lapTracker[entry.carIdx]?.bestLap) || 0;
    const arrow = gapEl.querySelector('.s-arrow');
    gapEl.textContent = fmtGap(entry, false, session, leaderBest, entryBest);
    gapEl.classList.remove('pq-leader'); // bottom group is never the leader
    if (arrow) gapEl.prepend(arrow);
  }
}

// ── Main data handler ─────────────────────────────────────────────────────
let _latestData = null;
let _lastStandingsKey = '';

// ── Session-change detection ────────────────────────────────────────────
// papytelemapp.h: "sessionCookie will change whenever a session is
// restarted... you must clear any cache." Same pattern as racestats.html —
// otherwise stale rows/track name/rotation state can linger on screen
// after a session transition until fresh data happens to overwrite them.
let _lastSessionCookie = null;

// Bottom portion (body panel + dividers + standings rows) fades out
// whenever there's no standings data yet — leaves just the header
// (sponsor/track-name/lap-stage chrome) visible instead of an empty panel.
function setBottomVisible(v) {
  const opacity = v ? '1' : '0';
  document.getElementById('overlay-body').style.opacity     = opacity;
  document.getElementById('dividers-img').style.opacity     = opacity;
  // Stage results hide the running-order rows independently of the normal
  // no-data visibility toggle (they're still real, live cars — just hidden
  // behind the stage-results cards for the duration of that window). Don't
  // let this unconditional call stomp that back to visible every tick.
  if (!_stageResultsActive) {
    document.getElementById('standings-data').style.opacity = opacity;
  }
  // The 10 individual .fc-divider slices inside #finish-layer are a
  // separate set of elements from the main #dividers-img above — each
  // windows the same dividers.png to its own finisher-card slot for the
  // checkered cascade. They don't inherit the main dividers-img toggle,
  // so without this they'd stay visible even when everything else fades.
  document.getElementById('finish-layer').style.opacity     = opacity;
}

function checkSessionChange(d) {
  const cookie = d.sessionCookie;
  if (cookie == null || cookie === _lastSessionCookie) return;
  _lastSessionCookie = cookie;
  diReset();

  // Reset comparison/cache state so nothing carries over from the old session
  _prevOrder          = [];
  _lastStandingsKey    = '';
  _rotGroupIdx          = 0;
  _lastTrackName        = null;
  _lastLapStageText     = null;
  _driverColors         = {};

  // Blank every row immediately rather than waiting for fresh standings
  for (let i = 1; i <= 20; i++) {
    const el = document.getElementById(`row-${i}`);
    if (el) { el.innerHTML = ''; el.className = 's-row'; el.dataset.caridx = ''; }
  }
  document.getElementById('track-name-text').textContent = '';
  document.getElementById('lapstage-text').innerHTML = '';
  document.getElementById('header-data').classList.remove('flag-caution', 'flag-white', 'flag-checkered', 'flag-stagefinal', 'flag-stagecomplete', 'flag-stageresults');
  document.getElementById('fastestlap-badge').style.display = 'none';
  flReset();
  grHide(true);
  setBottomVisible(false);
  resetFinishers();
  document.querySelectorAll('.fc-slot').forEach(el => el.classList.remove('revealed'));
  _stageResultsActive   = false;
  _stageResultsForStage = -1;
  _stageResultsShownAtLap = -1;
  _stageResultsWinnersRevealed = false;
  _stageResultsHoldExpired = false;
  document.getElementById('standings-data').style.opacity = ''; // let setBottomVisible's own value govern
}

// Every step of a frame runs on its own: if one of them throws (a tracker, the points panel, the driver banner...) the standings,
// lap counter and flags still update. The first error of each kind is written to driverinfo-debug.json (next to config.json) so it can be diagnosed.
const _errSeen = new Set();
function _logErr(where, e) {
  try {
    const k = where + '|' + (e && e.message);
    if (_errSeen.has(k) || _errSeen.size > 25) return;
    _errSeen.add(k); console.error('[prime]', where, e);
    if (window.shl && window.shl.writeDebugDump) window.shl.writeDebugDump({ time: new Date().toISOString(), overlay: 'prime', where, error: String(e && e.message), stack: String(e && e.stack || '').split('\n').slice(0, 6) });
  } catch (_) {}
}
function _safe(where, fn) { try { return fn(); } catch (e) { _logErr(where, e); } }
function handleData(d) {
  _latestData = d;
  _safe('sessionChange', () => checkSessionChange(d));

  if (!_preview) {
    if (!d.atTrack) { document.getElementById('app').style.display = 'none'; if (_diOn) diHide(); if (_gr.on) grHide(true); return; }
    if (VISIBILITY_MODE === 'in_car' && !d.player?.inCar) { document.getElementById('app').style.display = 'none'; return; }
    document.getElementById('app').style.display = '';
  }

  if (d.driverColors) _driverColors = d.driverColors;
  _safe('trackLed', () => trackLed(d));
  _safe('diFeed', () => diFeed(d));
  _safe('startGrid', () => grSync(d));
  if (_ppOn) _safe('points', () => ppRender(d, getStandings(d)));

  // Must run before anything that reads _stageResultsActive this tick
  // (buildLapStageSegments via the lap-text check, and applyFlagState) —
  // otherwise both would be reading last tick's stale value.
  _safe('stageResults', () => checkStageResults(d));

  const trackName = d.trackNameShort || d.track || '';
  if (trackName !== _lastTrackName) {
    _lastTrackName = trackName;
    _safe('trackName', () => layoutTrackName());
  }

  _safe('lapRow', () => {
    const candidateText = buildLapStageSegments(d).map(s => s.text).join('');
    if (candidateText !== _lastLapStageText) layoutLapStageRow();
  });

  _safe('flags', () => applyFlagState());
  _safe('finishers', () => checkFinishers(d));

  const session      = (d.session || '').toLowerCase();
  const playerCarIdx = d.playerCarIdx ?? -1;
  const standings    = getStandings(d);
  if (!standings.length) {
    setBottomVisible(false);
    document.getElementById('fastestlap-badge').style.display = 'none';
    return;
  }
  setBottomVisible(true);

  const lapTracker = d.lapTracker || {};
  const key = standings.map(s => s.carIdx).join(',');
  if (key !== _lastStandingsKey) {
    _lastStandingsKey = key;
    _safe('renderStandings', () => renderStandings(standings, session, playerCarIdx, lapTracker));
  } else {
    _safe('updateGaps', () => updateGaps(standings, session, lapTracker));
  }

  _safe('fastestLap', () => updateFastestLapBadge(d));
}

// ── Final-lap sponsor panel ───────────────────────────────────────────────
// When the flag state turns 'white' (one lap to go) the header flips to
// FINAL LAP in a single frame, a light panel wipes down over the standings
// and two/three slanted black bars sweep across it. The panel holds the
// sponsor logo (images/Prime/finallapsponsor.png — edit/replace that file,
// a transparent PNG works best) and then wipes away, black bars cutting it
// into three offset bands, to reveal the standings again.
// Timings were measured frame-by-frame (60 fps) from the reference capture.
const FL_STATES  = ['white'];   // flag states that trigger it — add 'stageFinal' to use it on stage-final laps too
const FL_HOLD_MS = 3200;        // time from the header switch until the panel starts wiping out
const FL_PANEL   = { x: 30, y: 190, w: 321.5, h: 776, r: 19 };  // body panel rect on the 399x1080 canvas (r = bottom corner radius)
const FL_LOGO    = { maxW: 300, maxH: 520, cy: 0.463 };         // logo box: max size, vertical centre as a fraction of the panel height
const FL_COLORS  = { panel: '#ededed', shine: '#e1e1e1', bar: '#000000' };
const FL_FRAME   = 1000 / 60;   // one reference frame in ms
const FL_SLOPE   = 0.3;         // bar lean: x shifts left 0.3px per px going down
const FL_SS      = 2;           // canvas backing-store scale (crisper edges)

// Wipe-in: reveal front (px from panel top, out of 762) by frame after the reveal starts.
const FL_REVEAL = [[-1,0],[0,15],[1,15],[2,43],[3,84],[4,197],[5,253],[6,345],[7,440],[8,526],
                   [9,563],[10,595],[11,627],[12,659],[13,691],[14,723],[15,755],[15.4,762]];
// Wipe-out: three horizontal bands; the middle one runs ahead of the other two (the "stepped" look).
const FL_BANDS   = [[0, 268, 0], [268, 512, 127], [512, FL_PANEL.h, 0]];  // [top, bottom, x-offset]

const _fl = { on: false, fired: false, t0: 0, raf: 0, logo: null, ctx: null };

function flLerp(tbl, t) {
  if (t <= tbl[0][0]) return tbl[0][1];
  for (let i = 1; i < tbl.length; i++) {
    if (t <= tbl[i][0]) {
      const a = tbl[i - 1], b = tbl[i];
      return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]);
    }
  }
  return tbl[tbl.length - 1][1];
}

function flEnsureCanvas() {
  if (_fl.ctx) return;
  const cv = document.getElementById('finallap-canvas');
  cv.width  = Math.round(FL_PANEL.w * FL_SS);
  cv.height = Math.round(FL_PANEL.h * FL_SS);
  cv.style.left   = FL_PANEL.x + 'px';
  cv.style.top    = FL_PANEL.y + 'px';
  cv.style.width  = FL_PANEL.w + 'px';
  cv.style.height = FL_PANEL.h + 'px';
  _fl.ctx = cv.getContext('2d');
}

function flLoadLogo() {
  const im = new Image();
  im.onload = () => { _fl.logo = im; };
  im.src = PRIME_BASE + '/finallapsponsor.png';
}

// Slanted bar: its left edge is at xRef on row yRef and leans left going down.
function flBar(c, xRef, yRef, w, yt, yb) {
  const x0 = xRef - FL_SLOPE * (yt - yRef);
  const x1 = xRef - FL_SLOPE * (yb - yRef);
  c.fillStyle = FL_COLORS.bar;
  c.beginPath();
  c.moveTo(x0, yt); c.lineTo(x0 + w, yt); c.lineTo(x1 + w, yb); c.lineTo(x1, yb);
  c.closePath();
  c.fill();
}

// Right edge of the thin trailing bar on row y — everything left of it is already erased.
function flEraseX(tau, off, y) {
  const L1 = 75.3 + 49.3 * tau + off;
  return Math.min(FL_PANEL.w + 2, L1 - 193 + 18.3 - FL_SLOPE * (y - 3.5));
}

function flDraw(mode, front, tb, tau) {
  const c = _fl.ctx, W = FL_PANEL.w, H = FL_PANEL.h, R = FL_PANEL.r;
  c.setTransform(FL_SS, 0, 0, FL_SS, 0, 0);
  c.clearRect(0, 0, W, H);
  if (mode === 'none') return;

  const panelPath = () => {
    c.beginPath();
    c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, H - R);
    c.arcTo(W, H, W - R, H, R); c.lineTo(R, H); c.arcTo(0, H, 0, H - R, R);
    c.closePath();
  };

  // 1) the light panel (+ shine + logo), limited to whatever is currently visible
  c.save();
  panelPath(); c.clip();
  if (mode === 'in') {
    c.beginPath(); c.rect(0, 0, W, front); c.clip();
  } else if (mode === 'out') {
    c.beginPath();
    for (const [yt, yb, off] of FL_BANDS) {
      c.moveTo(flEraseX(tau, off, yt), yt); c.lineTo(W + 2, yt);
      c.lineTo(W + 2, yb); c.lineTo(flEraseX(tau, off, yb), yb); c.closePath();
    }
    c.clip();
  }
  c.fillStyle = FL_COLORS.panel;
  c.fillRect(0, 0, W, H);
  c.fillStyle = FL_COLORS.shine;                       // soft diagonal shine bands
  for (let k = -1; k < 7; k++) {
    const y = 55 + 150 * k;
    c.beginPath();
    c.moveTo(0, y); c.lineTo(W, y + 0.31 * W); c.lineTo(W, y + 0.31 * W + 54); c.lineTo(0, y + 54);
    c.closePath(); c.fill();
  }
  const lg = _fl.logo;
  if (lg && lg.naturalWidth) {
    const k = Math.min(FL_LOGO.maxW / lg.naturalWidth, FL_LOGO.maxH / lg.naturalHeight);
    const lw = lg.naturalWidth * k, lh = lg.naturalHeight * k;
    c.drawImage(lg, (W - lw) / 2, H * FL_LOGO.cy - lh / 2, lw, lh);
  }
  c.restore();

  // 2) black bars
  if (mode === 'in' && tb > -2 && tb < 16.5) {
    c.save();
    panelPath(); c.clip();
    c.beginPath(); c.rect(0, 0, W, front); c.clip();
    const x = 9.2 + (52 * tb + 0.9 * tb * tb) / 0.983;   // leading bar, sweeping left → right
    for (let k = 0; k < 3; k++) flBar(c, x - k * 208.5, 34, 23.5, 0, H);
    c.restore();
  } else if (mode === 'out') {
    for (const [yt, yb, off] of FL_BANDS) {
      c.save();
      panelPath(); c.clip();
      c.beginPath(); c.rect(0, yt, W, yb - yt); c.clip();
      const L1 = 75.3 + 49.3 * tau + off;
      flBar(c, L1, 3.5, 63, yt, yb);          // wide leading bar
      flBar(c, L1 - 193, 3.5, 18.3, yt, yb);  // thin trailing bar (the erasing edge)
      c.restore();
    }
  }
}

// ms = time since the header switched to FINAL LAP. Returns 'done' when finished.
function flRenderAt(ms) {
  flEnsureCanvas();
  const F = ms / FL_FRAME;
  const holdF = FL_HOLD_MS / FL_FRAME;
  const tr = F - 5;                       // reveal starts 5 frames after the header switch
  if (tr < -1) { flDraw('none'); return 'wait'; }
  if (F >= holdF) {
    const tau = (F - holdF) - 3;          // bars enter 3 frames before tau = 0
    if (tau > 14) { flDraw('none'); return 'done'; }
    flDraw('out', FL_PANEL.h, 0, tau);
    return 'out';
  }
  const front = Math.min(FL_PANEL.h, flLerp(FL_REVEAL, tr) / 762 * FL_PANEL.h);
  flDraw('in', front, F - 13, 0);         // bars start 13 frames after the header switch
  return 'in';
}

function flTick(now) {
  if (!_fl.on) return;
  if (flRenderAt(now - _fl.t0) === 'done') { flStop(); return; }
  _fl.raf = requestAnimationFrame(flTick);
}

function flStart() {
  flEnsureCanvas();
  flLoadLogo();                           // picks up edits to finallapsponsor.png
  _fl.on = true; _fl.fired = true; _fl.t0 = performance.now();
  document.getElementById('finallap-layer').style.display = 'block';
  _fl.raf = requestAnimationFrame(flTick);
}

function flStop() {
  _fl.on = false;
  cancelAnimationFrame(_fl.raf);
  if (_fl.ctx) _fl.ctx.clearRect(0, 0, FL_PANEL.w, FL_PANEL.h);
  document.getElementById('finallap-layer').style.display = 'none';
}

function flReset() { flStop(); _fl.fired = false; }

// Called from applyFlagState() on every tick with the resolved flag state.
function finalLapSync(state) {
  if (FL_STATES.includes(state)) {
    if (!_fl.on && !_fl.fired) flStart();      // once per entry into the state
  } else {
    if (_fl.on) flStop();                      // flag changed (caution/checkered…): drop the panel at once
    _fl.fired = false;
  }
}
flLoadLogo();


// ── Starting grid (pre-race) ──────────────────────────────────────────────
// Option "Starting grid" of the layout editor (off by default): when the race goes from GRIDDING ("get in car") to PACING (warmup / parade
// laps) the grid is shown over the body panel, SG_DELAY_MS later. Rows of two cars: position 1 inside (left), 2 outside (right), 3 inside...
// Each row drops in from above, one after another. 10 cars (5 rows) per page; each page stays up for the "Grid Page Time" and the grid goes
// away after the last page, or at once when the green flag drops. "Grid: my car" leaves the user's own car out (its slot stays empty).
let START_GRID  = /^(1|true)$/i.test(String(psf.startgrid || params.get('startgrid') || '0'));
let SG_SKIP_SELF = /^(1|true)$/i.test(String(psf.startgridskip || params.get('startgridskip') || '0'));
const grClamp = v => Math.min(30, Math.max(1, parseFloat(v) || 8)) * 1000;
let GR_HOLD_MS = grClamp(psf.startgridtime || params.get('startgridtime') || '8');
const GR_PAGE = 10;                                          // cars per page (5 rows)
const GR_ENTER_MS = 1500, GR_SWAP_MS = 750, SG_DELAY_MS = 5000;
const _gr = { on: false, page: 0, key: '', busyUntil: 0, timer: null, hideT: null, hideT2: null, swapT: null, delayT: null, list: [], skey: '', shown: false };
const grEl = id => document.getElementById(id);

// Start order: the app's detected start positions first (same source as Race Stats / Driver Info), the game's standings only as a fallback.
// The user's own car is left out when "Grid: my car" is on (its slot stays empty so the other cars keep their real position).
function grList(d) {
  if (!d) return [];
  const pool = {};
  [d.standings, d.liveStandings, d.drivers].forEach(l => { if (Array.isArray(l)) l.forEach(x => { if (x && x.number != null) { const k = normNum(x.number); if (k && !(k in pool)) pool[k] = x; } }); });
  const trk = String(d.track || '');
  const srv = (_srvStart && (!_srvStart.track || !trk || String(_srvStart.track) === trk)) ? _srvStart : null;
  let list = null;
  if (srv) {
    const map = srv.start || srv.qual || ((srv.grid && String(srv.key) === String(d.sessionCookie) + '|' + trk) ? srv.grid : null);
    if (map) {
      const rows = Object.keys(map).map(k => ({ k: normNum(k), pos: Number(map[k]) || 0 })).filter(r => r.k && r.pos > 0).sort((x, y) => x.pos - y.pos);
      if (rows.length) list = rows.map(r => pool[r.k] || { number: r.k, carIdx: -1, name: '' });
    }
  }
  if (!list) list = ((d.standings && d.standings.length) ? d.standings : (d.liveStandings || [])).filter(Boolean);
  if (!SG_SKIP_SELF) return list;
  const pi = d.playerCarIdx;
  return list.map(x => (x && ((pi != null && pi >= 0 && x.carIdx === pi) || x.isPlayer === true)) ? null : x);
}
function grPhotoHTML(num, own) {
  const srcs = [assetPath('series/' + SERIES_ID + '/headshots/' + encodeURIComponent(num) + '.png')];
  if (own) srcs.unshift(assetPath('images/playerheadshot.png'));
  srcs.push(assetPath('images/defaultheadshot.png'));
  return '<img alt="" src="' + diEsc(srcs[0]) + '" data-q="' + diEsc(JSON.stringify(srcs.slice(1))) +
         '" onerror="var q=JSON.parse(this.dataset.q||\'[]\');if(q.length){this.dataset.q=JSON.stringify(q.slice(1));this.src=q[0]}else{this.remove()}">';
}
function grNumHTML(num) {
  const src = numImgSrc(num), fb = '<span>' + diEsc(num) + '</span>';
  if (!src) return fb;
  return '<img data-fb="' + diEsc(fb) + '" src="' + diEsc(src) + '" alt="" onerror="var p=this.parentNode,f=this.dataset.fb;p.innerHTML=f">';
}
function grCard(s, d, rowNo) {
  const num = (s.number == null ? '' : String(s.number)).trim() || '??';
  const col = _driverColors[num] || '';
  const bg = col ? 'linear-gradient(160deg,' + lightenHex(col, 16) + ' 0%,' + col + ' 62%)' : 'linear-gradient(160deg,#34343a 0%,#17171a 100%)';
  const full = String(diNameOf(s, num) || '').trim().toUpperCase() || num;

    const add = project ? ((pos ? (Number(table[pos - 1]) || 0) : 0) + (ledN > 0 ? bLed : 0) + (ledN > 0 && ledN === maxLed ? bMost : 0) + (stageMap[k] || 0)) : 0;

function diLiveChampPos(d, num) {

// Points to the cutoff line (only while the cutoff line is on in the Championship screen): points above / below it in the live championship
function diCutoffText(d, num) {

// ── Estimated speed of every car ──────────────────────────────────────────────────────────────────────────
// The bridge only gives real telemetry (speed, rpm, throttle…) for the player's own car. For the other cars the speed is ESTIMATED from how far

function diKindText(kind, inf, i, d, s, num) {

  const mine = r => (r.rows || []).find(x => normNum(x.number) === num);
  switch (kind) {
    case 'custom': return inf['line' + i] || '';
    case 'ledToday': {
      if (!isRace) return '';

      const total = Math.max(Number(d.lapsComplete) || 0, LED.lastLap || 0);
      return total ? 'Has led ' + led + ' of ' + total + ' laps' : 'Has led ' + led + ' laps';
    }
    case 'ledSeason': {

    }
    case 'champPos': case 'champPts': {

      const me = rows.find(x => x.k === num); if (!me) return '';

    }
    case 'top5Season': case 'top10Season': {

    }
    case 'lastPit': {

        p = (_srvStart.start && _srvStart.start[num]) || (_srvStart.qual && _srvStart.qual[num]) || ((_srvStart.grid && String(_srvStart.key) === key) ? (_srvStart.grid[num] || 0) : 0) || 0;
      }
      if (!p) p = (_qual && _qual.track === trk ? (_qual.order[num] || 0) : 0) || (_grid.order ? (_grid.order[num] || 0) : 0);
      return p ? 'Started ' + _ord(p) + ' today' : '';
    }
    case 'curPos': {
      const st = getStandings(d);

    }
    case 'lastLap': {
      const ld = (d.lapData || []).find(l => l.carIdx === s.carIdx);

      return t ? 'Last Lap: ' + t : '';
    }
    case 'cutoffPts': return diCutoffText(d, num);
    case 'liveChampPos': {

    }
    case 'fastestLap': {                                              // fastest lap of the whole race + surname of the driver who set it
      let fc = (d.fastestCarIdx == null ? -1 : Number(d.fastestCarIdx)), ft = Number(d.fastestLap) || 0;
      if (!(ft > 0) || fc < 0) {

        Object.keys(lts).forEach(k => { const b = Number(lts[k] && lts[k].bestLap); if (b > 0 && (ft === 0 || b < ft)) { ft = b; fc = Number(k); } });
      }
      const t = (ft > 0 && fc >= 0) ? _fmtLap(ft) : '';
      if (!t) return '';
      const fe = (d.standings || []).find(x => x && x.carIdx === fc) || (d.drivers || []).find(x => x && x.carIdx === fc);
      let fn = '';
      if (fe) { const fnum = normNum(fe.number); try { fn = String((typeof winnerName === 'function' ? winnerName(fe, fnum) : diNameOf(fe, fnum)) || ''); } catch (e) { fn = String(fe.fullName || fe.name || ''); } }
      const parts = fn.trim().split(/\s+/).filter(Boolean);

    }
    case 'bestLap': {

}
function diLine(inf, i, d, s, num) {
  const kind = inf['k' + i] || (inf['line' + i] ? 'custom' : '');
  return kind ? diKindText(kind, inf, i, d, s, num) : '';
}

// ── markup ──
let _cmByIdx = {};
function diManuCands(s, num) {

  const c = [assetPath(`series/${SERIES_ID}/manufacturers/${encodeURIComponent(n)}.png`)];
  const slot = (s && _cmByIdx[s.carIdx]) || ((s && s.carMakeFromFile != null && s.carMakeFromFile >= 0) ? s.carMakeFromFile + 1 : 0);
  if (slot) c.push(assetPath(`series/${SERIES_ID}/manufacturers/manu${slot}.png`));

}
function diManuHTML(s, num) {
  const c = diManuCands(s, num);

  return '<img src="' + diEsc(c[0]) + '"' + alt + ' alt="" onerror="var a=this.dataset.alt;if(a){this.dataset.alt=\'\';this.src=a}else{this.remove()}">';

function diFit() {

  const els = Array.from(nm.querySelectorAll('.f, .l'));
  const base = els.map(el => { const sz = el.classList.contains('l') ? 36 : 28; el.style.fontSize = sz + 'px'; return sz; });
  const widths = els.map(el => el.scrollWidth);
  els.forEach((el, i) => { if (widths[i] > max && max > 0) el.style.fontSize = Math.max(14, Math.floor(base[i] * max / widths[i])) + 'px'; });
  els.forEach(el => { let sz = parseInt(el.style.fontSize, 10); while (el.scrollWidth > max && max > 0 && sz > 14) { sz -= 1; el.style.fontSize = sz + 'px'; } });
  const rr = diEl('di-r');
  if (rr && rr.style.display !== 'none') {
    rr.querySelectorAll('.a, .b').forEach(el => {
      const t = el.querySelector('span:last-child'); if (!t) return;
      const isA = el.classList.contains('a'), avail = el.clientWidth - (isA ? 36 : 62);
      let sz = isA ? 32 : 22; el.style.fontSize = sz + 'px';

// Smooth change from one driver to another while the banner is up: a copy of the previous card stays on top and fades out (drifting up a

const DI_SWAP_MS = 520;
function diCrossfade() {
  try {
    if (_diGhost) { _diGhost.remove(); _diGhost = null; }
    const g = diBox.cloneNode(true);
    g.classList.add('di-ghost');   // keeps its id on purpose: the card's CSS is written by id (the original card comes first in the page, so lookups still find it)
    const w = diBox.offsetWidth, h = diBox.offsetHeight;
    g.style.cssText += ';position:absolute;left:0;top:' + diBox.offsetTop + 'px;width:' + w + 'px;height:' + h + 'px;z-index:5;pointer-events:none;margin:0;'
      + ';';

    diWrap.appendChild(g); _diGhost = g;

      const a = g.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 1, transform: 'translateY(0)', offset: 0.2 }, { opacity: 0, transform: 'translateY(-10px)' }],
                          { duration: DI_SWAP_MS, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = () => { if (_diGhost === g) _diGhost = null; g.remove(); };
      if (diBox.animate) diBox.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: DI_SWAP_MS, easing: 'ease-out' });
    } else { setTimeout(() => { if (_diGhost === g) _diGhost = null; g.remove(); }, 50); }
  } catch (e) { if (_diGhost) { _diGhost.remove(); _diGhost = null; } }

// Name colours of the Driver Info card follow the driver's background colour: first name white (or dark on light cards), surname red
// unless the red would disappear into the card (red / light-red cards) — then a deeper red, else white or dark, whichever reads best.
function _diRGB(hex) {
  const m = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(String(hex || '').trim());
  if (m) return [+m[1], +m[2], +m[3]];
  let h = String(hex || '').replace('#', '').trim();
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); if (!/^[0-9a-f]{6}$/i.test(h) || isNaN(n)) return null;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function _diLum(rgb) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);

function _diContrast(a, b) { const la = _diLum(a), lb = _diLum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }

  const best = worst(WHITE) >= worst(DARK) ? WHITE : DARK;
  const first = worst(WHITE) >= 3 ? WHITE : best;
  const last = worst(RED) >= 3.2 ? RED : (worst(DEEP) >= 3.2 ? DEEP : (worst(WHITE) >= 3 ? WHITE : best));

  return { f: hexOf(first), l: hexOf(last), fs: shadow(first), ls: shadow(last) };
}
function diRender(d) {
  const s = diDriver(d); if (!s) return false;
  const num = (s.number || '??').toString().trim();
  const full = String(diNameOf(s, num) || '').trim().toUpperCase() || num.toUpperCase();
  const col = _driverColors[num] || '';                      // colour assigned in the Series Editor ('' = Prime blue)
  const inf = _diInfo[num] || {}, l1 = diLine(inf, 1, d, s, num) || DI_LINE1, l2 = diLine(inf, 2, d, s, num) || DI_LINE2;
  const tab = DI_TAB || DI_SERIES_NAME || '';
  const key = [s.carIdx, num, full, col, tab, l1, l2].join('|');
  if (key === _diKey) return 2;                              // unchanged
  const _prevCar = _diShownCar; _diShownCar = s.carIdx;
  if (_diOn && _prevCar != null && _prevCar !== s.carIdx && diWrap.style.display !== 'none') diCrossfade();
  _diKey = key;
  if (col) diBox.style.setProperty('--di-bg', `linear-gradient(90deg, ${lightenHex(col, 18)} 0%, ${col} 55%, ${col} 100%)`);
  else diBox.style.removeProperty('--di-bg');
  { const nc = col ? diNameColours(col) : null;
    ['--di-f', '--di-l', '--di-fs', '--di-ls'].forEach(k => diBox.style.removeProperty(k));
    if (nc) { diBox.style.setProperty('--di-f', nc.f); diBox.style.setProperty('--di-l', nc.l); if (nc.fs) diBox.style.setProperty('--di-fs', nc.fs); if (nc.ls) diBox.style.setProperty('--di-ls', nc.ls); } }
  diEl('di-num').innerHTML = diNumHTML(num) + '<div id="di-manu">' + diManuHTML(s, num) + '</div>';
  if (_diPhotoNum !== num) {                                  // reload the headshot only when the driver changes
    _diPhotoNum = num;
    const ph = diEl('di-photo'); ph.classList.remove('on');
    const own = s.carIdx === (d.playerCarIdx ?? -2);
    const srcs = [assetPath(`series/${SERIES_ID}/headshots/${encodeURIComponent(num)}.png`)];
    if (own) srcs.unshift(assetPath('images/playerheadshot.png'));
    srcs.push(assetPath('images/defaultheadshot.png'));
    ph.innerHTML = '<img alt="" src="' + diEsc(srcs[0]) + '" data-q="' + diEsc(JSON.stringify(srcs.slice(1))) + '" onload="this.parentNode.classList.add(\'on\')" onerror="var q=JSON.parse(this.dataset.q||\'[]\');if(q.length){this.dataset.q=JSON.stringify(q.slice(1));this.src=q[0]}else{this.parentNode.classList.remove(\'on\');this.remove()}">';
  }
  const last = diLastNameOf(full), first = (last && full.endsWith(last)) ? full.slice(0, full.length - last.length).trim() : '';
  diEl('di-name').innerHTML = (first ? '<div class="f">' + diEsc(first) + '</div>' : '') + '<div class="l">' + diEsc(last || full) + '</div>';
  const tabEl = diEl('di-tab'); tabEl.textContent = tab; tabEl.style.display = tab ? 'flex' : 'none';
  const r = diEl('di-r');
  if (l1 || l2) { r.innerHTML = diRightHTML(l1, l2); r.style.display = ''; diBox.classList.remove('tight'); }
  else { r.innerHTML = ''; r.style.display = 'none'; diBox.classList.add('tight'); }
  return 1;                                                   // changed
}

// ── placement: lower third, centred on the screen. The tower's window only covers the tower, so it is stretched
// to the screen's bottom and right edge while the banner is up (and put back afterwards). Without the app bridge (OBS)
// the banner is scaled down to fit the tower canvas width and sits at the bottom of the canvas.
async function diPlace() {
  const sc = SCALE * DI_SCALE;
  diWrap.style.transformOrigin = '0 0';
  if (!(window.shl && window.shl.extendOverlay) || !window.screen) {
    const f = Math.min(1, 399 / diWrap.offsetWidth);
    diWrap.style.transform = 'scale(' + f + ')';
    diWrap.style.left = '0px';
    diWrap.style.top = Math.round(1080 - diWrap.offsetHeight * f - 8) + 'px';
    return;
  }
  try {
    const scrH = window.screen.height, scrW = window.screen.width, offX = window.screen.availLeft || 0;
    await window.shl.extendOverlay(scrH, offX + scrW);
    const winTop = window.screenY || 0, winLeft = window.screenX || 0;
    diWrap.style.transform = 'scale(' + sc + ')';
    const w = diWrap.offsetWidth, h = diWrap.offsetHeight;
    diWrap.style.left = Math.max(0, Math.round(offX + scrW / 2 - winLeft - w * sc / 2)) + 'px';
    diWrap.style.top  = Math.max(0, Math.round(scrH * DI_BOTTOM - h * sc - winTop)) + 'px';
  } catch (e) { diWrap.style.transform = 'scale(' + sc + ')'; diWrap.style.left = '0px'; diWrap.style.top = '1000px'; }
}
function diRestoreWindow() { try { if (window.shl && window.shl.extendOverlay) window.shl.extendOverlay(null); } catch (e) {} }
async function diShow() {
  clearTimeout(_diHideT); _diKey = ''; _diShownCar = null; if (_diGhost) { _diGhost.remove(); _diGhost = null; }
  if (!diRender(_latestData)) return;
  _diOn = true;
  diWrap.style.display = 'block';                             // laid out (still transparent) so it can be measured
  await diPlace();
  if (!_diOn) return;                                         // toggled off while the window was being stretched
  void diWrap.offsetWidth;                                    // start the fade from opacity 0
  diWrap.style.opacity = String(isNaN(OPACITY) ? 1 : OPACITY);
  diFit(); diPlace();
}
function diHide() {
  _diOn = false; diWrap.style.opacity = '0';
  clearTimeout(_diHideT);
  _diHideT = setTimeout(() => { if (!_diOn) { diWrap.style.display = 'none'; diRestoreWindow(); } }, DI_FADE_MS + 50);
}
function diToggle() { if (_diOn) diHide(); else diShow(); }
function diUpdate(d) { if (!_diOn) return; const r = diRender(d); if (r === 1) { diFit(); if (_diGhost && _diGhost.isConnected) _diGhost.style.left = Math.round((diWrap.offsetWidth - _diGhost._w) / 2) + 'px'; diPlace(); } }
function diReset() { _diSel = null; _diKey = ''; _diPhotoNum = null; _diNames = {}; _diShownCar = null; if (_diGhost) { _diGhost.remove(); _diGhost = null; } }
window.__toggleDriverInfo = diToggle;
window.__stepDriverInfo = diStep;
if (window.shl && window.shl.onDriverInfoToggle) window.shl.onDriverInfoToggle(diToggle);
if (window.shl && window.shl.onDriverInfoStep) window.shl.onDriverInfoStep(diStep);
// Called with every data frame (the Info lines need the grid, pit stops, qualifying order and car makes even while the banner is hidden)
function diFeed(d) {
  diLearnNames(d); trackQual(d); trackGrid(d); trackPits(d);
  (d.standings || []).forEach(e => { if (e && e.carIdx != null && e.carMakeFromFile != null && e.carMakeFromFile >= 0 && !_cmByIdx[e.carIdx]) _cmByIdx[e.carIdx] = e.carMakeFromFile + 1; });
  (d.drivers || []).forEach(e => { if (e && e.carIdx != null && e.carMakeFromFile != null && e.carMakeFromFile >= 0) _cmByIdx[e.carIdx] = e.carMakeFromFile + 1; });
  if (_diOn) diUpdate(d);
}
