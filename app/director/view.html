<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaceVision Director View</title><style>
:root{color-scheme:dark;--bg:#0b0f15;--panel:#141a23;--line:#273241;--gold:#e8c84a;--muted:#9ca9b7;--blue:#3c9cff;--green:#46c878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2f8;font:14px system-ui,Segoe UI,sans-serif}header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#111720;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0}.chip{border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--muted)}.chip.live{color:var(--green);border-color:#286747}.grow{flex:1}button,select{color:#edf2f8;background:#202936;border:1px solid #344256;border-radius:5px;padding:7px 10px;cursor:pointer}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:10px;padding:10px;max-width:1800px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.head{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700}.canvaswrap{padding:8px}canvas{display:block;width:100%;background:#0c1219;border-radius:4px}.map{height:min(52vh,520px)}.timeline{height:145px}.row{display:flex;gap:9px;align-items:center;padding:8px 11px;border-bottom:1px solid #222c38}.row:last-child{border-bottom:0}.row b{color:var(--gold);min-width:42px}.row span{color:var(--muted);font-size:12px}.events{max-height:34vh;overflow:auto}.field{max-height:46vh;overflow:auto}.car{display:grid;grid-template-columns:38px 42px 1fr auto;gap:7px}.car strong{color:var(--gold)}.car.on{background:#183021}.small{font-size:12px;color:var(--muted)}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px}.wait{color:#ffd16a}.error{color:#ff837c;padding:8px}
@media(max-width:900px){main{grid-template-columns:1fr}.map{height:48vh}.events,.field{max-height:30vh}}
</style></head><body>
<header><img id="logo" alt="Series" style="display:none;max-width:112px;max-height:38px;object-fit:contain"><h1>🎥 Director View</h1><span class="chip" id="track">Waiting for NR2003</span><span class="chip" id="lap">Lap —</span><span class="chip" id="camera">Camera —</span><span class="chip" id="flag">Flag —</span><span class="grow"></span><select id="recordings"><option value="">Live session</option></select><button id="live">LIVE</button></header>
<main>
 <section class="card"><div class="head">Track map <span class="small" id="mapnote">The map fills in as cars drive the track.</span></div><div class="canvaswrap"><canvas id="map" class="map"></canvas></div></section>
 <section class="card"><div class="head">On air <span class="small" id="reason"></span></div><div id="onair" class="row">Waiting for the director…</div><div id="cut" class="row wait" style="display:none"></div><div class="head">Field</div><div id="field" class="field"></div></section>
 <section class="card"><div class="head">Decision timeline <span class="small" id="timeLabel"></span></div><div class="canvaswrap"><canvas id="timeline" class="timeline"></canvas><div class="tools"><button id="back">− 30s</button><button id="forward">+ 30s</button><button id="zoom">5 minutes</button><span class="small">Select a point to inspect that moment.</span></div></div></section>
 <section class="card"><div class="head">Recent decisions</div><div id="events" class="events"></div></section>
</main><div id="error" class="error"></div>
<script>
const K=new URLSearchParams(location.search).get('k')||'', $=id=>document.getElementById(id), api=async p=>{const r=await fetch(p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(K));if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
let live=null,events=[],sample=null,viewT=null,recording=false,zoom=300,lastFile='',files=[];
const typeColor=k=>({PASS:'#46c878',BATTLE:'#3c9cff',INCIDENT:'#eb554b',RESTART:'#e8c84a',FLAG:'#b07cff',LAP:'#b7c4d4',LEADER:'#ff9a3c',TOUR:'#8394a8',PIT:'#b07cff',MANUAL:'#e8c84a'}[String(k||'').toUpperCase()]||'#91a2b5');
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{x,w:r.width,h:r.height}}
function drawMap(state){const {x,w,h}=fit($('map'));x.clearRect(0,0,w,h);const m=state.map||{},pts=m.pts||[];if(pts.length<4){$('mapnote').textContent='The map fills in as cars drive the track.';return} $('mapnote').textContent='Map learned from car positions · '+pts.length+' track points';
 const D=!sample&&state.dyn&&state.dyn.on&&Number.isFinite(state.dyn.x)&&Number.isFinite(state.dyn.y)?state.dyn:null;
 const xs=pts.map(p=>p[0]).concat(D?[D.x]:[]),ys=pts.map(p=>p[1]).concat(D?[D.y]:[]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=45,s=Math.min((w-2*pad)/Math.max(1,maxX-minX),(h-2*pad)/Math.max(1,maxY-minY));
 const xy=p=>[pad+(p[0]-minX)*s,h-pad-(p[1]-minY)*s];x.lineJoin='round';x.lineCap='round';x.beginPath();pts.forEach((p,i)=>{const a=xy(p);i?x.lineTo(...a):x.moveTo(...a)});if(pts.length>20)x.closePath();x.strokeStyle='#687688';x.lineWidth=13;x.stroke();x.strokeStyle='#19232d';x.lineWidth=8;x.stroke();
 const current=sample||{p:(state.cars||[]).map(c=>[c[0],c[1],c[3],c[4],c[5],c[6]])};
 if(D){const p=xy([D.x,D.y]),tc=(current.p||[]).find(a=>a[0]===(D.slot>=0?D.slot:state.car));let ang=null;if(tc&&Number.isFinite(tc[2])){const q=xy([tc[2],tc[3]]);ang=Math.atan2(q[1]-p[1],q[0]-p[0]);const half=Math.max(.05,(D.fov||40)*Math.PI/360),r=Math.hypot(q[0]-p[0],q[1]-p[1])+30;x.beginPath();x.moveTo(p[0],p[1]);x.arc(p[0],p[1],r,ang-half,ang+half);x.closePath();x.fillStyle='rgba(255,159,220,.16)';x.fill()}
  x.beginPath();x.arc(p[0],p[1],6,0,Math.PI*2);x.fillStyle='#ff9fdc';x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();x.fillStyle='#ff9fdc';x.font='bold 11px system-ui';x.fillText(D.label||'Dynamic camera',p[0]+9,p[1]+14)}
 for(const c of current.p||[]){const a=Array.isArray(c)?c:null;if(!a||!Number.isFinite(a[2])||!Number.isFinite(a[3]))continue;const p=xy([a[2],a[3]]),slot=a[0],num=a[1],on=slot===state.car;x.beginPath();x.arc(p[0],p[1],on?7:4.5,0,Math.PI*2);x.fillStyle=on?'#e8c84a':(a[4]?'#8394a8':'#e7edf4');x.fill();if(on){x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText('#'+num,p[0]+8,p[1]-7)}}
 const groups=(m.tv||[]);groups.forEach((g,gi)=>g.forEach(c=>{const n=Math.max(0,Math.min(pts.length-1,Math.round((c.from||0)*pts.length))),p=xy(pts[n]);x.beginPath();x.arc(p[0],p[1],gi===0?4:3,0,Math.PI*2);x.fillStyle=['#3c9cff','#ff9a3c','#b07cff'][gi];x.fill()}));
}
function drawTimeline(){const {x,w,h}=fit($('timeline'));x.clearRect(0,0,w,h);const end=viewT??(live?.t||0),start=end-zoom;x.strokeStyle='#2b3745';x.fillStyle='#9ca9b7';x.font='11px system-ui';for(let i=0;i<=5;i++){const px=i*w/5;x.beginPath();x.moveTo(px,18);x.lineTo(px,h);x.stroke();x.fillText(Math.round(start+i*zoom/5)+'s',px+3,12)}
 const lanes={shot:38,flag:70,lap:100};Object.entries(lanes).forEach(([k,y])=>{x.fillStyle='#8795a4';x.fillText(k.toUpperCase(),5,y-6)});for(const e of events){const t=Number(e.t);if(t<start||t>end)continue;const px=75+(t-start)/zoom*Math.max(1,w-80),kind=String(e.kind||'').toUpperCase(),y=kind==='FLAG'?lanes.flag:kind==='LAP'?lanes.lap:lanes.shot;x.fillStyle=typeColor(kind);x.fillRect(px,y-13,3,18);if(kind!=='FLAG'&&kind!=='LAP'){x.fillStyle='#dce4ec';x.font='10px system-ui';x.fillText((e.num?'#'+e.num+' ':'')+kind,px+4,y-3)}}
 if(viewT!==null){const px=75+(viewT-start)/zoom*Math.max(1,w-80);x.strokeStyle='#fff';x.beginPath();x.moveTo(px,18);x.lineTo(px,h);x.stroke()}$('timeLabel').textContent=viewT===null?'LIVE':'Viewing '+viewT.toFixed(1)+'s';}
function artUrl(kind,n,s){return '/art/'+kind+'/'+n+'.png?s='+encodeURIComponent(s||'')+'&k='+encodeURIComponent(K)}
function paintField(state){const f=sample?.p?sample.p.map(a=>({slot:a[0],num:a[1],name:'',x:a[2],y:a[3],pit:!!a[4],pos:a[5]})):(state.cars||[]).map(a=>({slot:a[0],num:a[1],name:a[2],x:a[3],y:a[4],pit:!!a[5],pos:a[6]}));$('field').innerHTML=f.map(c=>'<div class="row car '+(c.slot===state.car?'on':'')+'" data-slot="'+c.slot+'"><span>'+c.pos+'</span><img src="'+artUrl('number',c.num,state.series)+'" onerror="this.style.display=\'none\'" style="width:34px;height:24px;object-fit:contain"><strong>#'+c.num+'</strong><span>'+esc(c.name)+'</span><span class="small">'+(c.pit?'PIT':'')+'</span></div>').join('');for(const el of $('field').querySelectorAll('[data-slot]'))el.onclick=()=>fetch('/api/focus?slot='+el.dataset.slot+'&k='+encodeURIComponent(K))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function paint(state){live=state;$('track').textContent=state.track||'NR2003';$('lap').textContent='Lap '+(state.lap||'—');$('camera').textContent=state.dyn&&state.dyn.on?'Dynamic camera · '+(state.dyn.label||state.dyn.tmpl||''):'Camera '+(state.cam||'—');$('camera').style.color=state.dyn&&state.dyn.on?'#ff9fdc':'';$('flag').textContent=state.green?'GREEN':'Flag '+state.flag;$('flag').className='chip '+(state.green?'live':'');$('reason').textContent=state.why?'· '+state.why:'';const logo=$('logo');if(state.logo&&state.series){logo.src=artUrl('logo',0,state.series);logo.style.display='';logo.onerror=()=>logo.style.display='none'}else logo.style.display='none';const car=(state.cars||[]).find(c=>c[0]===state.car);$('onair').innerHTML=car?'<img src="'+artUrl('number',car[1],state.series)+'" onerror="this.style.display=\'none\'" style="width:72px;height:48px;object-fit:contain"><img src="'+artUrl('head',car[1],state.series)+'" onerror="this.style.display=\'none\'" style="width:48px;height:48px;object-fit:cover;border-radius:50%"><b>#'+car[1]+' '+esc(car[2])+'</b><span>· '+esc(state.kind||'')+(state.paused?' · paused':'')+'</span>':'No car on air';$('cut').style.display=state.waiting?'':'none';$('cut').textContent=state.waiting?'Holding the cut for the TV camera transition':'';drawMap(state);paintField(state);drawTimeline()}
async function refresh(){try{$('error').textContent='';const s=await api('/api/director/live');if(recording)return;sample=null;paint(s);const ev=await api('/api/director/events?from='+(live.t-zoom));events=ev.events||[];paintEvents();if(Date.now()%15000<400){const fs=await api('/api/director/files');files=fs||[];const sel=$('recordings'),cur=sel.value;if(lastFile!==JSON.stringify(files)){lastFile=JSON.stringify(files);sel.innerHTML='<option value="">Live session</option>'+files.map(f=>'<option value="'+esc(f.name)+'">'+esc(f.name)+'</option>').join('');sel.value=cur}}}catch(e){$('error').textContent='Could not read director data: '+e.message}}
function paintEvents(){ $('events').innerHTML=events.slice().reverse().slice(0,80).map(e=>'<div class="row"><b>'+esc(e.kind)+'</b><span>'+Number(e.t).toFixed(1)+'s</span><span>'+(e.num?'#'+e.num+' ':'')+esc(e.why||'')+(e.cam?' · cam '+e.cam:'')+'</span></div>').join('')||'<div class="row small">No decisions recorded yet.</div>' }
async function loadFile(name){if(!name){recording=false;viewT=null;events=[];sample=null;return refresh()}const r=await fetch('/api/director/file?name='+encodeURIComponent(name)+'&k='+encodeURIComponent(K));if(!r.ok)throw Error('Could not open recording');const lines=(await r.text()).split(/\r?\n/).filter(Boolean).map(x=>JSON.parse(x));recording=true;events=lines.filter(x=>x.e).map(x=>x.e);const ps=lines.filter(x=>x.p).map(x=>x.p),roster=(lines.find(x=>x.c)||{}).c||[],maprow=lines.filter(x=>x.m).at(-1);if(maprow)live={...(live||{}),map:maprow.m};if(ps.length){sample=ps[ps.length-1];viewT=sample.t;const head=lines.find(x=>x.h);live={...(live||{}),...(head?.h||{}),t:sample.t,track:head?.h?.track||'Recording',car:sample.car,cam:sample.cam,cars:sample.p.map(a=>{const c=roster.find(r=>r[0]===a[0])||[];return[a[0],a[1],c[2]||'',a[2],a[3],a[4],a[5]]}),samples:ps,timeline:{samples:ps}};paint(live)}paintEvents()}
$('recordings').onchange=()=>loadFile($('recordings').value).catch(e=>$('error').textContent=e.message);$('live').onclick=()=>{$('recordings').value='';recording=false;sample=null;viewT=null;refresh()};$('back').onclick=()=>{viewT=Math.max(0,(viewT??live?.t??0)-30);const s=live.timeline?.samples||[];sample=s.reduce((a,b)=>Math.abs(b.t-viewT)<Math.abs(a.t-viewT)?b:a,s[0]||null);if(sample)paint(live)};$('forward').onclick=()=>{viewT=(viewT??live?.t??0)+30;const s=live.timeline?.samples||[];sample=s.reduce((a,b)=>Math.abs(b.t-viewT)<Math.abs(a.t-viewT)?b:a,s[0]||null);if(sample)paint(live)};$('zoom').onclick=()=>{zoom=zoom===300?900:zoom===900?3600:300;$('zoom').textContent=zoom===300?'5 minutes':zoom===900?'15 minutes':'1 hour';drawTimeline()};$('timeline').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),t=(live?.t||0)-zoom+((e.clientX-r.left-75)/(r.width-80))*zoom;viewT=Math.max(0,t);const s=live?.timeline?.samples||[];sample=s.reduce((a,b)=>Math.abs(b.t-viewT)<Math.abs(a.t-viewT)?b:a,s[0]||null);if(sample)paint(live)};window.onresize=()=>live&&paint(live);function poll(){refresh();setTimeout(poll,500)}poll();
</script></body></html>
