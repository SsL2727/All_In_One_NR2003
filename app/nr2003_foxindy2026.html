<!DOCTYPE html>
<html lang="en">
<head>
<script src="perf-shim.js"></script>
<meta charset="UTF-8">
<title>NR2003 Fox Indycar 2026</title>
<style>
/* Chase highlight — drivers in the chase get a yellow name background */
.chase { background: #f5d100 !important; color: #111 !important; text-shadow: none !important;
         box-shadow: -6px 0 0 #f5d100, 6px 0 0 #f5d100; }
* { margin: 0; padding: 0; box-sizing: border-box; }
 
html, body {
  background: transparent;
  overflow: hidden;
  width: 100%;
  height: 100%;
  font-family: sans-serif;
}
 
/* Widget size is 399x986 (the 798x1971 artwork at 50%). Everything inside #stage is laid out in the
   artwork's native pixel space, so positions below can be read straight off overlay.png. */
#app        { position: relative; width: 450px; height: 986px; }
#scale-root { position: relative; width: 450px; height: 986px; transform-origin: top left; }
#stage {
  position: absolute; left: 0; top: 0;
  width: 900px; height: 1971px;
  transform: scale(0.5); transform-origin: top left;
}
 
/* ── Layer 1: frame (overlay.png), split so the body can hide when there is no data ── */
.ov { position: absolute; left: 0; top: 0; width: 798px; height: 1971px; display: block; pointer-events: none; }
#overlay-header { z-index: 1; clip-path: inset(0 0 1571px 0); }              /* y < 400 */
#overlay-body   { z-index: 1; clip-path: inset(400px 0 0 0); opacity: 0; transition: opacity 0.3s ease; }
 
/* ── Layer 2: header data (flag LEDs, track name, lap counter) ───────────────── */
#header-data { position: absolute; left: 0; top: 0; width: 798px; height: 1971px; z-index: 2; pointer-events: none; }
.led { position: absolute; top: 343px; width: 30px; height: 28px; background: var(--led, #2fd13a); transition: background 0.25s ease; }
#led-l { left: 50px;  clip-path: polygon(0 0, 19px 0, 30px 50%, 19px 100%, 0 100%); }
#led-r { left: 724px; clip-path: polygon(11px 0, 30px 0, 30px 100%, 11px 100%, 0 50%); }
#track-name, #lap-text {
  position: absolute; top: 357px; transform: translateY(-50%);
  color: #ffffff; white-space: nowrap; line-height: 1; text-transform: uppercase;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700;
  text-shadow: 0 2px 0 rgba(0,0,0,0.35);
}
#track-name { left: 104px; font-size: 52px; }
#lap-text   { right: 102px; font-size: 52px; }
/* Final lap: "FINAL LAP" replaces track name + lap counter, left-aligned (LEDs stay, white). */
#header-data.mode-final #lap-text { display: none; }
/* Race over: "OFFICIAL RESULTS" centered across the whole strip, LEDs hidden. */
#header-data.mode-results .led { display: none; }
#header-data.mode-results #lap-text { display: none; }
/* Timed practice / happy hour / qualifying: session name on the left, big italic countdown on the right */
#header-data.mode-timed #lap-text { font-style: italic; letter-spacing: 1px; }
#header-data.mode-results #track-name { left: 104px; width: 592px; text-align: center; }
 

/* ── Flag FX: caution (hazard stripes) / green flag (chevrons) ─────────────────────────────
   Fox IndyCar look: dark header with faded gold bars, thin outlined translucent side columns with
   short diagonal bars, and a solid CAUTION / GREEN FLAG tab with soft diagonal stripes.
   Layer sits just above the frame art and below the header text / standings.
   Geometry is in stage pixels (900x1971). Tweak the vars here if the art needs nudging. */
@property --w { syntax: '<percentage>'; inherits: false; initial-value: -20%; }
#flag-fx { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  --fx-edge: #5fdc72; --fx-bar: #3fcf56; --fx-tab-a: #2fc244; --fx-tab-b: #27b23a; }
#flag-fx.fx-yellow { --fx-edge: #ecbf45; --fx-bar: #f4a31b; --fx-tab-a: #f8c220; --fx-tab-b: #f1ac16; }
#flag-fx > * { position: absolute; opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease; }

/* header: near-black with fine "\" hatch; bold gold hazard stripes only at both ends (fade out toward the
   middle); wipes in from both edges toward the centre. No grey bar behind the text. */
#fx-head {
  left: 56px; top: 300px; width: 688px; height: 108px; opacity: 1 !important; transition: --w 0.5s ease-in;
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,0) 0 5px, rgba(46,104,122,0.26) 5px 9px),
    #04090c;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px));
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 var(--w), transparent calc(var(--w) + 20%)),
                      linear-gradient(270deg, #000 0, #000 var(--w), transparent calc(var(--w) + 20%));
}
#flag-fx.fx-yellow #fx-head { --w: 55%; transition: --w 0.8s ease-out 0.25s; }
#fx-head::before { content: ''; position: absolute; inset: 11px 15px;
  background: repeating-linear-gradient(60deg, #e6a81a 0 33px, rgba(0,0,0,0) 33px 60px);
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 14%, rgba(0,0,0,0) 40%),
                      linear-gradient(270deg, #000 0, #000 14%, rgba(0,0,0,0) 40%);
          mask-image: linear-gradient(90deg, #000 0, #000 14%, rgba(0,0,0,0) 40%),
                      linear-gradient(270deg, #000 0, #000 14%, rgba(0,0,0,0) 40%); }

/* side columns (upper + lower) and bottom strip: translucent grey panel with a pale rim, glued to the frame's
   outer edge; bold outlined bars inside. Lower column + bottom strip read as one L-shaped piece. */
#flag-fx { --fx-edge: #d2ccc0; }
#flag-fx.fx-yellow { --fx-edge: #cdbb92; }
.fx-col { border: 3px solid var(--fx-edge); border-left: 0; box-sizing: border-box;
  background: linear-gradient(90deg, rgba(190,185,178,0.32), rgba(160,155,148,0.32));
  box-shadow: inset -5px 0 0 #8a847b, inset 0 0 0 1px rgba(0,0,0,0.18); }
.fx-col::after { content: ''; position: absolute; }
#fx-col-top { left: 756px; top: 484px;  width: 45px; height: 420px; border-radius: 0 20px 5px 0; }
#fx-col-top::after { inset: 6px 11px 6px 5px; }
#flag-fx.fx-yellow .fx-col::after {
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='47'><polygon points='1,1 23,23 23,46 1,24' fill='%23fba81a' stroke='%238a5600' stroke-width='1.5' stroke-linejoin='round'/></svg>") left top / 24px 47px repeat-y; }
#flag-fx.fx-green .fx-col::after {
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='30'><polygon points='0.5,0.5 12,8 23.5,0.5 23.5,15 12,23.5 0.5,15' fill='%2322d111' stroke='%2314a309' stroke-width='1' stroke-linejoin='round'/></svg>") left top / 24px 30px repeat-y; }

/* Lower column + bottom strip = ONE L-shaped piece: pale outer line, thicker dark-grey rim on the outer (right/bottom)
   edges, translucent light-grey fill, rounded outer corner (bottom-right) and a rounded/diagonal left end that
   follows the frame notch. Geometry is local to #fx-L (left 500 / top 1342): the column is x 256..301, the strip
   is y 492..533. Green flag: filled chevrons, and the last column chevron merges with the first strip chevron into
   one L-shaped glyph (.Lk) at the corner. */
#fx-L { left: 500px; top: 1342px; width: 301px; height: 533px; }
#fx-L > * { position: absolute; inset: 0; }
#fx-L .Lrim { background: var(--fx-edge); clip-path: path(evenodd, 'M256 0 H296 Q301 0 301 5 V499 A34 34 0 0 1 267 533 H10 Q0 533 4 523 L24 492 H256 Z M256 3 H296 Q298 3 298 5 V499 A31 31 0 0 1 267 530 H11 Q3 530 6 523 L22 495 H256 Z'); }
#fx-L .Ldk  { background: #8a847b;        clip-path: path(evenodd, 'M256 3 H296 Q298 3 298 5 V499 A31 31 0 0 1 267 530 H11 Q3 530 6 523 L22 495 H256 Z M256 3 H287 Q293 3 293 9 V499 A26 26 0 0 1 267 525 H14 L10 516 L22 495 H256 Z'); }
#fx-L .Lf   { background: linear-gradient(90deg, rgba(190,185,178,0.32), rgba(160,155,148,0.32)); clip-path: path('M256 3 H287 Q293 3 293 9 V499 A26 26 0 0 1 267 525 H14 L10 516 L22 495 H256 Z'); }
#fx-L .Lc, #fx-L .Lb { position: absolute; inset: auto; }
#fx-L .Lk { position: absolute; left: 0; top: 0; width: 301px; height: 533px; display: none; }
#flag-fx.fx-green #fx-L .Lk { display: block; }
#flag-fx.fx-yellow #fx-L .Lc { left: 263px; top: 7px; width: 24px; height: 470px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='47'><polygon points='1,1 23,23 23,46 1,24' fill='%23fba81a' stroke='%238a5600' stroke-width='1.5' stroke-linejoin='round'/></svg>") left top / 24px 47px repeat-y; }
#flag-fx.fx-yellow #fx-L .Lb { left: 24px; top: 497px; width: 270px; height: 26px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='26'><polygon points='2,1 18.7,1 38.7,25 22,25' fill='%23fba81a' stroke='%238a5600' stroke-width='1.5' stroke-linejoin='round'/></svg>") left center / 45px 26px repeat-x; }
#flag-fx.fx-green #fx-L .Lc { left: 263px; top: 13px; width: 24px; height: 444px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='30'><polygon points='0.5,0.5 12,8 23.5,0.5 23.5,15 12,23.5 0.5,15' fill='%2322d111' stroke='%2314a309' stroke-width='1' stroke-linejoin='round'/></svg>") left top / 24px 30px repeat-y; }
#flag-fx.fx-green #fx-L .Lb { left: 21px; top: 498px; width: 204px; height: 24px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='24'><polygon points='0.5,12 9,0.5 23.5,0.5 15,12 23.5,23.5 9,23.5' fill='%2322d111' stroke='%2314a309' stroke-width='1' stroke-linejoin='round'/></svg>") left top / 30px 24px repeat-x; }

/* the vertical tab between the two columns: solid colour, soft wide diagonal stripes, rounded corners */
#fx-label { left: 793px; top: 958px; width: 79px; height: 332px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  background: repeating-linear-gradient(45deg, var(--fx-tab-a) 0 30px, var(--fx-tab-b) 30px 60px);
  transform: scale(0.85); transform-origin: left center; }
#fx-label span { writing-mode: vertical-rl; font-size: 50px; line-height: 1; letter-spacing: 3px; white-space: nowrap;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700; }
#flag-fx.fx-yellow #fx-label span { color: #14100a; }
#flag-fx.fx-green  #fx-label span { color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.40); }

/* in (label first, then columns, like the broadcast); out = quick fade */
#flag-fx.fx-yellow #fx-label, #flag-fx.fx-green #fx-label { opacity: 1; transform: scale(1); transition-delay: 0.15s; }
#flag-fx.fx-yellow .fx-col, #flag-fx.fx-yellow #fx-L,
#flag-fx.fx-green  .fx-col, #flag-fx.fx-green  #fx-L { opacity: 1; transition: opacity 0.5s ease 0.5s; }
/* the tab and its columns only show together with the standings board; never float alone (e.g. at race start) */
#flag-fx.fx-nobody #fx-label, #flag-fx.fx-nobody .fx-col, #flag-fx.fx-nobody #fx-L { opacity: 0 !important; transition-delay: 0s !important; }
#header-data.fx-caution #track-name, #header-data.fx-caution #lap-text { text-shadow: 0 0 8px #000, 0 0 3px #000, 0 2px 0 rgba(0,0,0,0.6); }

/* ── Layer 2: standings ──────────────────────────────────────────────────────── */
#standings-data { position: absolute; left: 0; top: 0; width: 798px; height: 1971px; z-index: 2; opacity: 0; transition: opacity 0.3s ease;
  clip-path: inset(0 67px 0 0); }   /* clip at the row's right edge (72+659=731px) so sliding rows never spill over the frame */
#sep10 {
  position: absolute; left: 76px; width: 654px; height: 3px; top: 1190px; display: none;
  background: linear-gradient(90deg, transparent, #22b4d8 6%, #22b4d8 94%, transparent);
  box-shadow: 0 0 8px rgba(34,180,216,0.55);
}
.s-row { position: absolute; left: 72px; width: 659px; overflow: hidden; }
.s-row.is-player { background: rgba(255,255,255,0.11); }
/* Position change: solid colour bar on the left edge fading out to the right (green = gained, red = lost) */
.s-row.swap-gain { z-index: 6; }
.s-row.swap-lose { z-index: 5; }
.s-row.swap-gain::before, .s-row.swap-lose::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 150px; pointer-events: none;
}
.s-row.swap-gain::before { background: linear-gradient(90deg, #2ecc40 0, #2ecc40 8px, rgba(46,204,64,0.62) 8px, rgba(46,204,64,0) 100%); }
.s-row.swap-lose::before { background: linear-gradient(90deg, #e03a3a 0, #e03a3a 8px, rgba(224,58,58,0.62) 8px, rgba(224,58,58,0) 100%); }
 
.s-pos {
  position: absolute; left: 18px; width: 52px; text-align: center; white-space: nowrap;
  top: 50%; transform: translateY(-50%); line-height: 1; color: #ffffff;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 44px;
}
.s-pos-icon { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 100%; }
.s-pos-icon .tri { width: 0; height: 0; }
.s-pos-icon.up   .tri { border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 12px solid #2ecc40; }
.s-pos-icon.down .tri { border-left: 8px solid transparent; border-right: 8px solid transparent; border-top:    12px solid #e84444; }
 
.s-num {
  position: absolute; left: 98px; width: 72px; top: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  /* slightly blue box behind the car number (Fox style) + brighter blue underline */
  background: linear-gradient(180deg, rgba(6,38,84,0.38) 0%, rgba(2,30,66,0.66) 100%);
  box-shadow: inset 0 -3px 0 #2f55e6;
}
.s-num-bg { display: flex; align-items: center; justify-content: center; width: 72px; height: 56px; }
.s-num-img { max-width: 100%; max-height: 50px; width: auto; height: auto; object-fit: contain; display: block; }
.s-num-text {
  display: none; text-align: center; line-height: 1; color: #f5d100;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 40px;
}
 
.s-name {
  position: absolute; left: 196px; width: 306px; top: 50%; transform: translateY(-50%);
  color: #ffffff; white-space: nowrap; overflow: visible; line-height: 1.1;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 43px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.35);
}
.s-name .rk { font-size: 0.62em; color: #c9d3e0; font-weight: 700; text-transform: uppercase; }
 
.s-gap {
  position: absolute; right: 12px; width: 134px; text-align: right; white-space: nowrap;
  top: 50%; transform: translateY(-50%); line-height: 1; color: #ffffff;
  font-family: 'RobotoCondensedBold', 'Roboto Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 40px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.35);
}
.s-gap.long  { font-size: 34px; }
.s-gap.xlong { font-size: 28px; }
.s-gap.pq-leader { color: #f5c518; }
/* Yellow flag: the interval is replaced by the car's manufacturer logo (same right-aligned slot) */
.s-gap.manu { display: flex; align-items: center; justify-content: center; }
.s-manu-img { display: block; max-width: 134px; max-height: 46px; width: auto; height: auto; object-fit: contain;
  transform: scale(1.3); transform-origin: center; }
 
/* ── Layer 3: sponsors — ABOVE the frame, same artwork-sized canvas ──────────── */
#sponsor-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.sp { position: absolute; left: 0; top: 0; width: 798px; height: 1971px; opacity: 0; display: block; }
#sponsor-img { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="scale-root">
    <div id="stage">
 
      <img class="ov" id="overlay-header" src="" alt="">
      <img class="ov" id="overlay-body"   src="" alt="">
 
      <div id="flag-fx">
        <div id="fx-head"></div>
        <div class="fx-col" id="fx-col-top"></div>
        <div id="fx-label"><span id="fx-label-text"></span></div>
        <div id="fx-L"><i class="Lrim"></i><i class="Ldk"></i><i class="Lf"><i class="Lc"></i><i class="Lb"></i><svg class="Lk" viewBox="0 0 301 533" xmlns="http://www.w3.org/2000/svg"><path d="M263 463 L275 471 L287 463 V509 A13 13 0 0 1 274 522 H240 L231 510 L240 498 H263 Z" fill="#22d111" stroke="#14a309" stroke-width="1" stroke-linejoin="round"/></svg></i></div>
      </div>
 
      <div id="header-data">
        <div class="led" id="led-l"></div>
        <div class="led" id="led-r"></div>
        <span id="track-name"></span>
        <span id="lap-text"></span>
      </div>
 
      <div id="standings-data">
        <div id="sep10"></div>
        <!-- 1-10: fixed slots · 11-18: rotating group -->
        <div class="s-row" id="row-1"></div>  <div class="s-row" id="row-2"></div>
        <div class="s-row" id="row-3"></div>  <div class="s-row" id="row-4"></div>
        <div class="s-row" id="row-5"></div>  <div class="s-row" id="row-6"></div>
        <div class="s-row" id="row-7"></div>  <div class="s-row" id="row-8"></div>
        <div class="s-row" id="row-9"></div>  <div class="s-row" id="row-10"></div>
        <div class="s-row" id="row-11"></div> <div class="s-row" id="row-12"></div>
        <div class="s-row" id="row-13"></div> <div class="s-row" id="row-14"></div>
        <div class="s-row" id="row-15"></div> <div class="s-row" id="row-16"></div>
        <div class="s-row" id="row-17"></div> <div class="s-row" id="row-18"></div>
      </div>
 
      <div id="sponsor-layer">
        <img class="sp" id="sponsor-img"      src="" alt="">
        <img class="sp" id="sponsor-img-next" src="" alt="">
      </div>
 
    </div>
  </div>
</div>
 
<script>
// ── Chase highlight ─────────────────────────────────────────────────────────
// The main process tells every overlay which car numbers are in the chase
// (empty list = feature off). Name elements carry data-chase-num.
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
const chaseCls = n => (_CHASE.size && _CHASE.has(chaseKey(n))) ? ' chase' : '';
function _chasePass() {
  document.querySelectorAll('[data-chase-num]').forEach(el =>
    el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(el.dataset.chaseNum)));
}
function _setChase(list) {
  _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey));
  _chasePass();
}
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}
 
// ── PSF bootstrap ─────────────────────────────────────────────────────────
const psf         = window.__PSF || {};
const params      = new URLSearchParams(location.search);
const INSTALL_DIR = psf.installDir || params.get('installdir') || '';
let SERIES_ID     = psf.series || params.get('series') || 'default';
let IS_DEFAULT    = !SERIES_ID || SERIES_ID === 'default';
const WS_URL      = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;
const HTTP_BASE   = psf.assetBase ? psf.assetBase.replace(/\/assets$/, '') : `http://${location.hostname || 'localhost'}:8766`;
 
const SCALE   = Math.max(0.1, Math.min(4.0, parseFloat(psf.scale   || params.get('scale')   || '1.0')));
const OPACITY = Math.max(0.0, Math.min(1.0, parseFloat(psf.opacity || params.get('opacity') || '1.0')));
let VISIBILITY_MODE     = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let SPONSOR_ROTATION_MS = (parseInt(psf.sponsorrotationtime || params.get('sponsorrotationtime') || '10') * 1000) || 10000;
// "Track Name" field of the layout editor — overrides the track name coming from the game.
let customName          = psf.customname ? decodeURIComponent(psf.customname) : (params.get('customname') ? decodeURIComponent(params.get('customname')) : '');
 
(function applyScaleOpacity() {
  const root = document.getElementById('scale-root');
  root.style.transform = `scale(${SCALE})`;
  root.style.opacity   = OPACITY;
})();
 
function encodeRelPath(rel) { return rel.split('/').map(encodeURIComponent).join('/'); }
function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + encodeRelPath(rel);
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + encodeRelPath(rel);
  }
  return encodeRelPath(rel);
}
 
const SKIN_FOLDER = 'FoxIndy2026';
const SKIN_BASE   = assetPath('images/' + SKIN_FOLDER);
 
// ── Tunables ──────────────────────────────────────────────────────────────
const ROOKIE_SUFFIX     = ' - R';   // shown after a rookie's name (use ' (R)' for the other style)
const NUM_BADGE_BG      = false;    // true = paint the driver's colour behind the number image
const ROTATION_MS       = 10000;    // how long each group of 8 (11-18, 19-26 …) stays on screen
// Row boundaries in artwork pixels (the horizontal lines of overlay.png). Row i spans ROW_B[i] → ROW_B[i+1].
const ROW_B = [428, 504, 582, 660, 736, 812, 889, 965, 1042, 1117, 1192, 1268, 1341, 1415, 1489, 1561, 1633, 1703, 1772];
const TOP_ROWS = 10, BOTTOM_ROWS = 8, BOTTOM_GROUP_SIZE = BOTTOM_ROWS;

// ── Frame ────────────────────────────────────────────────────────────────
document.getElementById('overlay-header').src = SKIN_BASE + '/overlay.png';
document.getElementById('overlay-body').src   = SKIN_BASE + '/overlay.png';
 
// ── Sponsor rotation (sponsors/sponsor01.png, sponsor02.png … full-artwork-sized PNGs) ──
let sponsorFiles  = [];
let sponsorIndex  = 0;
let _sponsorTimer = null;
 
async function loadSponsors() {
  let count = 0;
  try {
    const r = await fetch(`${HTTP_BASE}/fox-sponsor-count?base=${SKIN_FOLDER}`);
    if (r.ok) { const j = await r.json(); count = j.count || 0; }
  } catch (_) {}
 
  if (count > 0) {
    sponsorFiles = [];
    for (let i = 1; i <= count; i++) sponsorFiles.push(`${SKIN_BASE}/sponsors/sponsor${String(i).padStart(2, '0')}.png`);
  } else {
    const probes = [];
    for (let i = 1; i <= 20; i++) {
      probes.push(new Promise(res => {
        const img = new Image();
        const src = `${SKIN_BASE}/sponsors/sponsor${String(i).padStart(2, '0')}.png`;
        img.onload  = () => res(src);
        img.onerror = () => res(null);
        img.src = src;
      }));
    }
    sponsorFiles = (await Promise.all(probes)).filter(Boolean);
  }
 
  if (sponsorFiles.length > 0) {
    document.getElementById('sponsor-img').src = sponsorFiles[0];
    if (sponsorFiles.length > 1) startSponsorRotation();
  }
}
 
function startSponsorRotation() {
  if (_sponsorTimer) clearInterval(_sponsorTimer);
  let curr = document.getElementById('sponsor-img');
  let next = document.getElementById('sponsor-img-next');
  _sponsorTimer = setInterval(() => {
    if (sponsorFiles.length < 2) return;
    sponsorIndex = (sponsorIndex + 1) % sponsorFiles.length;
    next.onload = () => {
      next.style.transition = 'opacity 0.8s ease-in-out';
      curr.style.transition = 'opacity 0.8s ease-in-out';
      next.style.opacity = '1';
      curr.style.opacity = '0';
      setTimeout(() => {
        [curr, next] = [next, curr];
        next.style.transition = 'none';
      }, 850);
    };
    next.src = sponsorFiles[sponsorIndex];
  }, SPONSOR_ROTATION_MS);
}
 
// ── Row geometry ─────────────────────────────────────────────────────────
function rowTop(n)    { return ROW_B[n - 1] + 3; }
function rowHeight(n) { return ROW_B[n] - ROW_B[n - 1] - 4; }
function positionRows() {
  for (let n = 1; n <= TOP_ROWS + BOTTOM_ROWS; n++) {
    const el = document.getElementById(`row-${n}`);
    if (!el) continue;
    el.style.top    = rowTop(n) + 'px';
    el.style.height = rowHeight(n) + 'px';
  }

  const lap   = lapInfoText(d);
  const state = (d.sessionState || '').toLowerCase();
  const isRace = (d.session || '').toLowerCase() === 'race';
  const sessL = (d.session || '').toLowerCase();
  const rem   = (d.timeRemaining !== undefined) ? d.timeRemaining : -1;
  const timed = (sessL === 'practice' || sessL === 'qualifying') && rem >= 0;
  const sessLabel = sessL === 'qualifying' ? 'QUALIFYING' : (d.sessionNum === 0 ? 'HAPPY HOUR' : 'PRACTICE');
  const timer = timed ? `${Math.floor(rem / 60)}:${String(Math.floor(rem % 60)).padStart(2, '0')}` : '';
  const mode  = timed ? 'timed'
              : (isRace && (state === 'checkered' || state === 'cool down')) ? 'results'
              : (isRace && isFinalLap(d)) ? 'final' : 'normal';
  const key   = mode + '|' + (timed ? sessLabel + '|' + timer : track + '|' + lap);
  if (key === _lastHeaderKey) return;
  _lastHeaderKey = key;
 
  const trackEl = document.getElementById('track-name');
  const lapEl   = document.getElementById('lap-text');
  const hd = document.getElementById('header-data');
  hd.classList.toggle('mode-final',   mode === 'final');
  hd.classList.toggle('mode-results', mode === 'results');
  hd.classList.toggle('mode-timed',   mode === 'timed');
  if (mode === 'timed') {
    const TPX = 64, TW = textW(timer, TPX);
    lapEl.textContent = timer; lapEl.style.fontSize = TPX + 'px';
    trackEl.textContent = sessLabel; trackEl.style.fontSize = fitPx(sessLabel, 46, 592 - TW - 36, 26) + 'px';
    return;
  }
  if (mode !== 'normal') {
    const txt = mode === 'final' ? 'FINAL LAP' : 'OFFICIAL RESULTS';
    trackEl.textContent = txt;
    trackEl.style.fontSize = fitPx(txt, 52, 592, 26) + 'px';
    lapEl.textContent = '';
    return;
  }
  const AVAIL = 592, GAP = 36;                       // x 104 → 696 between the two LEDs
  // "44/95": current lap big, "/95" smaller and dimmer
  const mm = /^(\d+)\/(\d+)$/.exec(lap);
  let lapPx, lapW;
  if (mm) {
    const SUB = 1;
    const wAt = px => textW(mm[1], px) + textW('/' + mm[2], px * SUB);
    lapPx = 52;
    if (wAt(52) > 300) lapPx = Math.max(28, Math.floor(52 * 300 / wAt(52)));
    lapW = wAt(lapPx);
    lapEl.innerHTML = `${mm[1]}<span style="font-size:${SUB}em;color:#c9d3e0">/${mm[2]}</span>`;
  } else {
    lapPx = fitPx(lap, 52, 300, 28);
    lapW  = textW(lap, lapPx);
    lapEl.textContent = lap;
  }
  lapEl.style.fontSize = lapPx + 'px';
  const trackPx = fitPx(track, 52, AVAIL - lapW - GAP, 26);
  trackEl.textContent = track; trackEl.style.fontSize = trackPx + 'px';
}
 
function setBodyVisible(v) {
  const o = v ? '1' : '0';
  document.getElementById('overlay-body').style.opacity   = o;
  document.getElementById('standings-data').style.opacity = o;
  document.getElementById('flag-fx').classList.toggle('fx-nobody', !v);
}
 
// ── Session-change detection ──────────────────────────────────────────────
let _lastSessionCookie = null;
let _lastStandingsKey = '';
function checkSessionChange(d) {
  const cookie = d.sessionCookie;
  if (cookie == null || cookie === _lastSessionCookie) return;
  _lastSessionCookie = cookie;
  _sessionGen++;
  _prevOrder = []; _prevBottomOrder = []; _prevBottomGroupIdx = -1;
  _animatingRows = new Set(); _lastStandingsKey = ''; _rotGroupIdx = 0; _driverColors = {};
  _carmakeByIdx = {}; _manuOverrides = new Set(); _manuFail = new Set();
  _lastHeaderKey = '';
  _fxMode = null; _fxSawRacing = false; clearTimeout(_fxGreenTimer); setFx('');
  for (let i = 1; i <= TOP_ROWS + BOTTOM_ROWS; i++) {
    const el = document.getElementById(`row-${i}`);
    if (el) { el.innerHTML = ''; el.className = 's-row'; el.dataset.caridx = ''; el.style.transform = ''; el.style.opacity = '1'; }
  }
  document.getElementById('sep10').style.display = 'none';
  setBodyVisible(false);
}
 
// ── Main data handler ─────────────────────────────────────────────────────
let _latestData = null;
let _preview = false;
 
function handleData(d) {
  const app = document.getElementById('app');
  if (!_preview) {
    if (!d.atTrack) { app.style.display = 'none'; return; }
    if (VISIBILITY_MODE === 'in_car' && !d.player?.inCar) { app.style.display = 'none'; return; }
    app.style.display = '';
  }
  _latestData = d;
  checkSessionChange(d);
  if (d.driverColors) _driverColors = d.driverColors;
  if (d.driverManuOverrides) _manuOverrides = new Set(d.driverManuOverrides.map(String));
  buildManuMap(d);
 
  updateLeds(d);
  updateFlagFx(d);
  updateHeaderText(d);
 
  const session      = (d.session || '').toLowerCase();
  const playerCarIdx = d.playerCarIdx ?? -1;
  const standings    = getStandings(d);
  if (!standings.length) { setBodyVisible(false); return; }
  setBodyVisible(true);
 
  const lapTracker = d.lapTracker || {};
  const key = standings.map(s => s.carIdx).join(',');
  if (key !== _lastStandingsKey) {
    _lastStandingsKey = key;
    renderStandings(standings, session, playerCarIdx, lapTracker);
  } else {
    updateGaps(standings, session, lapTracker);
  }
}
 
// ── Live editor preview ───────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (typeof e.data !== 'string') return;
  try {
    const m = JSON.parse(e.data);
    if (Array.isArray(m._chase)) _setChase(m._chase);   // chase list rides along with the preview data: apply it, but keep rendering
    if (m.reset) return;
    _preview = true;
    document.getElementById('app').style.display = '';
    if (m._visibilityMode      !== undefined) VISIBILITY_MODE = m._visibilityMode;
    if (m._sponsorRotationTime !== undefined) SPONSOR_ROTATION_MS = parseInt(m._sponsorRotationTime) * 1000;
    if (m._series !== undefined) { SERIES_ID = m._series; IS_DEFAULT = !SERIES_ID || SERIES_ID === 'default'; }
    if (m._customName !== undefined) { customName = m._customName; _lastHeaderKey = ''; }
    if (_latestData && m._customName !== undefined && m.standings === undefined) { updateHeaderText(_latestData); return; }
    handleData(m);
  } catch (_) {}
});
 
// ── WebSocket ─────────────────────────────────────────────────────────────
let ws;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onmessage = e => { try { handleData(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
 
// ── Boot ──────────────────────────────────────────────────────────────────
positionRows();
loadSponsors();
startRotation();
if (document.fonts && document.fonts.ready) {
  // Names are fitted with canvas measurements — redo them once the real font is available.
  document.fonts.ready.then(() => { _lastStandingsKey = ''; _lastHeaderKey = ''; if (_latestData) handleData(_latestData); });
}
</script>
