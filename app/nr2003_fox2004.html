<!DOCTYPE html>

<title>NR2003 Fox 2004 Ticker</title>
<style>
.chase { background: #f5d100 !important; color: #111 !important; text-shadow: none !important;
         box-shadow: -3px 0 0 #f5d100, 3px 0 0 #f5d100; }
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'Fox2004', 'Eurostile Extended', 'Arial Black', 'Segoe UI Black', Verdana, sans-serif;
  /* position-cell shape (pos_cell.png) used as a mask */
  --cell-mask: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEQAAAAnCAMAAACBrR50AAAAAXNSR0IB2cksfwAAAAlwSFlzAAAuIwAALiMBeKU/dgAAAXpQTFRF////////////////////////////////////////////////////////////AAAA////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////weSjoQAAAH50Uk5TfJaSkJeHi4yJiIqNjlsSAP/+S+v9tQS5vj2h9EFU+PeTOcOtDxal+uBNdPJgCAMx4dUzscZGBu37ugUsxQcbmfFudugRAi7lJ9dYa95vPObBGeca7HPjniQr8w0gYWqEQCbvDn1QzpQdFNndI4/uUfybyKMoFUrMnzvPNUxTPkrDGgAAAcVJREFUeJyd1d9LU2EYB/D3u03Kn7O82Mi8GFZTk5wbDAaFImOC5EUxJhjEIEER/x6hGxEGCU4UJBZ6IQiOKNE1ceAPmhFUmqg0aThp1sb2vLsQDvF9OPC+7znP+bxfOOdwoFCoK3NhKB75wkKV6q/pj7pWsJQuX6hq3Vg423i9878KyFfmTXmDToOyADmN2HJGrQZ1E1mN3MFvUqm7lP3RggxnWHGmkzhwSiZpwrEg94EjDrHjuyDWZnwjo9zF1zLyCPhCIo60TtKKzyRyD3uCOD9175KKKS+IMj/YIZF2pATpxDaJ3G7eEqQLOTKKC5uCKA82yChu03oZ8QIfSMSV0El86Z8k4kNckIe3sEYqT05SZUT1YJVEerEiSF+S/ZL7Pp4L4l+ykIh/ziqICmCZVPrxTpABxEjEY38ryOD7ExIJ3FgUxNn2i3w+bc79VBlRz5IHZJSqp/OCODvnScTmjgkSTCdIxOOICqJCmCWVIcwIMow3JPICEUGCNRESebmQEcTb8YN8acOYEkTVh6bIKK+gETUSJf/sGNFI8DBOJql9XEkyitekMlZBxjFJIoEKMoHzhulwcZbJ2qeNbgqXBt3z/B/Vh2OUiq6bHwAAAABJRU5ErkJggg==");
}

body { background: transparent; width: 1456px; height: 516px; overflow: hidden; font-family: var(--font); font-weight: 900; }

#scale-root { position: relative; width: 1456px; height: 516px; transform-origin: top left; visibility: hidden; }

/* ── Artwork ─────────────────────────────────────────────────────────── */
#bg-layer { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .2s ease; }
#bg-img { position: absolute; left: 0; top: 0; width: 1456px; height: 129px; display: block; }

/* flag band (drawn above the running order, below nothing) */
#flag-layer { position: absolute; inset: 0; z-index: 3; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
#flag-layer img, #flag-red { position: absolute; left: 0; top: 0; width: 1456px; height: 150px; display: block;
                             opacity: 0; transition: opacity .35s ease; }
#flag-layer img.on, #flag-red.on { opacity: 1; }
#flag-layer img, #flag-red { transform-origin: 50% 51.5px; }
/* red flag: the green band's shape filled red */
#flag-red { background: linear-gradient(#ff5a4d 0%, #e01a10 50%, #a30c05 100%);
            -webkit-mask: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABbAAAACWAgMAAABye0akAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAlQTFRFAAAAAAAAJK8Albin2gAAAAN0Uk5TAP//RFDWIQAAAWdJREFUeJzt2EERwDAMxMAaZEmWZMpCeXgXwY1+9jxk5vaATcQOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdmje2wsWme/2gj2O2B2xQ2KHxA6JHRI7JHZI7JDYoeNcD3lEhcQOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjv0Aw8oEdsdG4EIAAAAAElFTkSuQmCC") 0 0 / 1456px 150px no-repeat;
                    mask: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABbAAAACWAgMAAABye0akAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAlQTFRFAAAAAAAAJK8Albin2gAAAAN0Uk5TAP//RFDWIQAAAWdJREFUeJzt2EERwDAMxMAaZEmWZMpCeXgXwY1+9jxk5vaATcQOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdmje2wsWme/2gj2O2B2xQ2KHxA6JHRI7JHZI7JDYoeNcD3lEhcQOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjskdkjskNghsUNih8QOiR0SOyR2SOyQ2CGxQ2KHxA6JHRI7JHZI7JDYIbFDYofEDokdEjv0Aw8oEdsdG4EIAAAAAElFTkSuQmCC") 0 0 / 1456px 150px no-repeat; }

/* collapsed ticker (pre-race / yellow flag): gaps row removed, NASCAR FOX + lap plate slide up against the band */
#bg-img { transition: clip-path .35s ease; }
#bg-img2 { position: absolute; left: 0; top: 0; width: 1456px; height: 129px; display: block; opacity: 0;
           clip-path: inset(88px 0 0 0); transition: transform .35s ease, opacity .2s ease; }
#scale-root.collapsed #bg-img  { clip-path: inset(0 0 71px 0); }
#scale-root.collapsed #bg-img2 { opacity: 1; transform: translateY(-30px); }
#scale-root.collapsed #lap-plate { top: 59px; }
#scale-root.collapsed #nf-logo   { top: 62px; }
#nf-logo { transition: top .35s ease; }

/* Semáforo de bandera (bajo el ticker): amarilla = lámparas amarillas alternando; verde = verde fija unos segundos */
#semaforo { position: absolute; left: 150px; top: 129px; width: 218px; height: 80px; pointer-events: none;
            visibility: hidden; transition: top .35s ease, visibility 0s linear .3s; }
#scale-root.collapsed #semaforo { top: 99px; }
#semaforo.show { visibility: visible; transition: top .35s ease, visibility 0s; }
#sem-in { position: absolute; left: 0; top: 0; width: 218px; height: 80px; isolation: isolate;
          transform: translateX(-380px); transition: transform .22s ease-in; }
#semaforo.show #sem-in { transform: none; transition: transform .22s ease-out; }
#sem-img { position: absolute; left: 0; top: 0; width: 218px; height: 80px; display: block; }
.sem-lamp { position: absolute; top: 40px; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
            opacity: 0; mix-blend-mode: screen; will-change: opacity; }
.sem-lamp.y { background: radial-gradient(circle, #ffffff 0%, #fffdc8 24%, #fff45e 47%, #ffdf1c 65%, rgba(255,214,0,0) 77%);
              box-shadow: 0 0 16px 7px rgba(255,236,70,.5); }
.sem-lamp.g { background: radial-gradient(circle at 34% 40%, #eafff0 0%, #8affa0 13%, #22d24f 46%, #0a8f2d 70%, rgba(10,143,45,0) 74%);
              box-shadow: 0 0 11px 4px rgba(40,255,90,.45); }
#sem-y1 { left: 36px; }  #sem-y2 { left: 109px; }  #sem-g { left: 181px; }
@keyframes semBlinkA { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
@keyframes semBlinkB { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
#semaforo.yellow #sem-y1 { animation: semBlinkA .3333s step-end .15s infinite backwards; }
#semaforo.yellow #sem-y2 { animation: semBlinkB .3333s step-end .15s infinite backwards; }
#semaforo.green  #sem-g  { opacity: 1; }

/* flag-change effect: light flare in the middle of the band that stretches into a streak (see playFlagFx) */
#flag-fx { position: absolute; left: 0; top: 46px; width: 1456px; height: 12px; pointer-events: none; z-index: 5;
          --fx-core: #fffbd0; --fx-glow: #ffe600; }
#flag-fx .fx-streak { position: absolute; left: 0; top: 1px; width: 1456px; height: 10px; opacity: 0; transform: scaleX(.05);
  transform-origin: 50% 50%; will-change: transform, opacity;
  background: linear-gradient(90deg, transparent 0%, var(--fx-glow) 14%, var(--fx-core) 50%, var(--fx-glow) 86%, transparent 100%);
  box-shadow: 0 0 9px 2px var(--fx-glow); filter: blur(.5px); }
#flag-fx .fx-core { position: absolute; top: -9px; width: 220px; height: 30px; margin-left: -110px; opacity: 0; will-change: transform, opacity;
  background: radial-gradient(ellipse at center, #fff 0%, var(--fx-core) 18%, var(--fx-glow) 42%, rgba(255,255,255,0) 72%); }

/* ── Data ────────────────────────────────────────────────────────────── */
#data-layer { position: absolute; inset: 0; z-index: 2; visibility: hidden; }

/* running order: clipped by the slanted edge of the left plate */
#strip { position: absolute; left: 0; top: 0; width: 1456px; height: 129px;
         clip-path: polygon(300px 22px, 1456px 22px, 1456px 88px, 350px 88px); }
#track { position: absolute; left: 0; top: 22px; display: flex; align-items: flex-start; white-space: nowrap; will-change: transform; }
.entry { flex: 0 0 auto; display: flex; flex-direction: column; margin-right: 120px; }
.e-top { height: 24px; display: flex; align-items: center; }
.e-bot { height: 50px; padding-top: 16px; display: flex; align-items: flex-start; transition: opacity .25s ease; }
#strip.no-gaps .e-bot { opacity: 0; }

/* position cell: dark outline + light rim + gold fill, all shaped by pos_cell.png */
.e-pos { position: relative; width: 58px; height: 22px; margin-right: 9px; flex: 0 0 auto;
         display: flex; align-items: center; justify-content: center; }
.e-pos .nb-d, .e-pos .nb-h, .e-pos .nb-c { position: absolute;
  -webkit-mask: var(--cell-mask) center / 100% 100% no-repeat; mask: var(--cell-mask) center / 100% 100% no-repeat; }
.e-pos .nb-d { inset: -2px; background: #000; }
.e-pos .nb-h { inset: 0;    background: rgba(255,240,170,.9); }
.e-pos .nb-c { inset: 1.5px; background: linear-gradient(#f9d54f 0%, #e7b81c 55%, #c99a0c 100%); }
.e-pos span { position: relative; font-size: 18px; line-height: 1; color: #15120a; letter-spacing: .01em; }

.e-name { font-size: 21px; line-height: 1; color: #f2f2f2; text-transform: uppercase; letter-spacing: .03em;
          text-shadow: 0 2px 2px rgba(0,0,0,.7); }
.e-name .rk { font-size: .72em; opacity: .85; letter-spacing: .02em; }
.e-gap-pad { width: 0; flex: 0 0 auto; }               /* aligns the gap with the start of the name */
.e-gap { font-size: 19px; line-height: 1; color: #c4c4c4; letter-spacing: .03em; text-shadow: 0 1px 1px rgba(0,0,0,.8); }

/* running-order title (start of the loop) */
.e-title { font-size: 21px; line-height: 1; color: #f2f2f2; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap;
           padding-right: 100px; text-shadow: 0 2px 2px rgba(0,0,0,.7); }

/* loop marker (leader starts after it) */
.sep-flag { width: 30px; height: 22px; margin-right: 120px;
  background: conic-gradient(#f4f4f4 25%, #151515 0 50%, #f4f4f4 0 75%, #151515 0) 0 0 / 11px 11px;
  border: 1px solid #000; }
.sep-gap { width: 30px; margin-right: 120px; }

/* "BEHIND LEADER" (left black block) */
#gap-label { position: absolute; left: 44px; top: 62px; width: 270px; font-size: 22px; line-height: 1; color: #fff;
             letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; transition: opacity .25s ease; }
#gap-label.hide { opacity: 0; }

/* sponsor (top-left translucent plate) */
#sponsor-zone { position: absolute; left: 10px; top: 4px; width: 262px; height: 42px; overflow: hidden;
                display: flex; align-items: center; justify-content: center; }
#sponsor-zone img { position: absolute; left: 0; top: 0; width: 262px; height: 42px; object-fit: contain; object-position: center;
                    opacity: 0; transition: opacity .8s ease-in-out; }
#sponsor-zone img.on { opacity: 1; }

/* NASCAR on FOX logo (bottom-left) */
#nf-logo { position: absolute; left: 112px; top: 92px; height: 28px; display: flex; align-items: center; gap: 5px; }
#nf-logo img { height: 28px; display: block; }
#nf-logo .on  { font-size: 13px; color: #fff; font-style: italic; letter-spacing: 0; position: relative; top: 5px; }
#nf-logo .fox { font-size: 29px; color: #fff; letter-spacing: -.04em; transform: scaleX(.88); transform-origin: left center; font-family: 'Arial Black', Impact, sans-serif; }
#nf-logo.custom .on, #nf-logo.custom .fox { display: none; }

/* lap / state plate (bottom parallelogram) */
#lap-plate { position: absolute; left: 351px; top: 89px; width: 384px; height: 36px;
             clip-path: polygon(0 0, 354px 0, 384px 36px, 30px 36px);
             background: repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 2px, rgba(255,255,255,0) 2px 5px),
                         linear-gradient(#f0f0f0, #c9c9c9 55%, #a9a9a9);
             display: flex; align-items: center; justify-content: center; transition: background .25s, top .35s ease; }
#lap-plate.red { background: linear-gradient(#ff8c82, #e33a2d 55%, #a50e06); }
#lap-plate.red #lap-text { color: #fff; }
#lap-text { font-size: 29px; line-height: 1; white-space: nowrap; color: #14161a; letter-spacing: .09em; text-transform: uppercase; word-spacing: .4em;
            padding-top: 1px; padding-left: .09em; transform: scaleX(1.1); transform-origin: center; }
#lap-text .sm { font-size: .9em; letter-spacing: .13em; }   /* "OF" / "TO GO" más pequeños que LAP y los números, como en Fox */
/* placa dorada: UNOFFICIAL RESULTS */
#lap-plate.gold { background: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 2px, rgba(255,255,255,0) 2px 5px),
                              linear-gradient(#ffe786, #f2c12a 55%, #c99608); }
#scale-root.results #semaforo { visibility: hidden !important; }

/* tablero de resultados: franja de cuadros al acercarse a meta; cada fila aparece cuando ese coche cruza la línea */
#results-board { position: absolute; left: 127px; top: 103px; width: 380px; z-index: 2; pointer-events: none;
                 visibility: hidden; opacity: 0; transform: translateX(-30px);
                 transition: transform .3s ease-out, opacity .3s ease-out, visibility 0s linear .3s; }
#results-board.show { visibility: visible; opacity: 1; transform: none; transition: transform .3s ease-out, opacity .3s ease-out, visibility 0s; }
#rb-checker { height: 30px; margin-bottom: 4px; box-sizing: border-box; border: 1px solid #000;
              background: conic-gradient(#f4f4f4 25%, #151515 0 50%, #f4f4f4 0 75%, #151515 0) 0 0 / 30px 30px; }
.rb-row { display: flex; align-items: center; height: 34px; margin-bottom: 3px; padding-left: 3px; box-sizing: border-box;
          background: linear-gradient(90deg, rgba(6,6,6,.9), rgba(22,22,22,.84)); animation: rbIn .3s ease-out; }
@keyframes rbIn { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
#results-board .e-pos { width: 58px; height: 28px; margin-right: -3px; }   /* posición y número casi pegados, como en Fox */
#results-board .e-pos span { font-size: 26px; }
#results-board .e-numwrap { position: relative; margin: 0 14px 0 0; height: 28px; width: 58px; flex: 0 0 auto;
                            display: flex; align-items: center; justify-content: center; }
#results-board .e-numwrap .nb-d, #results-board .e-numwrap .nb-h, #results-board .e-numwrap .nb-c { position: absolute;
  -webkit-mask: var(--cell-mask) center / 100% 100% no-repeat; mask: var(--cell-mask) center / 100% 100% no-repeat; }
#results-board .e-numwrap .nb-d { inset: -2px; background: #07080a; }
#results-board .e-numwrap .nb-h { inset: 0; background: rgba(255,255,255,.7); }
#results-board .e-numwrap .nb-c { inset: 1.5px; }
#results-board .e-numwrap img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: contain; object-position: center; display: block; }
#results-board .e-numfb { position: relative; font-size: 24px; line-height: 1; transform: skewX(-8deg); letter-spacing: .01em; }
.rb-name { font-size: 29px; line-height: 1; color: #fff; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
           text-shadow: 0 2px 2px rgba(0,0,0,.7); }
</style>
</head>

<script>
// ── Chase highlight ─────────────────────────────────────────────────────────
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
function chaseMark(el, n) {
  if (!el) return;
  const k = chaseKey(n);
  el.dataset.chaseNum = k;
  el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(k));
}
function _chasePass() {
  document.querySelectorAll('[data-chase-num]').forEach(el =>
    el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(el.dataset.chaseNum)));
}
function _setChase(list) {
  _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey));
  _chasePass();
}
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}

// ── PSF bootstrap ───────────────────────────────────────────────────────────
const psf           = window.__PSF || {};
const params        = new URLSearchParams(location.search);
const INSTALL_DIR   = psf.installDir || params.get('installdir') || '';
const SCALE         = parseFloat(psf.scale   || params.get('scale')   || '1');
const OPACITY       = parseFloat(psf.opacity || params.get('opacity') || '1');
const WS_URL        = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;
let   ROTATION_MS   = (parseInt(psf.sponsorrotationtime || params.get('sponsorrotationtime') || '10')) * 1000;
let VISIBILITY_MODE = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let SCROLL_SPEED    = parseFloat(psf.scrollspeed || params.get('scrollspeed') || '80');
let DNF_DISPLAY     = psf.dnfdisplay || params.get('dnfdisplay') || 'reason';
// Race name shown at the start of the running order ("DAYTONA 500 RUNNING ORDER"). Edit it in the layout editor
// ("Race Name"); if left empty the track name from the sim is used.
let customName = psf.customname ? decodeURIComponent(psf.customname)
               : (params.get('customname') ? decodeURIComponent(params.get('customname')) : '');
let _trackShort = '';
const SHOW_TITLE = true;                 // false = checkered-flag marker instead of the title
const TITLE_SUFFIX = 'RUNNING ORDER';


// Lap counter switches from "LAP X OF Y" to "N TO GO" once this fraction of the race is done.
const TO_GO_FROM = 0.75;

function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + rel;
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + rel;
  }
  return rel;
}
const FOX_BASE = assetPath('images/Fox2004');

// Optional font: drop a font.ttf into images/Fox2004 to replace the fallback (e.g. Eurostile Extended Bold).
(function injectFonts() {
  const el = document.createElement('style');
  el.textContent = `@font-face { font-family:'Fox2004'; src:url('${FOX_BASE}/font.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }`;
  document.head.appendChild(el);
})();

// ── Scale ───────────────────────────────────────────────────────────────────
const root = document.getElementById('scale-root');
root.style.transform = `scale(${SCALE})`;
document.body.style.width  = Math.round(1456 * SCALE) + 'px';
document.body.style.height = Math.round(516  * SCALE) + 'px';

// ── Visibility ──────────────────────────────────────────────────────────────
let _preview = false;
function checkVisibility(d) {
  if (_preview) return true;
  switch (VISIBILITY_MODE) {
    case 'always': return true;
    case 'in_car': return !!(d.atTrack && d.player?.inCar);
    default:       return !!d.atTrack;
  }
}
let _wasVisible = false;
function setVisible(v) {
  if (v && !_wasVisible && loopWidth > 0) {   // reaparece: el título vuelve a entrar desde la derecha
    scrollX = START_X; track.style.transform = `translate3d(${scrollX}px,0,0)`;
  }
  _wasVisible = v;
  if (!v && typeof semHide === 'function') semHide();
  root.style.visibility = v ? 'visible' : 'hidden';
  document.getElementById('bg-layer').style.opacity   = v ? OPACITY : '0';
  document.getElementById('flag-layer').style.opacity = v ? OPACITY : '0';
  document.getElementById('data-layer').style.visibility = v ? 'visible' : 'hidden';
}

// ── Artwork overrides: files in images/Fox2004 replace the embedded defaults ─
function overrideImg(id, file, onOk) {
  const probe = new Image();
  probe.onload = () => { document.getElementById(id).src = probe.src; if (onOk) onOk(); };
  probe.src = FOX_BASE + '/' + file;
}
const _bg2 = document.getElementById('bg-img2'), _bg1 = document.getElementById('bg-img');
_bg2.src = _bg1.src;                       // second copy of the art, used for the collapsed lower row
overrideImg('bg-img',      'background.png', () => { _bg2.src = _bg1.src; });
overrideImg('flag-green',  'greenflag.png');
overrideImg('flag-yellow', 'yellowflag.png');
overrideImg('nf-img',      'nascar_fox.png', () => document.getElementById('nf-logo').classList.add('custom'));

// ── Rotating sponsor (top-left) ─────────────────────────────────────────────
// Put sponsor01.png … sponsor20.png in images/Fox2004/sponsors
let _sponsors = [], _sIdx = 0, _sFront = 'a';
async function loadSponsors() {
  const probes = [];
  for (let i = 1; i <= 20; i++) {
    probes.push(new Promise(res => {
      const img = new Image();
      const src = `${FOX_BASE}/sponsors/sponsor${String(i).padStart(2, '0')}.png`;
      img.onload  = () => res(src);
      img.onerror = () => res(null);
      img.src = src;
    }));
  }
  _sponsors = (await Promise.all(probes)).filter(Boolean);
  if (!_sponsors.length) return;
  const a = document.getElementById('sponsor-a');
  a.src = _sponsors[0]; a.classList.add('on');
  if (_sponsors.length > 1) startSponsorTimer();
}
let _sponsorTimer = null;
function startSponsorTimer() {
  if (_sponsorTimer) clearInterval(_sponsorTimer);
  _sponsorTimer = setInterval(nextSponsor, ROTATION_MS);
}
function nextSponsor() {
  _sIdx = (_sIdx + 1) % _sponsors.length;
  const front = document.getElementById('sponsor-' + _sFront);
  const backId = _sFront === 'a' ? 'b' : 'a';
  const back  = document.getElementById('sponsor-' + backId);
  back.onload = () => { back.classList.add('on'); front.classList.remove('on'); _sFront = backId; back.onload = null; };
  back.src = _sponsors[_sIdx];
}

// ── Flag band + lap plate ───────────────────────────────────────────────────
const lapPlate = document.getElementById('lap-plate');
const lapText  = document.getElementById('lap-text');
const gapLabel = document.getElementById('gap-label');
const stripEl  = document.getElementById('strip');
const flagEls  = { green: document.getElementById('flag-green'), yellow: document.getElementById('flag-yellow'), red: document.getElementById('flag-red') };

const LAP_MAX_W = 300, LAP_STRETCH = 1.1;   // ancho máximo del texto en la placa (ya con el estirado horizontal)
function fitPlate() {
  let size = 29;
  lapText.style.fontSize = size + 'px';
  while (lapText.scrollWidth * LAP_STRETCH > LAP_MAX_W && size > 12) { size -= 1; lapText.style.fontSize = size + 'px'; }
}
// "LAP 23 OF 200" -> OF pequeño; "52 TO GO" -> TO GO pequeño
function plateHTML(t) {
  const e = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return e.replace(/^(LAP \d+) OF (\d+)$/, '$1 <span class="sm">OF</span> $2')
          .replace(/^(\d+) TO GO$/, '$1 <span class="sm">TO GO</span>');
}
let _plateTxt = '', _plateCls = '';
function setPlate(txt, cls) {
  if (txt !== _plateTxt) { _plateTxt = txt; lapText.innerHTML = plateHTML(txt); fitPlate(); }
  if (cls !== _plateCls) { _plateCls = cls; lapPlate.className = cls; }
}

const FLAG_FX_ON_START = true;          // también al arrancar la carrera (pasa de pre-carrera a 'racing' con bandera verde)
const FLAG_FX_X    = 0.5;                  // horizontal position of the flare (0 = left edge, 1 = right edge)
const FLAG_FX_PULSES = 3, FLAG_FX_PULSE_MS = 330;
const FLAG_FX_COLORS = { green: { core: '#d9ffd0', glow: '#58ff3c' }, yellow: { core: '#fffbd0', glow: '#ffe800' } };
const fxBox    = document.getElementById('flag-fx');
const fxStreak = fxBox.querySelector('.fx-streak');
const fxCore   = fxBox.querySelector('.fx-core');
let _fxAnims = [];
function playFlagFx(name) {
  _fxAnims.forEach(a => { try { a.cancel(); } catch (_) {} });
  _fxAnims = [];
  const c = FLAG_FX_COLORS[name] || FLAG_FX_COLORS.yellow;
  fxBox.style.setProperty('--fx-core', c.core);
  fxBox.style.setProperty('--fx-glow', c.glow);
  fxCore.style.left = (FLAG_FX_X * 100) + '%';
  const D = FLAG_FX_PULSE_MS, N = FLAG_FX_PULSES;
  for (let k = 0; k < N; k++) {
    const f = (k + 1) / N;                               // 0.33, 0.66, 1  → pulses get stronger
    const last = k === N - 1;
    const delay = k * D;
    _fxAnims.push(fxCore.animate([
      { opacity: 0,        transform: 'scale(.3,.5)' },
      { opacity: .75 + .25 * f, transform: 'scale(1,1)', offset: .25 },
      { opacity: .45 * f,  transform: 'scale(' + (1.8 + f) + ',.9)', offset: .6 },
      { opacity: 0,        transform: 'scale(' + (2.6 + f) + ',.6)' }
    ], { duration: D * (last ? 1.5 : 1), delay, easing: 'ease-out' }));
    _fxAnims.push(fxStreak.animate([
      { opacity: 0,  transform: 'scaleX(.05)' },
      { opacity: 1,  transform: 'scaleX(' + (.25 + .2 * f) + ')', offset: .3 },
      { opacity: 1,  transform: 'scaleX(' + (.6 + .4 * f) + ')',  offset: .62 },
      { opacity: last ? .55 : .15, transform: 'scaleX(1)', offset: .85 },
      { opacity: 0,  transform: 'scaleX(1)' }
    ], { duration: D * (last ? 1.5 : 1), delay, easing: 'ease-out' }));
  }
  // the band itself brightens and thickens a little on each pulse
  const band = [flagEls.green, flagEls.yellow, flagEls.red];
  band.forEach(el => {
    for (let k = 0; k < N; k++) {
      const f = (k + 1) / N;
      _fxAnims.push(el.animate([
        { filter: 'brightness(1)', transform: 'scaleY(1)' },
        { filter: 'brightness(' + (1.35 + .45 * f) + ') saturate(1.15)', transform: 'scaleY(' + (1.25 + .2 * f) + ')', offset: .45 },
        { filter: 'brightness(1)', transform: 'scaleY(1)' }
      ], { duration: D * (k === N - 1 ? 1.5 : 1), delay: k * D, easing: 'ease-in-out' }));
    }
  });
}

function sampleCorners(img) {

    const g = c.getContext('2d', { willReadFrequently: true });

  const first = !_resSnap;
  if (first) { _resSnap = {}; live.forEach(e => { _resSnap[e.carIdx] = lapsOf(e); }); }
  const done = new Set(_resOrder.map(e => e.carIdx));
  if (first) { _resOrder.push(live[0]); done.add(live[0].carIdx); }          // el líder acaba de cruzar
  for (let i = 1; i < live.length && _resOrder.length < RESULTS_ROWS; i++) {   // los demás, por orden de posición, al cruzar
    const e = live[i];
    if (done.has(e.carIdx)) continue;
    const l = lapsOf(e);
    if ((lt > 0 && l >= lt) || l > (_resSnap[e.carIdx] || 0)) { _resOrder.push(e); done.add(e.carIdx); }
  }
  for (let k = rbRows.children.length; k < Math.min(_resOrder.length, RESULTS_ROWS); k++)
    rbRows.insertAdjacentHTML('beforeend', rbRowHTML(k, _resOrder[k]));
}

// ── Semáforo de bandera ───────────────────────────────────────────────
const FLAG_LIGHT = true;            // semáforo bajo el ticker
const FLAG_LIGHT_GREEN_MS = 2800;   // tiempo que permanece con la verde encendida antes de desaparecer
const semEl = document.getElementById('semaforo');
let _semTimer = null;
function semShow(mode) {            // 'yellow' (parpadea mientras dure) | 'green' (unos segundos y desaparece)
  clearTimeout(_semTimer);
  semEl.classList.remove('yellow', 'green');
  semEl.classList.add(mode, 'show');
  if (mode === 'green') _semTimer = setTimeout(semHide, FLAG_LIGHT_GREEN_MS);
}
function semHide() {
  clearTimeout(_semTimer);
  semEl.classList.remove('show');   // se desliza hacia la izquierda
  _semTimer = setTimeout(() => semEl.classList.remove('yellow', 'green'), 320);
}

let _flagCls = '', _wasPreRace = false;
function setFlag(name) {            // 'green' | 'yellow' | 'red'
  if (name === _flagCls) return;
  const first = _flagCls === '';    // no effect on the very first paint
  _flagCls = name;
  for (const k in flagEls) flagEls[k].classList.toggle('on', k === name);
  if (FLAG_FX && !first && FLAG_FX_FOR.includes(name)) playFlagFx(name);
  if (FLAG_LIGHT) {
    if (name === 'yellow') semShow('yellow');
    else if (name === 'green' && !first) semShow('green');   // en la salida (verde ya puesta) no sale
    else semHide();
  }
  if (!first && (name === 'yellow' || name === 'green')) playFlagSound();   // no suena en el primer pintado (app abierta con la bandera ya puesta)
}

// Chequered flag / winner only after the LEADER has crossed the line (see Fox 2010).
let _finishLatched = false;
function _leaderTrkPct(d) {
  const lead = (d.liveStandings || d.standings || [])[0];
  if (!lead || lead.carIdx === undefined) return null;
  const opp = (d.opponents || []).find(o => o.carIdx === lead.carIdx);
  if (opp && typeof opp.trkPct === 'number') return opp.trkPct;
  if (d.playerCarIdx === lead.carIdx && d.player && typeof d.player.trkPct === 'number') return d.player.trkPct;
  return null;
}
function updateFinishLatch(d) {
  const state = (d.sessionState || '').toLowerCase();
  if (state !== 'checkered' && state !== 'cool down') { _finishLatched = false; return; }
  if (_finishLatched) return;
  if (state === 'cool down' || (d.session || '').toLowerCase() !== 'race') { _finishLatched = true; return; }
  const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  const lead = (d.liveStandings || d.standings || [])[0];
  const cl = lead && d.carLaps ? d.carLaps[lead.carIdx] : undefined;
  const laps = Math.max(d.lapsComplete || 0, cl || 0, (lead && lead.lap) || 0);
  if (lt > 0 && laps < lt) return;
  if (d.lapsRemaining !== undefined && lt > 0 && d.lapsRemaining > 0) return;
  const pct = _leaderTrkPct(d);
  if (pct === null) { _finishLatched = true; return; }
  if (pct < 0.5) _finishLatched = true;
}
function raceFinished(d) {
  const state = (d.sessionState || '').toLowerCase();
  if (state === 'cool down') return true;
  if (state !== 'checkered') return false;
  if ((d.session || '').toLowerCase() !== 'race') return true;
  return _finishLatched;
}

function lapLabel(d) {
  const session = (d.session || '').toLowerCase();
  const state   = (d.sessionState || '').toLowerCase();
  const lc = d.lapsComplete || 0;
  const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  if (session === 'race') {
    if (raceFinished(d)) return RESULTS_TEXT;   // solo cuando el LÍDER ya ha cruzado la meta (ver updateFinishLatch)
    if (state === 'get in car' || state === 'warmup' || state === 'parade laps') return 'PRE-RACE';
    if (lt > 0) {
      const togo = lt - lc;
      if (togo <= 1) return 'FINAL LAP';        // última vuelta, hasta que el líder cruce la meta
      // from 3/4 of the race on: "N TO GO"
      if (lc > 0 && lc >= Math.floor(lt * TO_GO_FROM)) return `${Math.max(togo, 1)} TO GO`;
      return `LAP ${Math.min(lc + 1, lt)} OF ${lt}`;
    }
    return `LAP ${lc + 1}`;
  }
  if (session === 'qualifying') return 'QUALIFYING';
  const t = d.timeRemaining || 0;
  if (t > 0) return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  return 'PRACTICE';
}

// Collapsed ticker (no gaps row, lap plate pressed against the band) for these situations:
const COLLAPSE_ON = { prerace: true, yellow: true, red: false };

let _lastData = null;
function updateHeader(d) {
  _lastData = d;
  const session = (d.session || '').toLowerCase();
  const state   = (d.sessionState || '').toLowerCase();
  const flag    = (d.sessionFlag || '').toLowerCase();
  const isRace  = session === 'race';

  // Green band stays on the last lap (white flag) and after the finish.
  let flagName = 'green';
  if (flag === 'red')         flagName = 'red';
  else if (flag === 'yellow') flagName = 'yellow';
  setFlag(flagName);

  if (flagName === 'red') setPlate('RED FLAG', 'red');
  else { const lt_ = lapLabel(d); setPlate(lt_, lt_ === RESULTS_TEXT ? 'gold' : ''); }

  const preRace = isRace && (state === 'get in car' || state === 'warmup' || state === 'parade laps');
  // Inicio de carrera: la banda ya está verde durante el desfile, así que no hay "cambio de bandera";
  // se lanza el efecto cuando se pasa de pre-carrera a carrera con bandera verde.
  if (FLAG_FX && FLAG_FX_ON_START && _wasPreRace && !preRace && isRace && state === 'racing' && flagName === 'green') { playFlagFx('green'); playFlagSound(); }
  _wasPreRace = preRace;
  const hideGaps = flagName === 'yellow' || flagName === 'red' || preRace || _resShow;
  stripEl.classList.toggle('no-gaps', hideGaps);
  const collapse = (flagName === 'yellow' && COLLAPSE_ON.yellow) || (preRace && COLLAPSE_ON.prerace) || (flagName === 'red' && COLLAPSE_ON.red) || _resShow;   // con el tablero de resultados el ticker también se contrae
  document.getElementById('scale-root').classList.toggle('collapsed', !!collapse);
  gapLabel.classList.toggle('hide', hideGaps);
  const label = (session === 'practice' || session === 'qualifying' || session === 'testing') ? 'BEST LAP' : 'BEHIND LEADER';
  if (gapLabel.textContent !== label) gapLabel.textContent = label;
}

// ── Running order ───────────────────────────────────────────────────────────
let _standings = [], _driverColorsSig = '', _session = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtGap(entry, idx) {
  const status = (entry.status || '').toLowerCase();
  if (status && status !== 'running' && status !== 'pitting') {
    return DNF_DISPLAY === 'out' ? 'OUT' : status.toUpperCase().slice(0, 10);
  }
  if (_session === 'practice' || _session === 'qualifying' || _session === 'testing') {
    const t = entry.time || 0;
    return t > 0 ? t.toFixed(3) : '';
  }
  if (idx === 0) return '';
  const ld = entry.lapsDown || 0;
  if (ld > 0) return `-${ld} ${ld === 1 ? 'LAP' : 'LAPS'}`;
  const t = entry.time || 0;
  return t > 0 ? `-${t.toFixed(2)}` : '';
}

// "Dale Earnhardt Jr." -> "EARNHARDT JR."  (set to false to show the full name)
const LAST_NAME_ONLY = true;
const SHOW_ROOKIE_TAG = true;       // true = keep a small "(R)" after a rookie's name
const SUFFIX = /^(JR\.?|SR\.?|II|III|IV)$/;
// The bridge appends a rookie marker to the name ("Smith R", "Smith (R)", "Smith -R", "Smith*"...).
// Peel it off first, otherwise the "last word" of the name is just the marker and the rookie shows as "R".
const ROOKIE_TAIL = /(?:\s*[\(\[]\s*R\s*[\)\]]|\s*[-\u2013]\s*R\*?|\s+R\*?|\s*\*)\s*$/i;
function splitRookie(raw) {
  let s = String(raw == null ? '' : raw).trim();
  let rookie = false;
  for (let k = 0; k < 2; k++) {
    const m = s.match(ROOKIE_TAIL);
    if (!m || m.index === 0) break;
    s = s.slice(0, m.index).trim(); rookie = true;
  }
  return { name: s, rookie };
}
const isMarkerOnly = t => !t || /^[\(\[]?[-\u2013]?\s*R\*?[\)\]]?$/i.test(t) || /^\d+\s*[-\u2013]?\s*R?$/i.test(t);
const NAME_PARTICLES = new Set(['VAN','VON','DE','DER','DEN','DI','DA','DEL','DELLA','LA','LE','ST.','ST']);
function lastNameOf(full) {
  const t = String(full || '').trim().toUpperCase().split(/\s+/).filter(Boolean);
  if (t.length <= 1) return t[0] || '';
  // keep generational suffixes with the surname: "Earnhardt Jr." -> "EARNHARDT JR."
  const suffix = [];
  while (t.length > 1 && SUFFIX.test(t[t.length - 1])) suffix.unshift(t.pop());
  // keep surname particles: "Van Gisbergen" -> "VAN GISBERGEN"
  let i = t.length - 1;
  while (i > 0 && NAME_PARTICLES.has(t[i - 1])) i--;
  return t.slice(i).concat(suffix).join(' ');
}
// -> { name, rookie } ; falls back to fullName, then to the car number, if the name was only a marker
function entryName(s, num) {
  let r = splitRookie(s.name);
  let rookie = r.rookie;
  let base = r.name;
  if (isMarkerOnly(base) && s.fullName) {
    const f = splitRookie(s.fullName);
    if (f.name && !isMarkerOnly(f.name)) { base = f.name; rookie = rookie || f.rookie || /^[\(\[]?[-\u2013]?\s*R\*?[\)\]]?$/i.test(String(s.name || '').trim()); }
  }
  if (!rookie && s.fullName) rookie = splitRookie(s.fullName).rookie;
  if (isMarkerOnly(base)) base = '';
  const name = LAST_NAME_ONLY ? lastNameOf(base) : String(base).toUpperCase();
  return { name: name || String(num || '?').toUpperCase(), rookie };
}
function shortName(full, num) { return entryName({ name: full }, num).name; }

function copyHTML() {
  const title = (customName || _trackShort || '').trim();
  const titleText = (title ? title + ' ' : '') + TITLE_SUFFIX;
  const sep = SHOW_TITLE
    ? `<div class="entry"><div class="e-top"><span class="e-title">${esc(titleText)}</span></div></div>`
    : `<div class="entry"><div class="e-top"><div class="sep-flag"></div></div></div>`;
  const entries = _standings.map((s, i) => {
    const num  = (s.number || '??').toString().trim();
    const en   = entryName(s, num);
    const name = en.name;
    const rk   = (SHOW_ROOKIE_TAG && en.rookie) ? '<span class="rk"> (R)</span>' : '';
    const gap  = fmtGap(s, i);
    return `<div class="entry" data-caridx="${s.carIdx}">
      <div class="e-top"><div class="e-pos"><i class="nb-d"></i><i class="nb-h"></i><i class="nb-c"></i><span>${i + 1}</span></div><span class="e-name" data-chase-num="${esc(chaseKey(num))}">${esc(num)}-${esc(name)}${rk}</span></div>
      <div class="e-bot"><span class="e-gap-pad"></span><span class="e-gap">${esc(gap)}</span></div>
    </div>`;
  }).join('');
  return sep + entries;
}

let scrollX = 0, loopWidth = 0, lastTs = null, scrollStarted = false;
const START_X = 1456;   // el running order (con el nombre de la carrera) entra desde el borde derecho
const track = document.getElementById('track');

function alignGaps() {
  track.querySelectorAll('.entry').forEach(en => {
    const name = en.querySelector('.e-name'), pad = en.querySelector('.e-gap-pad');
    if (name && pad) pad.style.width = (name.offsetLeft - en.offsetLeft) + 'px';
  });
}
function renderTrack() {
  if (!_standings.length) { track.innerHTML = ''; loopWidth = 0; return; }
  const prevLoop = loopWidth || 0;
  const entering = scrollX > 0;               // aún entrando desde la derecha: no tocar la posición
  const ratio = prevLoop > 0 ? Math.abs(scrollX) / prevLoop : 0;
  const one = copyHTML();
  track.innerHTML = one;
  const w1 = track.scrollWidth;
  const copies = Math.max(1, Math.ceil(1456 / Math.max(w1, 1)));
  const unit = one.repeat(copies);
  track.innerHTML = unit + unit;
  alignGaps();
  _chasePass();
  loopWidth = track.scrollWidth / 2;
  scrollX = entering ? scrollX : (prevLoop > 0 ? -(ratio * loopWidth) : START_X);
  track.style.transform = `translate3d(${scrollX}px,0,0)`;
}
function refreshGaps() {
  const len = _standings.length; if (!len) return;
  track.querySelectorAll('.e-gap').forEach((el, k) => {
    const t = fmtGap(_standings[k % len], k % len);
    if (el.textContent !== t) el.textContent = t;
  });
}
function tickScroll(ts) {
  const dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
  scrollX -= SCROLL_SPEED * dt;
  if (loopWidth > 0 && scrollX <= -loopWidth) scrollX += loopWidth;
  track.style.transform = `translate3d(${scrollX}px,0,0)`;
  lastTs = ts;
  requestAnimationFrame(tickScroll);
}
function startScroll() { if (scrollStarted) return; scrollStarted = true; requestAnimationFrame(tickScroll); }

function getStandings(d) {
  const state = (d.sessionState || '').toLowerCase();
  const flag  = (d.sessionFlag  || '').toLowerCase();
  const liveEnabled = d.liveStandingsEnabled !== false;
  const live = d.liveStandings || d.standings || [];
  if (state === 'cool down' || flag === 'yellow') return d.standings || [];
  if (state === 'checkered' && raceFinished(d) && liveEnabled && Array.isArray(d.computedStandings) && d.computedStandings.length)
    return d.computedStandings;
  return liveEnabled && live.length ? live : (d.standings || []);
}

// ── Main render ─────────────────────────────────────────────────────────────
let _lastOrder = '', _lastSessionNum = null, _lastSessionCookie = null;
function resetState() {
  _lastOrder = ''; _standings = []; _finishLatched = false;
  _plateTxt = ''; _plateCls = ''; _flagCls = ''; _wasPreRace = false;
  track.innerHTML = ''; loopWidth = 0; scrollX = START_X; semHide(); resetResults();
}
function render(d) {
  updateFinishLatch(d);
  updateResults(d);
  if (!checkVisibility(d)) { setVisible(false); return; }
  setVisible(true);
  _session = (d.session || '').toLowerCase();

  const hadPrior = _lastSessionNum !== null && _lastSessionCookie !== null;
  if (hadPrior && (d.sessionNum !== _lastSessionNum || d.sessionCookie !== _lastSessionCookie)) resetState();
  _lastSessionNum = d.sessionNum; _lastSessionCookie = d.sessionCookie;

  updateHeader(d);

  const tn = d.trackNameShort || d.track || '';
  if (tn !== _trackShort) { _trackShort = tn; _lastOrder = ''; }

  const standings = getStandings(d);
  if (!standings.length) return;
  const order = standings.map(s => s.carIdx).join(',');
  if (order !== _lastOrder) { _lastOrder = order; _standings = standings; renderTrack(); }
  else                      { _standings = standings; refreshGaps(); }
}

// ── WebSocket ───────────────────────────────────────────────────────────────
let _ws = null;
function connect() {
  _ws = new WebSocket(WS_URL);
  _ws.onmessage = e => {
    if (_preview) return;
    try {
      const d = JSON.parse(e.data);
      if (d.reset) { setVisible(false); _lastSessionNum = null; _lastSessionCookie = null; resetState(); return; }
      render(d);
    } catch (_) {}
  };
  _ws.onclose = () => { if (!_preview) setTimeout(connect, 2000); };
  _ws.onerror = () => _ws.close();
}

// ── Layout editor preview ───────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (typeof e.data !== 'string') return;
  try {
    const m = JSON.parse(e.data);
    if (Array.isArray(m._chase)) _setChase(m._chase);
    if (m.reset) return;
    if (!_preview) { _preview = true; if (_ws) { _ws.onclose = null; _ws.close(); } }
    if (m._visibilityMode !== undefined) VISIBILITY_MODE = m._visibilityMode;
    if (m._dnfDisplay     !== undefined) { DNF_DISPLAY = m._dnfDisplay; _lastOrder = ''; }
    if (m._scrollSpeed    !== undefined) SCROLL_SPEED = parseFloat(m._scrollSpeed);
    if (m._yellowSound    !== undefined) { const was = FLAG_SOUND; FLAG_SOUND = !!m._yellowSound; if (FLAG_SOUND && !was) playFlagSound(true); }   // al activarlo suena una vez de prueba
    if (m._customName     !== undefined) { customName = m._customName; _lastOrder = ''; if (_lastData) render(_lastData); }
    if (m._sponsorRotationTime !== undefined) {
      ROTATION_MS = Math.max(2, parseInt(m._sponsorRotationTime) || 10) * 1000;
      if (_sponsors.length > 1) startSponsorTimer();
    }
    if (m.atTrack !== undefined || m.standings !== undefined) render(m);
    else setVisible(true);
  } catch (_) {}
});

// ── Boot ────────────────────────────────────────────────────────────────────
loadSponsors();
startScroll();
connect();
</script>
</body>
</html>
