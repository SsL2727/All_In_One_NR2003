<!DOCTYPE html>
<html lang="en">
<head>
<script src="perf-shim.js"></script>
<script src="pp-view.js"></script>
<meta charset="UTF-8">
<title>NR2003 Fox 2016 Ticker</title>
<style>
.chase { background: #f5d100 !important; color: #111 !important; text-shadow: none !important;
         box-shadow: -3px 0 0 #f5d100, 3px 0 0 #f5d100; }
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'Fox2016', 'Gotham', 'Montserrat', 'Segoe UI Semibold', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}

body { background: transparent; width: 1184px; height: 332px; overflow: hidden; font-family: var(--font); font-weight: 700; }

#scale-root { position: relative; width: 1184px; height: 332px; transform-origin: top left; visibility: hidden; }

/* ── ticker row ───────────────────────────────────────────────────────── */
#ticker { position: absolute; left: 0; top: 2px; height: 130px; display: flex; gap: 6px; }

.frame {
  height: 130px; padding: 5px; border-radius: 9px; display: flex; gap: 8px;
  background: linear-gradient(180deg, #a9b1c6 0%, #8b93a9 45%, #6f778d 100%);
  box-shadow: 0 2px 7px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.35);
}
#frame-a { width: 740px; }
.frame-n { width: 438px; }
.frame.empty { display: none; }

/* ── left plate: race name + laps to go (green) / sponsor (yellow) ───── */
#plate { width: 277px; height: 120px; border-radius: 6px; overflow: hidden; flex: none; display: flex; flex-direction: column;
         box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
#plate-top {
  height: 68px; padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #4b8a53 0%, #17641d 14%, #05430a 52%, #003206 100%);
  color: #d7f7d2; text-shadow: 0 1px 2px rgba(0,0,0,.65);
  transition: background .35s;
}
#plate.yellow #plate-top { background: linear-gradient(180deg, #e8b04a 0%, #c98a0a 16%, #9c6500 55%, #7d4f00 100%); color: #fff6dc; }
#plate.red    #plate-top { background: linear-gradient(180deg, #e0646a 0%, #c0101a 16%, #8d0008 55%, #6c0006 100%); color: #ffe4e4; }
#plate-top .l { display: block; white-space: nowrap; font-size: 27px; line-height: 31px; letter-spacing: .6px; text-transform: uppercase; }
#plate-top .l .sm { font-size: .72em; }

#sponsor-zone {
  position: relative; flex: 1; overflow: hidden;
  background: linear-gradient(180deg, #f4d012 0%, #e6bc00 55%, #dcb100 100%);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.22);
}
#sponsor-zone img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; object-position: center;
                    opacity: 0; transition: opacity .6s ease; }
#sponsor-zone img.on { opacity: 1; }
#sponsor-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              font-size: 22px; letter-spacing: 3px; color: rgba(70,50,0,.35); }
#sponsor-ph.hide { display: none; }

/* ── data panels ──────────────────────────────────────────────────────── */
.panel {
  flex: 1; height: 120px; border-radius: 6px; overflow: hidden; position: relative;
  background: linear-gradient(180deg, #1d2d3b 0%, #142230 55%, #0e1a25 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
}
.hdr { height: 30px; display: grid; grid-template-columns: 40px 56px 1fr 120px; align-items: center; padding: 0 10px 0 6px;
       color: #dfe8f1; font-size: 20px; letter-spacing: .6px; background: rgba(255,255,255,.035); }
.hdr .h-lead { grid-column: 2 / 4; padding-left: 0; }
.hdr .h-gap  { text-align: right; }
#ticker.no-gaps .h-gap { visibility: hidden; }

.rows { transition: opacity .25s ease, transform .25s ease; }
.rows.fade { opacity: 0; transform: translateY(-5px); }
.row { height: 30px; display: grid; grid-template-columns: 40px 56px 1fr 120px; align-items: center; padding: 0 10px 0 6px;
       color: #f1f5f9; font-size: 22px; letter-spacing: .4px; }
.row:nth-child(even) { background: rgba(255,255,255,.028); }
.r-pos  { text-align: right; padding-right: 10px; }
.r-name { white-space: nowrap; overflow: hidden; text-overflow: clip; padding-left: 4px; text-transform: uppercase; }
.r-gap  { text-align: right; white-space: nowrap; }
#ticker.no-gaps .r-gap { visibility: hidden; }

/* car number plate */
.np { position: relative; width: 52px; height: 26px; border-radius: 2px; overflow: hidden; background: #3b3f47; }
.np-c { position: absolute; inset: 0; }
.np img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.np .np-t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-style: italic; font-weight: 800; letter-spacing: -.5px; }

/* ── final lap (white flag) / results ─────────────────────────────────── */
#plate.white #plate-top { background: linear-gradient(180deg, #fbfbfb 0%, #e6e8eb 18%, #c6c9ce 60%, #aaaeb4 100%);
                          color: #14171b; text-shadow: 0 1px 0 rgba(255,255,255,.55); }
#plate.results #plate-top { background: linear-gradient(180deg, #3a4e63 0%, #1f3041 18%, #142230 58%, #0e1a25 100%);
                            color: #eef3f8; }
/* light panels (first seconds of the white flag): a light layer fades in over the dark panel */
.panel::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease; pointer-events: none;
                 background: linear-gradient(180deg, #f6f7f8 0%, #e3e5e8 55%, #d3d6da 100%); }
.panel > * { position: relative; z-index: 1; }
#ticker.light .panel::before { opacity: 1; }
.hdr, .row { transition: color .45s ease, background-color .45s ease; }
#ticker.light .hdr { color: #1b1f24; background: rgba(0,0,0,.05); }
#ticker.light .row { color: #14181d; }
#ticker.light .row:nth-child(even) { background: rgba(0,0,0,.045); }
/* yellow flag (first seconds): gold panels + gold plate, gaps visible, position arrows */
#ticker.yel .panel::before { opacity: 1; background: linear-gradient(180deg, #fad23f 0%, #efb41c 55%, #dc9a0c 100%); }
#ticker.yel .hdr { color: #1a1306; background: rgba(0,0,0,.05); }
#ticker.yel .row { color: #17110a; }
#ticker.yel .row:nth-child(even) { background: rgba(0,0,0,.05); }
#plate.yellow.bright #plate-top { background: linear-gradient(180deg, #fcd95c 0%, #f2bb2c 16%, #e1a114 55%, #c98a08 100%);
                                  color: #17110a; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
/* green flag (first seconds): green panels + green plate */
#ticker.grn .panel::before { opacity: 1; background: linear-gradient(180deg, #86dc74 0%, #52b447 55%, #3c9a34 100%); }
#ticker.grn .hdr { color: #0b210a; background: rgba(0,0,0,.05); }
#ticker.grn .row { color: #0c1f0b; }
#ticker.grn .row:nth-child(even) { background: rgba(0,0,0,.05); }
#plate.gnow #plate-top { background: linear-gradient(180deg, #93e281 0%, #5fc04f 16%, #40a037 55%, #2f8a2a 100%);
                         color: #0b230a; text-shadow: 0 1px 0 rgba(255,255,255,.3); }
/* position-change arrows (replace the position number) */
.arw { display: inline-block; width: 28px; height: 22px; vertical-align: middle; }
.arw.up { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, #a6f58a 0%, #43c32d 45%, #1f8f14 100%); }
.arw.dn { clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(0deg, #ff9a8a 0%, #ec3b2c 45%, #b3120b 100%); }
.row { will-change: transform; }
/* ── "As they run": championship top 5 under the plate (toggled by the Points Table hotkey) ── */
#pp-wrap { position: absolute; left: 0; top: 138px; }
#pp-frame { width: max-content; height: auto; display: block; opacity: 0; visibility: hidden; transform: translateY(-14px);
            transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s linear .4s; }
#pp-wrap.show #pp-frame { opacity: 1; visibility: visible; transform: none;
            transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s; }
#pp-frame .panel { height: auto; flex: none; }
.pp-hdr { display: block; height: 26px; line-height: 26px; font-size: 18px; padding: 0 12px 0 10px; text-transform: uppercase; white-space: nowrap; }
.pr { height: 28px; display: grid; grid-template-columns: 22px 52px auto; column-gap: 8px; align-items: center; padding: 0 12px 0 8px;
      color: #f1f5f9; font-size: 21px; letter-spacing: .4px; position: relative; }
.pr:nth-child(even) { background: rgba(255,255,255,.028); }
.pr .r-pos { text-align: right; padding-right: 0; }
.pr-gap { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 64px; }
.pr-cut { height: 18px; line-height: 18px; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden;
          background: var(--cc, #e8232a); color: var(--ct, #fff); text-shadow: 0 1px 1px rgba(0,0,0,.55); }
.pr-gap.ld { font-size: 16px; letter-spacing: .8px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="scale-root">
  <div id="ticker">
    <div class="frame" id="frame-a">
      <div id="plate">
        <div id="plate-top"><span class="l" id="l1"></span><span class="l" id="l2"></span></div>
        <div id="sponsor-zone"><img id="sponsor-a" src="" alt=""><img id="sponsor-b" src="" alt=""><div id="sponsor-ph">SPONSOR</div></div>
      </div>
      <div class="panel">
        <div class="hdr"><span class="h-lead" id="h-lead">LEADERS</span><span class="h-gap" id="h-gap">BEHIND</span></div>
        <div class="rows" id="rows-0"></div>
      </div>
    </div>
    <div class="frame frame-n" id="frame-1"><div class="panel"><div class="rows" id="rows-1"></div></div></div>
    <div class="frame frame-n" id="frame-2"><div class="panel"><div class="rows" id="rows-2"></div></div></div>
  </div>
  <div id="pp-wrap">
    <div class="frame" id="pp-frame">
      <div class="panel">
        <div class="hdr pp-hdr">As They Run</div>
        <div id="pp-rows"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Chase (highlighted cars) ───────────────────────────────────────────────
let _CHASE = new Set();
const chaseKey = n => String(n == null ? '' : n).trim().replace(/"/g, '');
function _chasePass() {
  document.querySelectorAll('[data-chase-num]').forEach(el =>
    el.classList.toggle('chase', _CHASE.size > 0 && _CHASE.has(el.dataset.chaseNum)));
}
function _setChase(list) {
  _CHASE = new Set((Array.isArray(list) ? list : []).map(chaseKey));
  _chasePass();
}
if (window.shl && window.shl.onChaseSet) {
  window.shl.onChaseSet(_setChase);
  if (window.shl.getChaseSet) window.shl.getChaseSet().then(_setChase).catch(() => {});
}

// ── PSF bootstrap ──────────────────────────────────────────────────────────
const psf           = window.__PSF || {};
const params        = new URLSearchParams(location.search);
const INSTALL_DIR   = psf.installDir || params.get('installdir') || '';
const SCALE         = parseFloat(psf.scale   || params.get('scale')   || '1');
const OPACITY       = parseFloat(psf.opacity || params.get('opacity') || '1');
const WS_URL        = psf.wsUrl || `ws://${location.hostname || 'localhost'}:8765`;
const SERIES_ID     = psf.series || params.get('series') || '';
let   ROTATION_MS   = (parseInt(psf.sponsorrotationtime || params.get('sponsorrotationtime') || '10')) * 1000;
let VISIBILITY_MODE = psf.visibilitymode || params.get('visibilitymode') || 'at_track';
let DNF_DISPLAY     = psf.dnfdisplay || params.get('dnfdisplay') || 'reason';
let COLUMNS         = (parseInt(psf.columns || params.get('columns') || '2') === 3) ? 3 : 2;   // 2 or 3 columns
const PAGE_MS       = Math.max(2, parseInt(psf.pagetime || params.get('pagetime') || '6')) * 1000;   // seconds each page of the field stays up
// Race name shown on the green plate ("DAYTONA 500"). Edit it in the layout editor ("Race Name");
// if left empty the track name from the sim is used.
let customName = psf.customname ? decodeURIComponent(psf.customname)
               : (params.get('customname') ? decodeURIComponent(params.get('customname')) : '');
let _trackShort = '';
const TO_GO_FROM = 0.75;       // lap counter switches from "LAP X OF Y" to "N TO GO" after this fraction of the race
const LAST_NAME_ONLY = true;

function assetPath(rel) {
  if (psf.assetBase) return psf.assetBase + '/' + rel;
  if (INSTALL_DIR) {
    const enc = INSTALL_DIR.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    return 'file:///' + enc + '/' + rel;
  }
  return rel;
}
const FOX_BASE = assetPath('images/Fox2016');

// Optional font: drop a font.ttf into images/Fox2016 to replace the fallback font.
(function injectFonts() {
  const el = document.createElement('style');
  el.textContent = `@font-face { font-family:'Fox2016'; src:url('${FOX_BASE}/font.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }`;
  document.head.appendChild(el);
})();

// ── Scale / size (depends on the number of columns) ─────────────────────────
const WIDTH_BY_COLS = { 2: 1184, 3: 1628 }, HEIGHT = 388;   // 132 ticker + 6 gap + 246 'As they run' column (header + 7 rows)
const root = document.getElementById('scale-root');
const frames = [document.getElementById('frame-a'), document.getElementById('frame-1'), document.getElementById('frame-2')];
const rowsEl = [document.getElementById('rows-0'), document.getElementById('rows-1'), document.getElementById('rows-2')];
function applySize() {
  const W = WIDTH_BY_COLS[COLUMNS];
  root.style.width = W + 'px';
  root.style.transform = `scale(${SCALE})`;
  document.body.style.width  = Math.round(W * SCALE) + 'px';
  document.body.style.height = Math.round(HEIGHT * SCALE) + 'px';
}
applySize();

// ── Visibility ───────────────────────────────────────────────────────────
let _preview = false;
function checkVisibility(d) {
  if (_preview) return true;
  switch (VISIBILITY_MODE) {
    case 'always': return true;
    case 'in_car': return !!(d.atTrack && d.player?.inCar);
    default:       return !!d.atTrack;
  }
}
const tickerEl = document.getElementById('ticker');
function setVisible(v) {
  root.style.visibility = v ? 'visible' : 'hidden';
  tickerEl.style.opacity = v ? OPACITY : '0';
  const ppw = document.getElementById('pp-wrap'); if (ppw) ppw.style.opacity = v ? OPACITY : '0';
}

// ── Sponsor (bottom of the plate) ───────────────────────────────────────────
// Put the sponsor images in images/Fox2016/sponsors/ : sponsor.png (single image) and/or sponsor01.png … sponsor20.png
// (also accepted: sponsor_01.png …). With several images they rotate. Fallback: the same names directly in images/Fox2016/.
// Each image fills the whole sponsor area of the plate: 277 x 52 px (use 1108 x 208 px, see sponsor_template.png)
let _sponsors = [], _sIdx = 0, _sFront = 'a', _sponsorTimer = null;
async function probeSponsors(folder) {
  const names = ['sponsor.png'];
  for (let i = 1; i <= 20; i++) {
    const n2 = String(i).padStart(2, '0');
    names.push(`sponsor${n2}.png`, `sponsor_${n2}.png`);
    if (i < 10) names.push(`sponsor${i}.png`, `sponsor_${i}.png`);
  }
  const found = await Promise.all(names.map(n => new Promise(res => {
    const img = new Image(), src = `${folder}/${n}`;
    img.onload = () => res(src); img.onerror = () => res(null); img.src = src;
  })));
  return found.filter(Boolean);
}
async function loadSponsors() {
  let list = await probeSponsors(`${FOX_BASE}/sponsors`);
  if (!list.length) list = await probeSponsors(FOX_BASE);
  _sponsors = list;
  if (!_sponsors.length) return;
  document.getElementById('sponsor-ph').classList.add('hide');
  const a = document.getElementById('sponsor-a');
  a.src = _sponsors[0]; a.classList.add('on');
  if (_sponsors.length > 1) startSponsorTimer();
}
function startSponsorTimer() {
  if (_sponsorTimer) clearInterval(_sponsorTimer);
  _sponsorTimer = setInterval(nextSponsor, ROTATION_MS);
}
function nextSponsor() {
  _sIdx = (_sIdx + 1) % _sponsors.length;
  const front = document.getElementById('sponsor-' + _sFront);
  const backId = _sFront === 'a' ? 'b' : 'a';
  const back = document.getElementById('sponsor-' + backId);
  back.onload = () => { back.classList.add('on'); front.classList.remove('on'); _sFront = backId; back.onload = null; };
  back.src = _sponsors[_sIdx];
}

// ── Car numbers (series/<id>/numbers/<num>.png), probed once and cached ─────
let _driverColors = {};
const _numInfo = {};
const FB_DEFAULT_BG = '#3b3f47';
const _ccCtx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const _lumCache = {};
function bgLuma(c) {
  if (!c || c === 'transparent') return -1;
  if (_lumCache[c] !== undefined) return _lumCache[c];
  let v = -1;
  try {
    _ccCtx.clearRect(0, 0, 1, 1); _ccCtx.fillStyle = '#000'; _ccCtx.fillStyle = c; _ccCtx.fillRect(0, 0, 1, 1);
    const d = _ccCtx.getImageData(0, 0, 1, 1).data;
    if (d[3] >= 32) v = (0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]) / 255;
  } catch (_) {}
  return (_lumCache[c] = v);
}
function sampleCorners(img) {
  try {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const w = c.width, h = c.height, i = 3;
    const px = [g.getImageData(i, i, 1, 1).data, g.getImageData(w - i - 1, i, 1, 1).data,
                g.getImageData(i, h - i - 1, 1, 1).data, g.getImageData(w - i - 1, h - i - 1, 1, 1).data];
    const op = px.filter(p => p[3] >= 32);
    if (op.length < 3) return null;
    const a = op.reduce((t, p) => [t[0] + p[0], t[1] + p[1], t[2] + p[2]], [0, 0, 0]).map(v => Math.round(v / op.length));
    return `rgb(${a[0]},${a[1]},${a[2]})`;
  } catch (_) { return null; }
}
// crop the empty margin of the number PNG so the digits fill the plate
function trimNumber(img, bgCss) {
  try {
    const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return null;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const data = g.getImageData(0, 0, w, h).data;
    let bg = null;
    if (bgCss) { const m = /rgb\((\d+),(\d+),(\d+)\)/.exec(bgCss); if (m) bg = [+m[1], +m[2], +m[3]]; }
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (data[i + 3] < 40) continue;
      if (bg && Math.abs(data[i] - bg[0]) + Math.abs(data[i + 1] - bg[1]) + Math.abs(data[i + 2] - bg[2]) < 60) continue;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < x0 || y1 < y0) return null;
    const tw = x1 - x0 + 1, th = y1 - y0 + 1;
    if (tw >= w - 1 && th >= h - 1) return null;
    const o = document.createElement('canvas'); o.width = tw; o.height = th;
    o.getContext('2d').drawImage(c, x0, y0, tw, th, 0, 0, tw, th);
    return o.toDataURL('image/png');
  } catch (_) { return null; }
}
function numColor(num) { const i = _numInfo[num]; return _driverColors[num] || (i && i.color) || FB_DEFAULT_BG; }
function loadNumber(num) {
  if (_numInfo[num]) return;
  const src = SERIES_ID ? assetPath(`series/${SERIES_ID}/numbers/${encodeURIComponent(num)}.png`) : '';
  if (!src) { _numInfo[num] = { state: 'fail' }; return; }
  const n = _numInfo[num] = { state: 'loading', src };
  const img = new Image();
  img.onload = () => {
    n.color = sampleCorners(img);
    const t = trimNumber(img, n.color); if (t) n.src = t;
    n.state = 'ok'; patchNumber(num);
  };
  img.onerror = () => { n.state = 'fail'; patchNumber(num); };
  img.src = src;
}
function numInnerHTML(num) {
  const i = _numInfo[num], bg = numColor(num);
  const layer = `<span class="np-c" style="background:${esc(bg)}"></span>`;
  if (i && i.state === 'ok') return layer + `<img src="${i.src}" alt="${esc(num)}">`;
  const fg = bgLuma(bg) > 0.6 ? '#111' : '#fff';
  const hide = (i && i.state === 'fail') ? '' : 'visibility:hidden;';
  return layer + `<span class="np-t" style="${hide}color:${fg}">${esc(num)}</span>`;
}
function numberHTML(num) { loadNumber(num); return `<div class="np" data-num="${esc(num)}">${numInnerHTML(num)}</div>`; }
function patchNumber(num) { document.querySelectorAll('.np').forEach(w => { if (w.dataset.num === num) w.innerHTML = numInnerHTML(num); }); }
function resetNumberCache() { Object.keys(_numInfo).forEach(k => { if (_numInfo[k].state !== 'ok') delete _numInfo[k]; }); }

// ── Finish detection (same logic as the other Fox tickers) ──────────────────
let _finishLatched = false;
function _leaderTrkPct(d) {
  const lead = (d.liveStandings || d.standings || [])[0];
  if (!lead) return null;
  if (d.playerCarIdx === lead.carIdx && d.player && typeof d.player.trkPct === 'number') return d.player.trkPct;
  if (d.carTrkPct && typeof d.carTrkPct[lead.carIdx] === 'number') return d.carTrkPct[lead.carIdx];
  return null;
}
function updateFinishLatch(d) {
  const state = (d.sessionState || '').toLowerCase();
  if (state !== 'checkered' && state !== 'cool down') { _finishLatched = false; return; }
  if (_finishLatched) return;
  if (state === 'cool down' || (d.session || '').toLowerCase() !== 'race') { _finishLatched = true; return; }
  const lt = (d.lapsTotal && d.lapsTotal < 32767) ? d.lapsTotal : 0;
  const lead = (d.liveStandings || d.standings || [])[0];

  const bLed = Number(cfg.bonusLedLap) || 0, bMost = Number(cfg.bonusMostLed) || 0;
  let maxLed = 0; Object.keys(led).forEach(k => { if (led[k] > maxLed) maxLed = led[k]; });
  const race = new Map();
  getStandings(d).forEach((st, i) => { const k = normNum(st.number); if (!race.has(k)) race.set(k, i + 1); });
  const stageMap = project ? stagePtsMap(d, cfg) : {};
  const seen = new Set(), rows = [];
  cfg.drivers.forEach((dr, idx) => {
    const k = normNum(dr.number); if (seen.has(k)) return; seen.add(k);
    const base = Number(dr.points) || 0, pos = race.get(k), ledN = led[k] || 0;
    const add = project ? ((pos ? (Number(table[pos - 1]) || 0) : 0) + (ledN > 0 ? bLed : 0) + (ledN > 0 && ledN === maxLed ? bMost : 0) + (stageMap[k] || 0)) : 0;
    rows.push({ number: k, base, total: base + add, idx, rpos: pos || 0 });
  });
  rows.sort((a, b) => (b.total - a.total) || (b.base - a.base) || (a.idx - b.idx));
  return PPV.pick(rows, 5);
}

function ppRender(d) {
  if (!d) return;
  const rows = ppRows(d);
  const key = rows.map(r => r.number + ':' + r.total).join('|') + '|' + PPV.key();
  if (key === _ppKey) return;
  _ppKey = key;
  const host = document.getElementById('pp-rows');
  const old = {};
  host.querySelectorAll('.pr').forEach(r => { old[r.dataset.n] = r.getBoundingClientRect().top; });
  const lead = rows.length ? rows[0].total : 0, fmt = v => Math.round(v * 100) / 100;
  const cb = PPV.cutBand(rows), esc2 = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  host.innerHTML = rows.map((r, i) =>
    `<div class="pr" data-n="${esc(r.number)}"><span class="r-pos">${PPV.pos(r, i + 1)}</span>${numberHTML(r.number)}` +
    `<span class="pr-gap${PPV.isDefault() && r.cpos === 1 ? ' ld' : ''}">${PPV.val(r, r.cpos === 1 ? 'Leader' : '-' + fmt(r.lead - r.total))}</span></div>` + (cb && cb.after === i ? `<div class="pr-cut" style="--cc:${cb.color};--ct:${cb.textColor}">${esc2(cb.text)}</div>` : '')).join('');
  if (!_ppOn) return;
  // a driver changes place: glide to the new row
  let moved = false;
  host.querySelectorAll('.pr').forEach(r => {
    const t = old[r.dataset.n]; if (t === undefined) return;
    const dy = (t - r.getBoundingClientRect().top) / (SCALE || 1);
    if (Math.abs(dy) < 1) return;
    r.style.transition = 'none'; r.style.transform = `translateY(${dy}px)`; r.style.zIndex = dy > 0 ? '3' : '2'; moved = true;
  });
  if (!moved) return;
  void host.offsetHeight;
  host.querySelectorAll('.pr').forEach(r => {
    if (!r.style.transform) return;
    r.style.transition = `transform ${SLIDE_MS}ms cubic-bezier(.4,0,.2,1)`; r.style.transform = '';
  });
  _ppTimers.push(setTimeout(() => host.querySelectorAll('.pr').forEach(r => { r.style.transition = ''; r.style.zIndex = ''; }), SLIDE_MS + 60));
}

// Called with every data frame, whether or not the column is currently visible
function ppFeed(d) {
  trackLed(d);
  _ppData = d;
  if (_ppOn) ppRender(d);
}

function ppToggle() {
  const wrap = document.getElementById('pp-wrap');
  _ppTimers.forEach(clearTimeout); _ppTimers = [];
  if (!_ppOn) {                       // enter: the column drops out under the plate
    _ppOn = true; _ppKey = '';
    ppRender(_ppData || {});
    void wrap.offsetWidth;
    wrap.classList.add('show');
  } else {                            // exit
    _ppOn = false;
    wrap.classList.remove('show');
  }
}
window.__togglePoints = ppToggle;
PPV.onChange(() => { _ppKey = ''; if (_ppOn && _ppData) ppRender(_ppData); });
if (window.shl && window.shl.onPointsToggle) window.shl.onPointsToggle(ppToggle);

// ── WebSocket ───────────────────────────────────────────────────────────────
let _ws = null;
function connect() {
  _ws = new WebSocket(WS_URL);
  _ws.onmessage = e => {
    if (_preview) return;
    try {
      const d = JSON.parse(e.data);
      if (d.reset) { setVisible(false); _lastSessionNum = null; _lastSessionCookie = null; resetState(); return; }
      render(d);
    } catch (_) {}
  };
  _ws.onclose = () => { if (!_preview) setTimeout(connect, 2000); };
  _ws.onerror = () => _ws.close();
}

// ── Layout editor preview ───────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (typeof e.data !== 'string') return;
  try {
    const m = JSON.parse(e.data);
    if (Array.isArray(m._chase)) _setChase(m._chase);
    if (m.reset) return;
    if (m._pointsToggle) { ppToggle(); return; }
    if (!_preview) { _preview = true; if (_ws) { _ws.onclose = null; _ws.close(); } }
    if (m._visibilityMode !== undefined) VISIBILITY_MODE = m._visibilityMode;
    if (m._dnfDisplay     !== undefined) { DNF_DISPLAY = m._dnfDisplay; _sigs = ['', '', '']; }
    if (m._columns        !== undefined) {
      COLUMNS = (parseInt(m._columns) === 3) ? 3 : 2; _pageIdx = 0; _sigs = ['', '', ''];
      applySize(); if (_lastData) render(_lastData);
    }
    if (m._customName     !== undefined) { customName = m._customName; _t1 = null; if (_lastData) render(_lastData); }
    if (m._sponsorRotationTime !== undefined) {
      ROTATION_MS = Math.max(2, parseInt(m._sponsorRotationTime) || 10) * 1000;
      if (_sponsors.length > 1) startSponsorTimer();
    }
    if (m.atTrack !== undefined || m.standings !== undefined) render(m);
    else setVisible(true);
  } catch (_) {}
});

// ── Boot ────────────────────────────────────────────────────────────────────
loadSponsors();
startPageTimer();
connect();
</script>
</body>
